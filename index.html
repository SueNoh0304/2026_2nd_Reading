 companies resisted rap, and even in the mid-1990s only a small portion of the music on the Billboard rap singles chart was produced by the major labels.", "g": [["② For a decade", "② 흐름에 맞음", "주요 음반사가 랩을 거부했다 = 기성 산업의 접근이 막혀 있었다는 근거다.", "v"], ["only a small portion of the music", "주어부", "긴 주어. 동사는 was produced. of the music on the Billboard rap singles chart가 portion을 수식한다.", "g"]]}], [{"en": "③ The radio industry (which usually makes or breaks the success of any piece of music) ignored rap because its audience is not a priority for radio advertisers to reach.", "g": [["③ The radio industry", "③ 흐름에 맞음", "음반사에 이어 라디오 산업도 랩을 무시했다. '접근 없음'의 세 번째 예다.", "v"], ["which usually makes or breaks", "괄호 안 관계사절", "The radio industry를 보충 설명한다. make or break는 '성공시키거나 망치다'.", "g"], ["for radio advertisers to reach", "to부정사의 의미상 주어", "for radio advertisers가 to reach의 의미상 주어. a priority를 수식하는 형용사적 용법이다.", "g"]]}, {"en": "④ Radio ads are still a powerful and effective tool for your business — in fact, every week, over 90% of Americans listen to the radio.", "g": [["④ Radio ads are still a powerful and effective tool", "④ 무관 — 정답", "'라디오'라는 단어만 같다. 랩이 산업 밖에서 번성했다는 이야기에서 갑자기 라디오 광고의 효과를 홍보한다. your business라는 독자 호칭도 글의 문체와 다르다.", "v"]]}, {"en": "⑤ For example, New York does not have a single rap station, although it has two full-time classical radio stations.", "g": [["⑤ For example", "⑤ 흐름에 맞음", "③의 '라디오가 랩을 무시했다'의 구체적 예다. ④를 빼면 ③ → ⑤가 자연스럽게 이어진다.", "v"], ["not have a single rap station", "not a single = 강한 부정", "'단 하나도 없다'. 뒤의 two full-time classical stations와 대비된다.", "v"]]}]], "choices": [["Rap music is mainly disseminated on homemade cassettes and by locally owned independent record companies.", false, "랩의 보급 경로도 기성 산업 밖이라는 예다. 흐름에 맞다."], ["For a decade, the major recording companies resisted rap, and even in the mid-1990s only a small portion of the music on the Billboard rap singles chart was produced by the major labels.", false, "주요 음반사가 랩을 거부했다는 근거다. 흐름에 맞다."], ["The radio industry (which usually makes or breaks the success of any piece of music) ignored rap because its audience is not a priority for radio advertisers to reach.", false, "라디오 산업도 랩을 무시했다는 세 번째 예다. 흐름에 맞다."], ["Radio ads are still a powerful and effective tool for your business — in fact, every week, over 90% of Americans listen to the radio.", true, "정답. 라디오 광고의 효과를 홍보하는 문장으로, 랩이 음악 산업 밖에서 번성했다는 주제와 무관하다."], ["For example, New York does not have a single rap station, although it has two full-time classical radio stations.", false, "③의 '라디오가 랩을 무시했다'를 뉴욕의 예로 뒷받침한다. 흐름에 맞다."]], "flow": ["주제 — 랩은 기성 음악 산업에 접근하지 못한 채 번성했다", "제작 — 집에서 값싼 장비로 만든다 (스튜디오의 다른 장르와 대조)", "보급 — 홈메이드 카세트, 독립 음반사 / 주요 음반사는 랩을 거부", "방송 — 라디오 산업도 랩을 무시 → 예: 뉴욕에 랩 방송국이 하나도 없다", "④ — 라디오 광고 효과 홍보. 주제와 무관"], "bg": "랩(힙합)은 1970년대 뉴욕 브롱크스의 파티 문화에서 시작되어, 턴테이블과 마이크 같은 값싼 장비로 만들어졌다. 주류 음악 산업이 외면하는 동안 카세트 테이프와 독립 레이블을 통해 퍼졌고, 1990년대 이후 결국 세계에서 가장 영향력 있는 장르가 되었다. 무관한 문장 문제에서는 '같은 단어(radio)가 나온다'는 것에 속지 말고, 그 문장이 주제를 뒷받침하는지를 봐야 한다.", "quiz": [{"q": "대부분의 랩이 제작되는 곳은?", "opts": ["대형 음향 스튜디오", "아티스트의 집", "라디오 방송국"], "a": 1, "exp": "Most rap is performed by artists in their own homes, using inexpensive, widely accessible equipment."}, {"q": "라디오 산업이 랩을 무시한 이유는?", "opts": ["랩 청취자가 광고주의 우선 대상이 아니어서", "랩이 너무 시끄러워서", "법으로 금지되어서"], "a": 0, "exp": "ignored rap because its audience is not a priority for radio advertisers to reach."}]}, {"no": 2905, "dn": "5", "label": "DAY 29 · 5번", "type": "요약문 완성", "answer": 4, "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "summary": "One reason successful writers tend to suffer from (A)__________ is because an important element of creative work is (B)__________.", "subject": "작가의 정신적 부담과 끈기", "vocab": [["neuroscientist", "신경 과학자", 1, "🔬", "Nancy Andreasen, a neuroscientist at the University of Iowa, interviewed several dozen successful writers …", "n"], ["exceedingly", "극도로, 몹시", 5, "📈", "Andreasen found that 80 percent of the writers were exceedingly worried and nervous.", "ad"], ["burden", "부담, 짐", 6, "🎒", "Why is severe mental burden so closely associated with creativity?", "n"], ["straightforward", "간단한, 명료한", 8, "➡️", "Her explanation is straightforward: It’s not easy to write a good novel.", "a"], ["stick with", "~을 계속하다", 11, "🧲", "As a result, the ability to stick with the process is extremely important.", "phr"], ["prizefighter", "프로 권투 선수", 12, "🥊", "“Successful writers are like prizefighters who keep on getting hit but won’t go down,”", "n"], ["despondency", "낙심, 실망", 20, "🌧️", "… to suffer from feelings of severe despondency and dejection.", "n"]], "pages": [[{"en": "In the early 1980s, Nancy Andreasen, a neuroscientist at the University of Iowa, interviewed several dozen successful writers from the Iowa Writers’ Workshop about their mental history.", "g": [["a neuroscientist at the University of Iowa", "동격 명사구", "Nancy Andreasen을 설명하는 동격. 콤마로 둘러싸여 삽입되었다.", "g"], ["several dozen", "수사 표현", "'수십 명'. dozen은 앞에 수사가 오면 복수형 -s를 붙이지 않는다.", "v"]]}, {"en": "Andreasen found that 80 percent of the writers were exceedingly worried and nervous.", "key": 1, "g": [["80 percent of the writers were", "부분 표현의 수 일치", "percent of + 명사에서는 뒤의 명사(writers)에 동사를 맞춘다. 복수이므로 were.", "g"]]}, {"en": "Why is severe mental burden so closely associated with creativity?", "g": [["Why is", "글을 이끄는 질문", "이 질문의 답이 글의 요지다. 요약문의 (A)와 (B)를 연결하는 '이유'가 뒤에 나온다.", "v"], ["associated with", "be associated with", "'~와 관련되다'. 정신적 부담(A)과 창의성의 관계를 묻는다.", "v"]]}, {"en": "Her explanation is straightforward: It’s not easy to write a good novel.", "g": [["It’s not easy to write", "가주어 - 진주어", "It이 가주어, to write 이하가 진주어다.", "g"]]}, {"en": "The process often requires years of careful attention as the artist fixes mistakes and corrects errors.", "g": [["as the artist fixes", "접속사 as (~하면서)", "동시 상황을 나타내는 as. '예술가가 고치고 교정하면서'.", "g"]]}], [{"en": "As a result, the ability to stick with the process is extremely important.", "key": 1, "g": [["the ability to stick with the process", "(B) 끈기의 근거", "'과정을 계속하는 능력' = perseverance. 요약문 (B)가 여기서 결정된다.", "v"]]}, {"en": "“Successful writers are like prizefighters who keep on getting hit but won’t go down,” Andreasen says.", "g": [["who keep on getting hit", "주격 관계대명사 + keep on v-ing", "prizefighters를 수식한다. keep on v-ing는 '계속 ~하다', get hit는 '맞다'.", "g"]]}, {"en": "“They’ll stick with it until it’s right. And that seems to be what the mood disorders help with.”", "key": 1, "g": [["what the mood disorders help with", "관계대명사 what", "'기분 장애가 도움을 주는 것'. 정신적 부담(A)이 끈기(B)에 기여한다는 연결 고리다.", "g"]]}, {"en": "A similar theme emerged from biographical studies of British novelists and poets done by Kay Redfield Jamison, a professor of psychiatry at Johns Hopkins.", "g": [["done by Kay Redfield Jamison", "과거분사구", "studies를 수식한다. 연구가 '수행된' 것이므로 수동의 과거분사다.", "g"]]}, {"en": "According to her data, successful writers were eight times as likely as people in the general population to suffer from feelings of severe despondency and dejection.", "g": [["eight times as likely as", "배수사 + as 원급 as", "'~보다 8배 …한'. 배수 표현은 as ~ as 앞에 온다.", "g"], ["severe despondency and dejection", "(A) 우울증의 근거", "'심한 낙담과 실의' = depression. 요약문 (A)가 여기서 확정된다.", "v"]]}]], "choices": [["publicity – novelty", false, "작가들이 겪는 것은 '언론의 주목'이 아니라 걱정·불안·낙담이다."], ["depression – novelty", false, "(A)는 맞지만 (B)가 틀렸다. 창의적 작업의 핵심 요소는 새로움이 아니라 '계속하는 능력'이다."], ["publicity – perseverance", false, "(B)는 맞지만 (A)가 틀렸다."], ["depression – perseverance", true, "정답. 80%가 극도로 걱정·불안했고(depression), 좋은 소설은 수년간 고치기를 '계속하는 능력'(perseverance)이 필요하다고 했다."], ["competition – imitation", false, "경쟁도 모방도 글에 나오지 않는다."]], "flow": ["연구 1 — 안드리아센: 성공한 작가 80%가 극도로 걱정·불안", "질문 — 왜 정신적 부담이 창의성과 관련되는가?", "설명 — 좋은 소설은 수년간 고치고 또 고쳐야 한다 → 계속하는 능력이 중요", "비유 — 맞아도 쓰러지지 않는 권투 선수. 기분 장애가 그 끈기를 돕는다", "연구 2 — 제이미슨: 영국 작가들은 일반인보다 8배 심한 낙담을 겪는다"], "bg": "예술가와 우울의 관계는 오래된 연구 주제로, 안드리아센의 아이오와 작가 워크숍 연구(1987)가 대표적이다. 다만 이 글이 말하는 것은 '우울해야 창의적이다'가 아니라, 좋은 작품을 만드는 데 필요한 '끈질기게 붙들고 고치는 능력'이 정신적 부담과 함께 나타나는 경향이 있다는 것이다. 요약문 문제는 (A)와 (B)를 각각 뒷받침하는 본문 표현(worried and nervous / stick with the process)을 찾는 것이 핵심이다.", "quiz": [{"q": "안드리아센이 인터뷰한 작가 중 극도로 걱정·불안했던 비율은?", "opts": ["8퍼센트", "50퍼센트", "80퍼센트"], "a": 2, "exp": "80 percent of the writers were exceedingly worried and nervous."}, {"q": "안드리아센은 성공한 작가를 무엇에 비유했는가?", "opts": ["쓰러지지 않는 권투 선수", "혼자 달리는 마라토너", "실수를 두려워하지 않는 화가"], "a": 0, "exp": "Successful writers are like prizefighters who keep on getting hit but won’t go down."}]}, {"no": 3001, "dn": "1", "label": "DAY 30 · 1번", "type": "빈칸 추론", "answer": 5, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "blankTpl": "Going back to pleasure, a rational agent, when deciding between indulging today and indulging tomorrow, would ▢.", "subject": "오늘의 쾌락을 선호하는 것은 합리적이다", "vocab": [["inherently", "본질적으로", 1, "🧬", "There is nothing inherently irrational about preferring pleasure now to pleasure later.", "ad"], ["pay", "이익이 되다", 3, "💰", "All things being equal, it pays to enjoy things now.", "v"], ["insist on", "~을 (강하게) 요구하다", 4, "☝️", "That is why, when we lend out money, we insist on interest.", "phr"], ["compound", "복리로 증가하다", 8, "📈", "… which means that it compounds, or increases exponentially.", "v"], ["compensate", "보상하다", 9, "🔄", "That compensates you exactly for the decreasing value of the money …", "v"], ["elapse", "(시간이) 흐르다", 11, "⏳", "… the money coming back to you as time elapses …", "v"], ["indulge", "마음껏 누리다, 탐닉하다", 16, "🍫", "… when deciding between indulging today and indulging tomorrow …", "v"]], "pages": [[{"en": "There is nothing inherently irrational about preferring pleasure now to pleasure later.", "key": 1, "g": [["There is nothing inherently irrational about", "주제 선언", "'비이성적인 것은 전혀 없다' = 합리적이다. 빈칸의 정답 방향(현재 선호)이 첫 문장에서 정해진다.", "v"], ["preferring pleasure now to pleasure later", "prefer A to B", "'B보다 A를 선호하다'. than이 아니라 to를 쓴다는 점에 주의.", "g"]]}, {"en": "All things being equal, it pays to enjoy things now.", "g": [["All things being equal", "독립분사구문", "조건을 나타내는 분사구문. 주절의 주어(it)와 다르므로 의미상 주어 All things를 남겼다.", "g"], ["it pays to enjoy", "가주어 + pay(이익이 되다)", "it이 가주어, to enjoy가 진주어. 여기서 pay는 '돈을 내다'가 아니라 '이익이 되다'.", "g"]]}, {"en": "That is why, when we lend out money, we insist on interest.", "g": [["That is why", "결과의 연결", "'그래서 ~하는 것이다'. 앞이 이유, 뒤가 결과. That is because와 방향이 반대다.", "v"]]}, {"en": "A dollar tomorrow really is worth less than a dollar today (even if we assume there is no inflation), and interest is the price we put on the difference.", "key": 1, "g": [["is worth less than", "be worth + 비교", "'~보다 가치가 덜하다'. 내일의 돈 < 오늘의 돈. 이 비유가 쾌락에도 그대로 적용된다.", "v"], ["the price we put on the difference", "목적격 관계대명사 생략", "the price (that) we put on ~. put a price on은 '~에 가격을 매기다'.", "g"]]}, {"en": "Interest is charged at a fixed rate per unit of time, which means that it compounds, or increases exponentially.", "g": [[", which means that", "앞 절을 받는 which", "계속적 용법의 which가 앞 문장 전체(이자가 고정 비율로 부과된다는 것)를 받는다.", "g"]]}], [{"en": "That compensates you exactly for the decreasing value of the money coming back to you as time elapses, because the decrease in value also rapidly changes.", "g": [["compensates you exactly for", "compensate A for B", "'B에 대해 A에게 보상하다'.", "g"], ["coming back to you", "현재분사구", "the money를 수식한다. '당신에게 돌아오는 돈'.", "g"]]}, {"en": "Why is it rapidly changing?", "g": []}, {"en": "With every passing day, there is a fixed chance that you will die, or that the borrower will abscond or go bankrupt and you’ll never see the money again.", "key": 1, "g": [["a fixed chance that you will die", "동격의 that", "chance의 내용을 that절이 설명한다. or로 두 번째 that절이 병렬된다.", "g"], ["or that the borrower will abscond", "동격절의 병렬", "두 번째 동격 that절. 미래는 불확실하다 → 그래서 오늘이 더 가치 있다.", "g"]]}, {"en": "Going back to pleasure, a rational agent, when deciding between indulging today and indulging tomorrow, would ______.", "key": 1, "g": [["Going back to pleasure", "화제 복귀", "돈의 비유에서 원래 화제인 쾌락으로 돌아온다. 돈의 논리(오늘 > 내일)를 쾌락에 적용하는 자리다.", "v"], ["when deciding between", "접속사 + 분사", "when (he is) deciding ~. 주어와 be동사가 생략되었다.", "g"], ["would ______", "빈칸의 논리", "오늘의 1달러가 내일의 1달러보다 낫듯, 오늘의 쾌락이 내일의 (불확실한) 쾌락보다 낫다. 그러니 내일을 택하는 것은 그 쾌락이 '유난히 클 때만' 합리적이다.", "v"]]}]], "choices": [["seize the day regardless of possible negative outcomes", false, "'부정적 결과에 관계없이'가 지나치다. 글은 합리적 계산을 말하는데, 이 선지는 무조건 오늘을 즐기라는 것이다."], ["set future profits as a priority rather than current pleasures", false, "정반대다. 글은 현재를 선호하는 것이 합리적이라고 했다."], ["be emotional and intuitive rather than calculative and practical", false, "글은 이자 계산이라는 철저히 '계산적인' 논리를 펼친다. 감정·직관은 무관하다."], ["act upon a stimulus based on accumulated past experiences", false, "과거 경험에 대한 언급이 없다. 글의 열쇠는 '미래의 불확실성'이다."], ["opt for tomorrow only if the pleasure would be exceptionally great", true, "정답. 내일의 돈은 오늘의 돈보다 가치가 덜하므로 이자(추가 보상)가 붙는다. 마찬가지로 내일의 쾌락은 오늘보다 덜하므로, 그것이 유난히 클 때만 내일을 택하는 것이 합리적이다."]], "flow": ["주장 — 나중보다 지금의 쾌락을 선호하는 것은 비이성적이지 않다", "비유 — 그래서 돈을 빌려줄 때 이자를 요구한다: 내일의 1달러 < 오늘의 1달러", "설명 — 이자는 복리로 붙는데, 시간이 갈수록 돈의 가치 하락도 빨라지기 때문", "이유 — 하루하루 죽거나, 빌린 사람이 도주·파산할 가능성이 쌓인다", "적용(빈칸) — 합리적 행위자는 내일의 쾌락이 유난히 클 때만 내일을 택한다"], "bg": "경제학에서 '시간 선호(time preference)'라고 부르는 개념이다. 같은 금액이라도 지금 받는 것이 나중에 받는 것보다 가치가 높고, 그 차이를 메우는 것이 이자다. 이 글은 그 논리를 쾌락에 적용해, 오늘의 즐거움을 미루려면 내일의 즐거움이 그만큼 더 커야 한다고 말한다. 마시멜로 실험처럼 '참는 것이 무조건 옳다'는 통념과 다른 시각이라 토론해 볼 만하다.", "quiz": [{"q": "우리가 돈을 빌려줄 때 이자를 요구하는 이유는?", "opts": ["내일의 돈은 오늘의 돈보다 가치가 덜하기 때문", "빌린 사람이 부유하기 때문", "인플레이션이 항상 있기 때문"], "a": 0, "exp": "A dollar tomorrow really is worth less than a dollar today … and interest is the price we put on the difference."}, {"q": "돈의 가치 하락이 빠르게 변하는 이유로 든 것은?", "opts": ["물가가 오르기 때문", "매일 죽거나 빌린 사람이 도주·파산할 가능성이 있기 때문", "은행이 수수료를 올리기 때문"], "a": 1, "exp": "With every passing day, there is a fixed chance that you will die, or that the borrower will abscond or go bankrupt."}]}, {"no": 3002, "dn": "2", "label": "DAY 30 · 2번", "type": "글의 순서", "answer": 5, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? [3점]", "subject": "오로라는 어떻게 생기는가", "vocab": [["particle", "입자", 2, "✨", "… it sends lots of other energy and small particles our way.", "n"], ["magnetic field", "자기장", 3, "🧲", "The protective magnetic field around Earth shields us from most of the energy and particles …", "n"], ["shield", "보호하다", 3, "🛡️", "The protective magnetic field around Earth shields us …", "v"], ["electrified", "대전된, 전기를 띤", 11, "⚡", "… the Sun burps out a huge bubble of electrified gas …", "a"], ["ionize", "이온화하다", 13, "🔋", "… some of the energy and small particles ionize the oxygen and nitrogen gas in the atmosphere.", "v"], ["pole", "극", 15, "🧭", "This usually happens around the poles of a planet …", "n"], ["give off", "내뿜다, 방출하다", 19, "💚", "Oxygen gives off green and red light.", "phr"]], "pages": [[{"label": "주어진 글", "en": "The Sun sends us more than heat and light; it sends lots of other energy and small particles our way. The protective magnetic field around Earth shields us from most of the energy and particles, and we don’t even notice them.", "key": 1, "g": [["we don’t even notice them", "순서의 열쇠", "'평소에는' 알아차리지도 못한다. 뒤에는 이 평소 상황이 깨지는 예외(But)가 와야 한다.", "v"], ["shields us from", "shield A from B", "'B로부터 A를 보호하다'. protect A from B와 같은 구조.", "g"]]}], [{"label": "(C)", "en": "But the Sun doesn’t send the same amount of energy all the time. During one kind of solar storm called a coronal mass ejection, the Sun burps out a huge bubble of electrified gas that can travel through space at high speeds.", "key": 1, "g": [["But the Sun doesn’t send the same amount of energy all the time", "순서의 열쇠 + 부분부정", "주어진 글의 '평소'를 But으로 뒤집는다. not ~ all the time은 '항상 ~한 것은 아니다'라는 부분부정.", "v"], ["called a coronal mass ejection", "과거분사구", "solar storm을 수식한다. '~라고 불리는'.", "g"], ["a huge bubble of electrified gas", "(B)를 부르는 장치", "이 '거대한 기체 거품'이 (B)의 it이 가리키는 대상이다.", "v"]]}], [{"label": "(B)", "en": "When it comes toward Earth, some of the energy and small particles ionize the oxygen and nitrogen gas in the atmosphere. This usually happens around the poles of a planet where the magnetic field lines are concentrated and the atmosphere becomes thicker.", "g": [["When it comes toward Earth", "순서의 열쇠", "it = (C)의 거대한 기체 거품. (C)가 앞에 없으면 it이 가리킬 것이 없다.", "v"], ["where the magnetic field lines are concentrated", "관계부사 where", "the poles of a planet을 수식한다. 극지방의 특징(자기장선 집중)을 설명한다.", "g"], ["around the poles of a planet", "(A)를 부르는 장치", "이 '극지방'이 (A)의 There가 가리키는 장소다.", "v"]]}], [{"label": "(A)", "en": "There, the particles interact with gases in the atmosphere resulting in beautiful displays of light in the sky called auroras. Oxygen gives off green and red light. Nitrogen glows blue and purple.", "key": 1, "g": [["There", "순서의 열쇠", "(B)의 극지방을 받는 부사다. 장소가 먼저 나와야 There가 성립한다.", "v"], ["resulting in", "결과의 분사구문", "'그 결과 ~을 낳는다'. 앞 절의 결과를 분사구문으로 덧붙였다.", "g"], ["Oxygen gives off green and red light", "(B)와의 연결", "(B)에서 이온화된 산소와 질소가 각각 어떤 빛을 내는지 마무리한다.", "v"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)의 There가 가리킬 장소(극지방)가 아직 나오지 않았다."], ["(B) – (A) – (C)", false, "(B)의 it이 가리킬 대상(대전된 기체 거품)이 아직 나오지 않았다."], ["(B) – (C) – (A)", false, "같은 이유로 (B)가 주어진 글 바로 뒤에 올 수 없다."], ["(C) – (A) – (B)", false, "(A)의 There는 (B)의 극지방을 받으므로 (B)가 (A)보다 앞서야 한다."], ["(C) – (B) – (A)", true, "정답. 평소엔 알아차리지 못한다 → (C) 그러나 태양 폭풍 때는 기체 거품을 뱉어낸다 → (B) 그것(it)이 지구에 오면 극지방에서 이온화 → (A) 그곳(There)에서 오로라가 생긴다."]], "flow": ["주어진 글 — 태양은 에너지·입자를 보내지만 자기장이 막아 주어 평소엔 못 느낀다", "(C) But — 항상 같은 양은 아니다. 코로나 질량 방출 때 대전된 기체 거품을 뱉어낸다", "(B) it — 그것이 지구에 오면 극지방에서 산소·질소를 이온화한다", "(A) There — 그곳에서 오로라가 생긴다. 산소는 녹·적색, 질소는 청·자색"], "bg": "오로라는 태양에서 날아온 대전 입자가 지구 자기장에 이끌려 극지방으로 모여 대기의 산소·질소와 충돌하며 내는 빛이다. 그래서 북극권(노르웨이, 아이슬란드, 캐나다 북부)이나 남극 근처에서 주로 보인다. 순서 문제로는 But(예외 도입) → it(기체 거품) → There(극지방)라는 세 개의 연결 고리만 잡으면 정답이 나온다.", "quiz": [{"q": "오로라가 주로 극지방에서 생기는 이유는?", "opts": ["극지방이 춥기 때문", "자기장선이 집중되고 대기가 두터워지기 때문", "극지방에 산소가 더 많기 때문"], "a": 1, "exp": "around the poles of a planet where the magnetic field lines are concentrated and the atmosphere becomes thicker."}, {"q": "산소가 방출하는 빛의 색은?", "opts": ["파란색과 보라색", "녹색과 적색", "노란색과 흰색"], "a": 1, "exp": "Oxygen gives off green and red light. Nitrogen glows blue and purple."}]}, {"no": 3003, "dn": "3", "label": "DAY 30 · 3번", "type": "문장 넣기", "answer": 3, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "This is because our body must be warm, our lungs must be stretched, and our blood must be actively flowing before our body begins efficiently utilizing oxygen.", "subject": "운동 시작 후 힘든 2분의 비밀", "vocab": [["metabolism", "신진대사", 1, "🔥", "our metabolisms stay elevated for a significant amount of time after exercise.", "n"], ["get around to", "~을 할 시간을 내다", 3, "📅", "by the time we actually get around to exercising again …", "phr"], ["revert", "되돌아가다", 4, "↩️", "our metabolism has reverted to a slower pace …", "v"], ["gasp for breath", "숨이 가빠서 헐떡거리다", 7, "😮‍💨", "Wheezing, gasping for breath, coughing, stumbling …", "phr"], ["utilize", "이용하다, 활용하다", 12, "⚙️", "… before our body begins efficiently utilizing oxygen.", "v"], ["moderate", "보통의, 중간의", 17, "🚶", "… if you simply start the cardio at a moderate pace …", "a"], ["hang on", "견디다, 버티다", 18, "💪", "… and hang on for the first 120 seconds.", "phr"]], "pages": [[{"en": "As you probably know, our metabolisms stay elevated for a significant amount of time after exercise.", "g": [["stay elevated", "stay + 형용사(분사)", "'고양된 상태로 유지되다'. stay는 2형식 동사로 뒤에 보어가 온다.", "g"]]}, {"en": "( ① ) Unfortunately though, by the time we actually get around to exercising again, our metabolism has reverted to a slower pace and getting “back into the groove” for the next day’s bike ride, run, or aerobic session can be difficult.", "g": [["( ① )", "①의 판단", "넣을 수 없다. 앞 문장은 신진대사가 높게 유지된다는 좋은 이야기다. 주어진 문장의 This(몸이 힘든 상태)가 받을 내용이 없다.", "v"], ["by the time we actually get around to exercising", "by the time + 현재 / get around to v-ing", "'~할 때쯤에는'. get around to 뒤에는 동명사가 온다. to부정사가 아니다.", "g"]]}, {"en": "( ② ) Wheezing, gasping for breath, coughing, stumbling, and feeling sleepy, lethargic, or fatigued are sometimes associated with starting exercise after that 24-hour break.", "key": 1, "g": [["( ② )", "②의 판단", "넣을 수 없다. 여기서는 '의욕이 안 난다'고만 했다. 주어진 문장이 설명하는 '괴로운 몸 상태'는 이 문장에서 나온다.", "v"], ["Wheezing, gasping for breath, coughing, stumbling, and feeling", "동명사 주어의 병렬", "다섯 개의 동명사가 주어. 이것이 주어진 문장의 This가 받는 '힘든 증상들'이다.", "g"]]}], [{"en": "( ③ ) For most individuals, it takes about two minutes for this process to begin to occur, after which you actually start feeling good.", "key": 1, "g": [["( ③ )", "③의 판단 — 정답", "앞에 힘든 증상들이 나왔고, 이 문장의 this process(몸이 데워지고 폐가 늘어나고 피가 도는 과정)는 주어진 문장에만 있는 내용이다. 그 사이가 자리다.", "v"], ["it takes about two minutes for this process to begin", "it takes 시간 for A to-v", "'A가 ~하는 데 (시간)이 걸리다'. for this process가 to begin의 의미상 주어다.", "g"], ["after which", "전치사 + 관계대명사", "'그 후에'. which는 앞의 two minutes(또는 과정 전체)를 받는다.", "g"]]}, {"en": "( ④ ) Rather than struggling through these first two minutes at a slow pace, your post-exercise metabolic rate will be higher if you simply start the cardio at a moderate pace and hang on for the first 120 seconds.", "g": [["( ④ )", "④의 판단", "넣을 수 없다. these first two minutes는 앞 문장의 2분을 받아 해결책으로 넘어간다. 원인 설명이 끼어들 자리가 아니다.", "v"], ["Rather than struggling", "rather than + v-ing", "'~하기보다는'. 뒤에 동명사가 왔다.", "g"]]}, {"en": "( ⑤ ) In addition, you’ll not only warm-up faster, but the rest of your exercise routine will burn more calories.", "g": [["( ⑤ )", "⑤의 판단", "넣을 수 없다. In addition은 앞의 해결책에 이점을 덧붙인다. 마무리 자리다.", "v"], ["not only warm-up faster, but", "not only A but (also) B", "'A뿐만 아니라 B도'. also가 생략되었다.", "g"]]}]], "choices": [["( ① ) — Unfortunately though, by the time we actually get around to exercising again, our metabolism has reverted …", false, "앞 문장은 신진대사가 높게 유지된다는 내용이다. This가 받을 '힘든 상태'가 없다.", "( ① ) Unfortunately though, by the time we actually get around to exercising again, our metabolism has reverted to a slower pace and getting “back into the groove” for the next day’s bike ride, run, or aerobic session can be difficult."], ["( ② ) — Wheezing, gasping for breath, coughing, stumbling, and feeling sleepy, lethargic, or fatigued are sometimes associated with starting exercise …", false, "앞에는 '의욕이 안 난다'고만 했다. 힘든 증상은 이 문장에서 나오므로 그 뒤여야 한다.", "( ② ) Wheezing, gasping for breath, coughing, stumbling, and feeling sleepy, lethargic, or fatigued are sometimes associated with starting exercise after that 24-hour break."], ["( ③ ) — For most individuals, it takes about two minutes for this process to begin to occur, after which you actually start feeling good.", true, "정답. 앞의 힘든 증상들을 This로 받아 원인을 설명하고, 뒤의 this process(몸이 준비되는 과정)는 주어진 문장에서 처음 언급된다.", "( ③ ) For most individuals, it takes about two minutes for this process to begin to occur, after which you actually start feeling good."], ["( ④ ) — Rather than struggling through these first two minutes at a slow pace, your post-exercise metabolic rate will be higher …", false, "these first two minutes가 앞 문장의 2분을 받아 해결책으로 넘어간다. 원인 설명이 들어갈 자리가 아니다.", "( ④ ) Rather than struggling through these first two minutes at a slow pace, your post-exercise metabolic rate will be higher if you simply start the cardio at a moderate pace and hang on for the first 120 seconds."], ["( ⑤ ) — In addition, you’ll not only warm-up faster, but the rest of your exercise routine will burn more calories.", false, "In addition으로 해결책의 이점을 덧붙이는 마무리 문장이다.", "( ⑤ ) In addition, you’ll not only warm-up faster, but the rest of your exercise routine will burn more calories."]], "flow": ["도입 — 운동 후 신진대사는 한동안 높게 유지된다", "문제 — 그러나 다음 운동 때쯤엔 다시 느려져 '의욕 회복'이 어렵다", "증상 — 헐떡거림, 기침, 비틀거림, 무기력이 24시간 휴식 뒤 운동 시작과 연관된다", "③ 주어진 문장 — 이는 몸이 데워지고 폐가 늘어나고 피가 돌아야 산소를 쓸 수 있기 때문", "해결 — 이 과정은 약 2분. 느리게 버티지 말고 중간 속도로 120초를 견디면 신진대사율↑, 칼로리 소모↑"], "bg": "운동 시작 직후 숨이 가쁘고 힘든 것은 근육이 필요한 산소를 심폐 기관이 아직 충분히 공급하지 못하는 '산소 부채' 상태 때문이다. 심박수와 호흡이 올라가고 혈류가 근육으로 재배치되는 데 몇 분이 걸리며, 그 뒤에는 오히려 편해진다. 체육 시간에 처음 몇 분이 가장 힘든 이유를 설명해 줄 수 있는 지문이다.", "quiz": [{"q": "글에 따르면 몸이 산소를 효율적으로 쓰기 시작하는 데 걸리는 시간은?", "opts": ["약 30초", "약 2분", "약 24시간"], "a": 1, "exp": "it takes about two minutes for this process to begin to occur."}, {"q": "글이 제안하는 운동 시작 방법은?", "opts": ["처음 2분은 아주 느리게 시작한다", "중간 속도로 시작해 120초를 버틴다", "24시간마다 쉬지 않고 운동한다"], "a": 1, "exp": "simply start the cardio at a moderate pace and hang on for the first 120 seconds."}]}, {"no": 3004, "dn": "4~5", "label": "DAY 30 · 4~5번", "type": "장문 (제목 · 어휘)", "answer": 5, "q": "윗글의 제목으로 가장 적절한 것은?", "q2": "밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "answer2": 3, "subject": "인간 성취의 비결은 집단 지성", "vocab": [["brilliance", "두뇌의 뛰어남, 탁월함", 2, "💡", "… assume that brilliance is the key to human achievement.", "n"], ["devise", "고안하다", 5, "🛠️", "they ask the cleverest experts to devise plans for the economy …", "v"], ["credit A with B", "A에게 B가 있다고 믿다", 6, "🏅", "they credit the sharpest scientists with discoveries.", "phr"], ["bark up the wrong tree", "잘못 짚다", 7, "🌳", "They are all barking up the wrong tree.", "phr"], ["division of labor", "노동의 분배, 분업", 11, "🔀", "It is by combining brainpower through the division of labor …", "n"], ["virtuosity", "기교, 묘기", 13, "🎻", "… raise the living standards, technological virtuosity, and knowledge base of the species.", "n"], ["distribute", "분배하다, 나누다", 27, "📦", "the knowledge is distributed in society among many thousands of graphite miners …", "v"]], "pages": [[{"en": "Brilliant individuals, whether anthropologists, psychologists, or economists, assume that brilliance is the key to human achievement.", "g": [["whether anthropologists, psychologists, or economists", "whether A, B, or C", "'A이든 B이든 C이든'. whether (they are) ~ 로 주어·동사가 생략된 삽입구다.", "g"], ["assume that brilliance is the key", "통념의 제시", "필자가 뒤에서 뒤집을 통념. '똑똑함이 비결'이라는 생각이다.", "v"]]}, {"en": "They vote for the smartest people to run governments, they ask the cleverest experts to devise plans for the economy, and they (a) credit the sharpest scientists with discoveries.", "g": [["(a) credit", "(a) 적절", "credit A with B(A에게 B가 있다고 믿다). 똑똑한 사람을 신뢰하는 통념의 예이므로 맞다. 세 개의 절이 콤마와 and로 병렬된 문장이다.", "v"]]}, {"en": "They are all barking up the wrong tree.", "g": [["barking up the wrong tree", "관용 표현", "'잘못 짚다'. 사냥개가 엉뚱한 나무를 보고 짖는 데서 온 말. 여기서 통념이 뒤집힌다.", "v"]]}, {"en": "The key to human achievement is not (b) individual intelligence at all.", "key": 1, "g": [["(b) individual", "(b) 적절", "'개인의' 지성이 아니라고 부정한다. 뒤의 collective(집단적)와 대조되므로 맞다.", "v"], ["at all", "not ... at all의 완전 부정", "앞의 not과 짝을 이루어 '전혀 ~이 아니다'. 개인 지성을 비결에서 완전히 배제한다.", "g"]]}, {"en": "Human achievement is entirely a networking phenomenon.", "key": 1, "g": [["entirely a networking phenomenon", "주제문", "'전적으로 네트워킹 현상'. 제목의 collective intelligence가 여기서 나온다.", "v"]]}], [{"en": "It is by combining brainpower through the division of labor that human society happened upon a way to raise the living standards, technological virtuosity, and knowledge base of the species.", "g": [["It is by combining brainpower through the division of labor that", "It is ~ that 강조구문", "by combining ~ labor(전치사구)를 강조한다. '바로 ~함으로써였다'. It is와 that을 빼도 문장이 성립하는지로 확인한다.", "g"]]}, {"en": "We can see this in all sorts of phenomena: the (c) advance of technology in people who became isolated, like native Tasmanians; the prosperity of trading city states in Greece, Italy, Holland, and Southeast Asia; the creative consequences of trade.", "g": [["(c) advance", "(c) 문맥상 틀림 → collapse", "지성의 결합(네트워크)이 비결이라면, '고립된' 사람들의 기술은 발전이 아니라 '붕괴'해야 논리가 맞다. 뒤의 무역 도시의 번영과 대비되는 반례다.", "v"], ["who became isolated", "주격 관계대명사절", "people을 수식한다. become + 형용사(isolated)로 '고립되게 되다'.", "g"]]}, {"en": "Human achievement is rooted in collective intelligence — the nodes in the human neural network are people themselves.", "key": 1, "g": [["is rooted in collective intelligence", "제목의 근거", "'집단 지성에 뿌리를 두다'. 제목 ⑤의 The Fruit of Collective Intelligence가 바로 이 표현이다.", "v"]]}, {"en": "By each doing one thing and mastering it, then combining the results through (d) exchange, people become capable of doing things they do not even understand.", "g": [["By each doing one thing", "by + 의미상 주어 + v-ing", "each가 동명사 doing의 의미상 주어. '각자가 한 가지 일을 함으로써'.", "g"], ["(d) exchange", "(d) 적절", "각자 한 일의 결과를 '교환'으로 결합한다. 분업 + 교환 = 네트워킹이므로 맞다.", "v"], ["things they do not even understand", "목적격 관계대명사 생략", "things (that) they do not even understand. '이해조차 못하는 것들'.", "g"]]}, {"en": "As the economist Leonard Read pointed out in his essay “I, Pencil,” no single person knows how to make even a pencil — the knowledge is (e) distributed in society among many thousands of graphite miners, lumberjacks, designers and factory workers.", "g": [["(e) distributed", "(e) 적절", "no single person(단 한 사람도)이 못 만드는 연필의 지식이 수천 명 사이에 '분산되어' 있다. 한 사람이 아니라 네트워크가 안다는 결론과 맞다.", "v"]]}]], "choices": [["Brilliant People Accomplish Amazing Things", false, "정반대다. 글은 똑똑한 개인이 비결이라는 생각을 '잘못 짚은 것'이라 했다."], ["Smart People Value Team Accomplishments", false, "똑똑한 사람들이 무엇을 가치 있게 여기는지가 아니라, 성취의 진짜 원천이 무엇인지를 말하는 글이다."], ["How Can We Maximize Collective Intelligence?", false, "집단 지성을 '어떻게 키우는가'라는 방법론은 없다. 그것이 성취의 뿌리라는 주장이다."], ["Individual Achievement vs. Collective Responsibility", false, "'책임'은 글에 나오지 않는다. 대비는 개인 지성 vs 집단 지성이다."], ["Human Achievement: The Fruit of Collective Intelligence", true, "정답. Human achievement is rooted in collective intelligence를 그대로 제목으로 옮긴 것이다."]], "choices2": [["(a) credit", false, "똑똑한 과학자가 발견을 한다고 '믿는' 것은 통념의 예로 자연스럽다."], ["(b) individual", false, "비결이 '개인의' 지성이 아니라는 부정. 뒤의 collective와 대조되어 맞다."], ["(c) advance", true, "정답. 네트워크가 비결이라면 '고립된' 사람들의 기술은 발전이 아니라 붕괴(collapse)했어야 한다."], ["(d) exchange", false, "분업의 결과를 '교환'으로 결합하는 것이 네트워킹이다. 맞다."], ["(e) distributed", false, "연필 지식이 수천 명에게 '분산되어' 있다는 결론과 맞다."]], "flow": ["통념 — 똑똑한 개인들은 '뛰어난 두뇌'가 인간 성취의 비결이라 믿는다", "반박 — 모두 잘못 짚었다. 비결은 개인 지성이 전혀 아니다", "주장 — 인간 성취는 전적으로 네트워킹 현상: 분업으로 두뇌를 결합한 것", "증거 — 고립된 태즈메이니아 원주민의 기술 붕괴 vs 무역 도시 국가의 번영", "예시 — 연필 하나도 혼자서는 못 만든다. 지식은 수천 명에게 분산되어 있다"], "bg": "매트 리들리의 『이성적 낙관주의자』에 나오는 논지다. 태즈메이니아 원주민은 약 1만 년 전 해수면 상승으로 본토와 단절된 뒤 낚싯바늘 같은 기술을 잃었다고 알려져 있어, 고립이 기술을 퇴보시킨다는 예로 자주 인용된다. Leonard Read의 에세이 「I, Pencil」(1958)은 연필 하나에 전 세계 수천 명의 협력이 담겨 있음을 보여 주는 경제학의 고전이다.", "quiz": [{"q": "필자가 말하는 인간 성취의 진짜 비결은?", "opts": ["가장 똑똑한 개인의 지성", "분업과 교환을 통한 지성의 결합", "정부의 효율적인 운영"], "a": 1, "exp": "It is by combining brainpower through the division of labor that human society happened upon a way to raise the living standards."}, {"q": "「I, Pencil」의 예가 보여 주는 것은?", "opts": ["연필은 한 명의 천재가 발명했다", "연필을 만드는 지식은 수천 명에게 분산되어 있다", "연필은 가장 단순한 기술이다"], "a": 1, "exp": "no single person knows how to make even a pencil — the knowledge is distributed in society among many thousands."}]}, {"no": 3101, "dn": "1", "label": "DAY 31 · 1번", "type": "글의 제목", "answer": 5, "q": "다음 글의 제목으로 가장 적절한 것은?", "subject": "좌뇌·우뇌 우세는 신화다", "vocab": [["hemisphere", "(뇌의) 반구", 1, "🧠", "since the brain hemispheres do have certain proclivities towards creativity versus logic …", "n"], ["cater to", "~에 영합하다, ~의 구미에 맞추다", 3, "🍽️", "people should target their learning to cater to these differences.", "phr"], ["deliberate", "신중한", 7, "🤔", "left-brain people are supposed to be more logical, analytical, and deliberate.", "a"], ["plausible", "그럴듯한", 7, "🎭", "It can certainly be a plausible story to buy into …", "a"], ["buy into", "~을 믿다", 8, "🛒", "It can certainly be a plausible story to buy into …", "phr"], ["dominant", "우세한, 지배적인", 12, "👑", "studies have demonstrated that people do not have dominant hemispheres whatsoever.", "a"], ["whatsoever", "(부정문에서) 전혀", 13, "🚫", "people do not have dominant hemispheres whatsoever.", "ad"]], "pages": [[{"en": "Some people argue that since the brain hemispheres do have certain proclivities towards creativity versus logic, people should target their learning to cater to these differences.", "g": [["Some people argue that", "통념의 도입", "'어떤 사람들은 ~라고 주장한다'. 필자가 뒤에서 반박할 상대의 주장이다.", "v"], ["do have", "강조의 do", "'정말로 가지고 있다'. 동사를 강조하는 조동사 do. 성향 자체는 인정한다는 뜻이다.", "g"]]}, {"en": "For example, right-brain people are supposed to be more creative, free-minded, and carefree, while left-brain people are supposed to be more logical, analytical, and deliberate.", "g": [["are supposed to be", "be supposed to-v", "'~라고 여겨지다, ~하기로 되어 있다'. 사실이 아니라 '그렇게 추정된다'는 거리 두기 표현이다.", "g"], ["while", "대조의 while", "우뇌인 ↔ 좌뇌인을 대조한다. '~인 반면'.", "v"]]}, {"en": "It can certainly be a plausible story to buy into, but it’s not as if you learn with just one side and that side should be appealed to exclusively.", "g": [["but", "반전의 신호", "그럴듯하다고 인정한 뒤 but으로 뒤집는다. 제목은 이 뒤의 내용이다.", "v"], ["it’s not as if", "it's not as if + 절", "'~인 것은 아니다'. 마치 그런 것처럼 보이지만 실제는 다르다는 표현이다.", "g"], ["should be appealed to exclusively", "구동사의 수동태", "appeal to A(A의 관심을 끌다)를 수동태로 만들 때 to를 빠뜨리면 안 된다.", "g"]]}, {"en": "Both brain hemispheres are involved in almost every single mental process, and studies have demonstrated that people do not have dominant hemispheres whatsoever.", "key": 1, "g": [["Both brain hemispheres are involved in", "핵심 근거", "'두 반구가 모두 관여한다'. 제목 ⑤의 Whole-Brained(전뇌인)가 바로 이것이다.", "v"], ["do not have dominant hemispheres whatsoever", "not ... whatsoever", "whatsoever는 부정문 끝에서 '전혀'로 부정을 강조한다. '우세 반구는 신화(Myth)'라는 제목의 근거다.", "g"]]}], [{"en": "What does this mean for you?", "g": [["What does this mean for you?", "독자를 향한 질문", "연구 결과를 독자의 삶에 적용하는 전환. 뒤에 조언이 온다.", "v"]]}, {"en": "Just because you’re more artistic or more analytical doesn’t mean that you should ignore the other parts of life!", "g": [["Just because you’re more artistic or more analytical doesn’t mean", "Just because ~ doesn't mean ...", "'단지 ~라고 해서 …인 것은 아니다'. because절이 주어 자리에 온 관용 구조로, 원래 있던 it이 탈락한 형태다.", "g"]]}, {"en": "You can be equally as good at those parts, if not better, so don’t let the idea of the dominant hemisphere prevent you from exploring other areas.", "key": 1, "g": [["if not better", "양보의 삽입절", "'비록 더 낫지는 않더라도'. if가 양보(even if)로 쓰인 삽입 표현이다.", "g"], ["don’t let the idea of the dominant hemisphere prevent you from exploring", "let + O + 원형 / prevent O from v-ing", "사역동사 let의 목적격보어 자리에 prevent A from v-ing(A가 ~하는 것을 막다)가 왔다. '그 생각이 당신을 막게 두지 마라'.", "g"]]}]], "choices": [["Hack Your Brain, Find Your True Potential", false, "뇌를 '해킹'하는 방법은 없다. 잠재력 이야기도 일부일 뿐, 핵심은 좌우뇌 신화의 반박이다."], ["Where Does Personality Reside in the Brain?", false, "성격의 위치를 묻는 글이 아니다. 우세 반구가 없다는 것이 요지다."], ["Left Brain vs. Right Brain: What’s the Difference?", false, "차이를 설명하는 글이 아니라 그 차이에 매달리지 말라는 글이다. 함정 선지."], ["What the Two Halves of Your Brain Say About You", false, "두 반구가 당신에 대해 말해 준다는 전제 자체를 글이 부정한다."], ["Forget the Right vs. Left Myth: You’re Whole-Brained", true, "정답. 우세 반구는 없다(신화)는 연구 결과 + 두 반구가 모두 관여한다(전뇌) + 다른 영역도 탐구하라는 조언을 모두 담았다."]], "flow": ["통념 — 좌뇌·우뇌 성향에 맞춰 학습해야 한다는 주장", "예 — 우뇌인은 창의적·자유롭고, 좌뇌인은 논리적·분석적이라 여겨진다", "반박 — 그럴듯하지만, 한쪽으로만 배우는 것은 아니다", "근거 — 두 반구는 거의 모든 정신 과정에 관여하고, 우세 반구는 없다는 연구", "조언 — 우세 반구라는 생각이 다른 영역 탐구를 막게 하지 마라"], "bg": "'좌뇌형·우뇌형 인간'은 1960년대 분리뇌 연구가 대중화되면서 퍼진 개념이지만, 2013년 유타 대학 연구팀이 천 명 이상의 뇌 영상을 분석해 개인별 우세 반구는 없다고 밝힌 이후 대표적인 뇌과학 신화로 꼽힌다. 언어·논리·창의성은 모두 양쪽 뇌의 협력으로 이루어진다. '나는 문과 뇌라서 수학은 안 돼'라는 학생들의 말에 답해 줄 수 있는 지문이다.", "quiz": [{"q": "연구들이 입증한 것은?", "opts": ["우뇌인이 더 창의적이다", "사람들은 우세한 반구를 갖고 있지 않다", "좌뇌가 모든 정신 과정을 담당한다"], "a": 1, "exp": "studies have demonstrated that people do not have dominant hemispheres whatsoever."}, {"q": "필자가 독자에게 하는 조언은?", "opts": ["자신의 우세 반구에 맞게 공부하라", "다른 영역도 탐구하라", "예술과 분석 중 하나를 선택하라"], "a": 1, "exp": "don’t let the idea of the dominant hemisphere prevent you from exploring other areas."}]}, {"no": 3102, "dn": "2", "label": "DAY 31 · 2번", "type": "밑줄 함의", "answer": 1, "q": "밑줄 친 allowing you to experience a second wind가 다음 글에서 의미하는 바로 가장 적절한 것은? [3점]", "subject": "한계를 정하는 것은 몸이 아니라 뇌", "vocab": [["run out of", "~이 다 떨어지다", 2, "🪫", "… because we run out of physiological energy …", "phr"], ["cap", "한도를 정하다", 4, "🧢", "… the oxygen in our blood that caps our maximum expenditure.", "v"], ["expenditure", "(에너지 등의) 소비, 지출", 4, "⚡", "… that caps our maximum expenditure.", "n"], ["miserly", "아주 적은, 구두쇠 같은", 8, "🪙", "The brain exercises a miserly control over the body’s life-sustaining resources …", "a"], ["fatigued", "피로한", 11, "😩", "when it feels there’s a risk of your getting too fatigued and run-down …", "a"], ["premature", "시기상조의, 너무 이른", 15, "⏰", "when an unusual necessity compels you beyond this premature barrier …", "a"], ["relent", "약해지다, 누그러지다", 17, "🌬️", "The power of the brain relents, allowing you to experience a second wind.", "v"]], "pages": [[{"en": "We often think we slow down and stop during athletic training because we run out of physiological energy — that it is the strength of our muscles or the oxygen in our blood that caps our maximum expenditure.", "g": [["We often think", "통념의 도입", "'우리는 흔히 ~라고 생각한다'. 뒤에 Yet으로 뒤집힐 통념이다.", "v"], ["that it is the strength of our muscles or the oxygen in our blood that caps", "동격의 that + 강조구문", "think의 두 번째 목적어(앞 절과 동격). 그 안에 It is ~ that 강조구문이 쓰여 the strength ~ blood를 강조한다.", "g"]]}, {"en": "Yet research finds that when individuals feel they’ve reached their physical limits, they actually have the capacity to go on for much longer.", "key": 1, "g": [["Yet", "반전의 신호", "통념(몸이 한계)을 연구 결과로 뒤집는다.", "v"], ["the capacity to go on for much longer", "함의의 근거", "'훨씬 더 오래 계속할 능력'. 밑줄 친 second wind가 뜻하는 '계속할 새로운 힘'이 여기 있다.", "v"]]}, {"en": "It isn’t your body that shuts things down, it’s your mind.", "key": 1, "g": [["It isn’t your body that shuts things down", "It is ~ that 강조구문(부정)", "'멈추게 하는 것은 몸이 아니다'. your body를 강조하며 부정하고, 뒤에서 it's your mind로 정답을 준다.", "g"]]}, {"en": "The brain exercises a miserly control over the body’s life-sustaining resources; it monitors the environment within and without, and when it feels there’s a risk of your getting too fatigued and run-down, it puts the brakes on your efforts, throwing the switch far from the actual point at which you would become dangerously exhausted.", "g": [["a risk of your getting too fatigued", "동명사의 의미상 주어", "your가 동명사 getting의 의미상 주어. '당신이 너무 피로해질 위험'.", "g"], ["puts the brakes on your efforts", "put the brakes on", "'~에 브레이크를 걸다'. 뇌가 실제 한계보다 훨씬 일찍 멈추게 한다는 핵심 비유다.", "v"], ["throwing the switch far from the actual point", "분사구문", "and it throws ~ 를 줄인 분사구문. '실제 지점에서 멀리 떨어진 곳에서 스위치를 누르며'.", "g"], ["at which you would become dangerously exhausted", "전치사 + 관계대명사", "the actual point를 수식한다. at the point에서 at이 관계사 앞으로 나갔다.", "g"]]}, {"en": "But, when an unusual necessity compels you beyond this premature barrier — such as the pressures of competition — a surprising thing occurs: The power of the brain relents, allowing you to experience a second wind.", "key": 1, "g": [["compels you beyond this premature barrier", "this의 지시", "this premature barrier = 앞 문장에서 뇌가 너무 일찍 걸어 둔 브레이크. compel A beyond B는 'A를 B 너머로 몰아가다'.", "v"], ["The power of the brain relents", "함의의 열쇠", "뇌의 브레이크가 풀린다 → 몸에 남아 있던 능력이 나온다. 그래서 second wind = 계속할 새 힘이다.", "v"], ["allowing you to experience", "결과의 분사구문 + allow O to-v", "'그 결과 당신이 ~을 경험하게 하며'. allow + O + to-v 구조다.", "g"]]}]], "choices": [["you’ll find new energy and strength to continue", true, "정답. 뇌가 실제 한계보다 일찍 걸어 둔 브레이크가 풀리면 '훨씬 더 오래 계속할 능력'(the capacity to go on for much longer)이 나온다. second wind(두 번째 바람)는 그 새로운 힘이다."], ["you’ll feel more compelled to avoid the shame of losing", false, "패배의 수치는 글에 없다. 경쟁은 브레이크를 풀어 주는 계기의 예일 뿐이다."], ["you’ll control your brain by overcoming the physical limit", false, "순서가 뒤바뀌었다. 육체적 한계를 극복해서 뇌를 통제하는 것이 아니라, 뇌의 통제가 풀려서 한계를 넘는 것이다."], ["you’ll be driven by genuine motivation and intrinsic desire", false, "동기나 내재적 욕구는 글의 화제가 아니다."], ["you’ll be allowed to take a break from intense competition", false, "휴식이 아니라 오히려 '계속하는' 것이다. 정반대다."]], "flow": ["통념 — 운동 중 멈추는 것은 근육·산소 등 생리적 에너지가 떨어져서다", "반전 — 한계라고 느낄 때도 실제로는 훨씬 더 갈 수 있다. 멈추게 하는 것은 정신이다", "설명 — 뇌는 자원을 아끼려 실제 소진 지점보다 훨씬 일찍 브레이크를 건다", "밑줄 — 경쟁의 압박 같은 특이한 필요가 그 장벽을 넘게 하면 뇌의 통제가 풀리고 '두 번째 바람'(새 힘)이 온다"], "bg": "운동생리학자 팀 녹스가 제안한 '중앙 조절자(central governor)' 이론이다. 뇌가 몸을 보호하기 위해 실제 한계보다 앞서 피로감을 만들어 낸다는 설명으로, 마라토너가 결승선이 보이면 갑자기 속도를 내는 현상을 설명한다. second wind는 원래 달리기 중 힘들다가 갑자기 숨이 트이는 경험을 가리키는 표현으로, 한국어의 '기운이 다시 난다'에 가깝다.", "quiz": [{"q": "글에 따르면 운동 중 우리를 멈추게 하는 것은?", "opts": ["근육의 힘", "혈중 산소", "우리의 정신(뇌)"], "a": 2, "exp": "It isn’t your body that shuts things down, it’s your mind."}, {"q": "뇌가 브레이크를 거는 시점은?", "opts": ["실제로 위험하게 소진되는 지점", "실제 소진 지점보다 훨씬 이른 지점", "경쟁이 끝난 뒤"], "a": 1, "exp": "throwing the switch far from the actual point at which you would become dangerously exhausted."}]}, {"no": 3103, "dn": "3", "label": "DAY 31 · 3번", "type": "빈칸 추론", "answer": 3, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "blankTpl": "In other words, says Warneken, it’s a(n) ▢ that drives children to tell white lies.", "subject": "아이들이 선의의 거짓말을 하는 이유", "vocab": [["truthful", "정직한, 솔직한", 4, "🗣️", "the kids were truthful in saying whether it was good or bad.", "a"], ["grown-up", "어른, 성인", 5, "🧑", "If the grown-up acted sad about being a bad artist …", "n"], ["reassure", "안심시키다", 6, "🤗", "most of the kids would rush to reassure her that it wasn’t too awful.", "v"], ["white lie", "선의의 거짓말", 8, "🤍", "In other words, they told a white lie …", "n"], ["consequence", "결과", 10, "🎲", "There were no negative consequences for telling the truth to these bad artists …", "n"], ["conflicting", "상충되는, 모순되는", 15, "⚔️", "children are trying to resolve two conflicting norms — honesty vs. kindness …", "a"], ["norm", "규범", 15, "📏", "children are trying to resolve two conflicting norms …", "n"]], "pages": [[{"en": "Harvard psychologist Felix Warneken had adults show elementary-aged children two pictures they drew — one pretty good, one terrible.", "g": [["had adults show", "사역동사 had + O + 원형", "'어른들이 보여 주게 했다'. have가 사역동사로 쓰여 목적격보어에 동사원형 show가 왔다.", "g"], ["two pictures they drew", "목적격 관계대명사 생략", "two pictures (that) they drew. '그들이 그린 두 장의 그림'.", "g"]]}, {"en": "If the adult didn’t show any particular pride in the picture, the kids were truthful in saying whether it was good or bad.", "g": [["whether it was good or bad", "명사절 whether", "'좋은지 on", true, "정답. 어른이 슬퍼하면 서둘러 안심시켰고, 낯선 사람이 기분 좋아지기를 바랐다. 상대의 감정에 공감한 것이다."], ["desire for getting fast attention", false, "관심을 받으려는 동기는 글에 없다."], ["intention of pleasing themselves", false, "자기 자신이 아니라 '이 낯선 사람들'(these strangers)을 기분 좋게 하려 했다."]], "flow": ["실험 — 어른이 아이들에게 잘 그린 그림과 형편없는 그림을 보여 준다", "조건 1 — 어른이 무심하면 아이들은 정직하게 평가한다", "조건 2 — 어른이 슬퍼하면 아이들은 서둘러 위로(선의의 거짓말). 나이가 들수록 더 그렇다", "해석 — 불이익이 없었는데도 그랬다 = 상대가 기분 좋아지길 바란 것 → (빈칸) 공감하는 유대감", "덧붙임 — 정직 vs 친절의 충돌에서 7세 무렵부터 친절 편에 선다"], "bg": "Felix Warneken은 어린아이의 이타적 행동을 연구하는 발달심리학자로, 생후 18개월 아기도 어른이 물건을 떨어뜨리면 주워 준다는 실험으로 유명하다. 이 글의 실험은 '거짓말 = 나쁜 것'이라는 단순한 도식과 달리, 아이들이 자라면서 정직과 친절이라는 두 가치를 저울질하는 법을 배운다는 것을 보여 준다. 학생들에게 '선의의 거짓말은 정당한가'를 토론 주제로 던져 볼 수 있다.", "quiz": [{"q": "어른이 그림에 별다른 자부심을 보이지 않았을 때 아이들은?", "opts": ["모두 좋다고 말했다", "정직하게 좋은지 나쁜지 말했다", "대답을 거부했다"], "a": 1, "exp": "If the adult didn’t show any particular pride in the picture, the kids were truthful in saying whether it was good or bad."}, {"q": "Warneken의 연구에 따르면 아이들이 일관되게 친절 편에 서기 시작하는 나이는?", "opts": ["약 3세", "약 7세", "약 12세"], "a": 1, "exp": "by about age seven … they start consistently coming down on the side of kindness."}]}, {"no": 3104, "dn": "4", "label": "DAY 31 · 4번", "type": "글의 순서", "answer": 3, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "subject": "전자기력과 중력의 차이", "vocab": [["electromagnetic", "전자기의", 1, "🧲", "The electromagnetic force works between any two things that have electric charge.", "a"], ["charge", "전하", 2, "⚡", "The more the charge, the stronger the force.", "n"], ["separation", "분리, 거리", 4, "↔️", "the force depends on the separation between the objects.", "n"], ["repulsive", "밀어내는, 척력의", 7, "↕️", "electromagnetism can be both attractive and repulsive …", "a"], ["repel", "밀어내다", 9, "🚫", "Like charges, both positive or both negative, repel.", "v"], ["exert", "작용하다, 행사하다", 13, "💥", "… consequently experience and exert no electromagnetic force at all.", "v"], ["neutralize", "중화하다", 17, "⚖️", "You can’t neutralize gravity as you can the electromagnetic force.", "v"]], "pages": [[{"label": "주어진 글", "en": "The electromagnetic force works between any two things that have electric charge. The more the charge, the stronger the force. And, like gravity, the force depends on the separation between the objects. The further they are apart, the weaker the force.", "key": 1, "g": [["like gravity", "순서의 열쇠", "중력과 '같은 점'을 말했다. 뒤에는 But unlike gravity(다른 점)가 오는 것이 자연스럽다.", "v"], ["The more the charge, the stronger the force", "the 비교급, the 비교급", "'~할수록 더 …하다'. 동사 없이 명사구만 남은 축약형이다.", "g"]]}], [{"label": "(B)", "en": "But unlike gravity, electromagnetism can be both attractive and repulsive; it can pull things together and push them apart. Opposite charges, one positive the other negative, attract. Like charges, both positive or both negative, repel.", "key": 1, "g": [["But unlike gravity", "순서의 열쇠", "주어진 글의 like gravity와 짝을 이룬다. 같은 점 → 다른 점으로 넘어가므로 (B)가 첫 번째다.", "v"], ["both attractive and repulsive", "both A and B", "'인력과 척력 둘 다'. 뒤의 pull ~ together / push ~ apart와 대응한다.", "g"], ["Opposite charges, one positive the other negative, attract", "(C)를 부르는 장치", "반대 전하는 끌고 같은 전하는 민다 — (C)의 This가 받는 내용이다.", "v"]]}], [{"label": "(C)", "en": "This means that a composite object that has an equal amount of positive and negative charge will push and pull in equal amounts and consequently experience and exert no electromagnetic force at all.", "g": [["This means that", "순서의 열쇠", "This = (B)의 '반대는 끌고 같은 것은 민다'. 그 논리적 결과(중성 물체는 힘이 0)를 끌어낸다.", "v"], ["that has an equal amount of positive and negative charge", "주격 관계대명사절", "a composite object를 수식한다. 양전하와 음전하가 같은 양인 물체.", "g"], ["will push and pull in equal amounts", "(A)를 부르는 장치", "'같은 양으로 밀고 당긴다' = 균형. (A)의 This balance가 받는 내용이다.", "v"]]}], [{"label": "(A)", "en": "This balance, the result of charge neutrality, can never happen with gravity. There being no negative mass, there is no possibility of a mass-neutral object. You can’t neutralize gravity as you can the electromagnetic force.", "key": 1, "g": [["This balance", "순서의 열쇠", "(C)의 '같은 양으로 밀고 당김'을 받는다. 그 균형이 앞에 나와야 This balance가 성립한다.", "v"], ["There being no negative mass", "독립분사구문 (there 구문)", "Because there is no negative mass를 분사구문으로 만든 것. there가 형식상 주어로 남았다.", "g"], ["as you can the electromagnetic force", "as절의 생략", "as you can (neutralize) the electromagnetic force. 반복되는 동사가 생략되었다.", "g"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)의 This balance가 가리킬 '균형'이 아직 나오지 않았다."], ["(B) – (A) – (C)", false, "(B) 뒤에 바로 (A)가 오면 This balance가 받을 내용((C)의 '같은 양으로 밀고 당김')이 없다."], ["(B) – (C) – (A)", true, "정답. 중력과 같은 점 → (B) 그러나 중력과 달리 인력·척력 둘 다 있다 → (C) 이는(This) 중성 물체는 힘이 0이라는 뜻 → (A) 이 균형(This balance)은 중력에서는 불가능하다."], ["(C) – (A) – (B)", false, "(C)의 This가 가리킬 '반대 전하는 끌고 같은 전하는 민다'가 아직 나오지 않았다."], ["(C) – (B) – (A)", false, "같은 이유로 (C)가 주어진 글 바로 뒤에 올 수 없다."]], "flow": ["주어진 글 — 전자기력: 전하가 많을수록 강하고, 중력처럼 멀어질수록 약하다", "(B) But unlike gravity — 중력과 달리 인력과 척력이 둘 다 있다. 반대 전하는 끌고 같은 전하는 민다", "(C) This — 그러므로 양·음전하가 같은 물체는 밀고 당기는 힘이 상쇄되어 전자기력이 0이다", "(A) This balance — 이 균형은 중력에서는 불가능하다. 음의 질량이 없기 때문"], "bg": "전자기력과 중력은 둘 다 거리의 제곱에 반비례하는 힘이지만, 전자기력은 인력과 척력이 있어 상쇄될 수 있고 중력은 인력만 있어 상쇄되지 않는다. 그래서 원자는 전기적으로 중성이 되어 우리가 일상에서 전자기력을 거의 느끼지 못하는 반면, 훨씬 약한 중력은 질량이 쌓일수록 계속 더해져 행성과 은하를 지배한다. 물리 시간에 배우는 내용을 영어로 읽는 지문이다.", "quiz": [{"q": "전자기력이 중력과 다른 점은?", "opts": ["거리에 영향을 받지 않는다", "인력과 척력이 둘 다 있다", "전하와 무관하다"], "a": 1, "exp": "But unlike gravity, electromagnetism can be both attractive and repulsive."}, {"q": "중력을 중화할 수 없는 이유는?", "opts": ["음의 질량이 존재하지 않기 때문", "중력이 너무 강하기 때문", "물체가 항상 멀리 떨어져 있기 때문"], "a": 0, "exp": "There being no negative mass, there is no possibility of a mass-neutral object."}]}, {"no": 3105, "dn": "5", "label": "DAY 31 · 5번", "type": "문장 넣기", "answer": 3, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "Then the student is followed outside and asked to complete a questionnaire about the library that day.", "subject": "가벼운 접촉이 만족도를 높인다", "vocab": [["questionnaire", "설문지", 1 지를 소개하는 주어진 문장이 그 사이에 들어가야 한다.", "v"], ["Among other questions", "정답의 결정적 단서", "'다른 질문들 가운데'. 설문지가 먼저 언급되어야 성립하는 표현이다.", "v"], ["is asked if the librarian smiled", "ask의 수동 + 명사절 if", "'~인지 질문받는다'. if는 whether와 같은 명사절 접속사다.", "g"]]}, {"en": "( ④ ) In fact, the librarian had not smiled, but the student reports that she did, although he says she did not touch him.", "g": [["( ④ )", "④의 판단", "넣을 수 없다. 앞 문장의 질문(미소, 접촉)에 대한 답이 바로 이어지는 자리다. 설문지 소개가 끼어들면 흐름이 끊긴다.", "v"], ["had not smiled", "과거완료", "학생이 대답하는 시점(reports, 현재)보다 앞선 사실이라 과거완료로 표현했다.", "g"], ["that she did", "대동사 did", "did = smiled. 반복을 피한 대동사다.", "g"]]}, {"en": "( ⑤ ) This experiment goes on all day, and soon a pattern emerges: those students who have been subtly touched report much more satisfaction with the library and life overall.", "key": 1, "g": [["( ⑤ )", "⑤의 판단", "넣을 수 없다. 한 학생의 사례를 마치고 하루 전체의 패턴(결론)으로 넘어가는 자리다.", "v"], ["those students who have been subtly touched", "those who + 완료 수동", "'미묘하게 접촉된 학생들'. 실험의 결론이 담긴 주어부다.", "g"]]}]], "choices": [["( ① ) — She is playing a role in an experiment in unnoticeable physical contact …", false, "아직 the student가 등장하지 않았고, Then이 받을 사건도 없다.", "( ① ) She is playing a role in an experiment in unnoticeable physical contact, and knows that half the time she is to do nothing special, the other half to touch students as lightly as possible."], ["( ② ) — She brushes a student’s hand gently as she returns a library card.", false, "a student가 여기서 처음 나온다. the student로 받는 주어진 문장은 그 뒤여야 한다.", "( ② ) She brushes a student’s hand gently as she returns a library card."], ["( ③ ) — Among other questions, the student is asked if the librarian smiled, and if she touched him.", true, "정답. 카드를 돌려주며 손을 스친 뒤(Then), 밖에서 설문지를 받는다. 그래야 다음 문장의 Among other questions가 성립한다.", "( ③ ) Among other questions, the student is asked if the librarian smiled, and if she touched him."], ["( ④ ) — In fact, the librarian had not smiled, but the student reports that she did …", false, "앞 문장의 질문에 대한 답이 바로 이어지는 자리다. 설문지 소개가 끼어들 수 없다.", "( ④ ) In fact, the librarian had not smiled, but the student reports that she did, although he says she did not touch him."], ["( ⑤ ) — This experiment goes on all day, and soon a pattern emerges …", false, "한 학생의 사례에서 하루 전체의 결론으로 넘어가는 마무리 자리다.", "( ⑤ ) This experiment goes on all day, and soon a pattern emerges: those students who have been subtly touched report much more satisfaction with the library and life overall."]], "flow": ["배경 — Purdue 대학 도서관, 사서가 평소처럼 책을 대출해 준다", "설계 — 사실은 '눈에 띄지 않는 접촉' 실험: 절반은 아무것도 안 하고, 절반은 아주 가볍게 접촉", "사례 — 카드를 돌려주며 한 학생의 손을 스친다", "③ 주어진 문장 — 그런 다음 학생은 밖에서 설문지를 받는다 → 미소·접촉 여부 질문 → 미소는 없었는데 있었다고 답하고, 접촉은 몰랐다고 답한다", "결론 — 온종일 반복하자 패턴: 살짝 접촉된 학생들이 도서관과 삶에 훨씬 더 만족"], "bg": "1976년 Purdue 대학에서 수행된 유명한 '도서관 접촉 실험'이다. 학생들은 접촉을 의식하지 못했는데도 사서에게 더 호감을 느끼고 도서관 만족도가 높아졌다. 이후 식당 종업원이 손님의 손을 살짝 건드리면 팁이 늘어난다는 연구 등으로 이어졌다. 문장 넣기에서는 Then(앞 사건을 받음)과 the student(앞의 a student를 받음), 그리고 뒤 문장의 Among other questions(설문지를 전제)라는 세 단서가 정답을 확정한다.", "quiz": [{"q": "사서가 학생의 손을 스치는 순간은?", "opts": ["책을 건네줄 때", "도서 대출 카드를 돌려줄 때", "설문지를 줄 때"], "a": 1, "exp": "She brushes a student’s hand gently as she returns a library card."}, {"q": "실험 결과 드러난 패턴은?", "opts": ["접촉된 학생들이 불쾌감을 느꼈다", "접촉된 학생들이 도서관과 삶에 더 만족했다", "학생들 대부분이 접촉을 알아차렸다"], "a": 1, "exp": "those students who have been subtly touched report much more satisfaction with the library and life overall."}]}, {"no": 3201, "dn": "1", "label": "DAY 32 · 1번", "type": "글의 주제", "answer": 3, "q": "다음 글의 주제로 가장 적절한 것은?", "subject": "비극을 이루는 요소들", "vocab": [["tragedy", "비극", 1, "🎭", "The term “tragedy” when used to define a play doesn’t simply mean a drama which ends with unfortunate consequences.", "n"], ["imitation", "모방", 3, "🪞", "It is an imitation of complex actions which should arouse an emotional response …", "n"], ["arouse", "불러일으키다, 자극하다", 4, "🔥", "… complex actions which should arouse an emotional response combining fear and pity.", "v"], ["adversity", "역경, 고난", 5, "⛈️", "While comedy shows us a progression from adversity to prosperity, tragedy must show the reverse …", "n"], ["designate", "지명하다, 지정하다", 8, "🏷️", "… a certain kind of character whom we can designate as the tragic hero.", "v"], ["villain", "악당", 11, "🦹", "… we will not be aroused to fear and pity over the misfortunes of a villain …", "n"], ["flaw", "결함, 결점", 16, "💔", "… for he must also possess a certain flaw — the weakness which leads the hero to make an error in judgment …", "n"]], "pages": [[{"en": "The term “tragedy” when used to define a play doesn’t simply mean a drama which ends with unfortunate consequences.", "key": 1, "g": [["when used to define a play", "접속사 + 분사", "when (it is) used ~ 에서 주어와 be동사가 생략된 형태다. 주어 The term과 동사 doesn’t mean 사이에 끼어 있다.", "g"], ["doesn’t simply mean", "통념의 부정", "'단순히 ~를 뜻하는 것이 아니다'. 비극 = 슬픈 결말이라는 상식을 부정하고, 뒤에서 진짜 정의를 하나씩 쌓아 간다.", "v"]]}, {"en": "It is an imitation of complex actions which should arouse an emotional response combining fear and pity.", "key": 1, "g": [["which should arouse", "주격 관계대명사절", "complex actions를 수식한다. 관계사절 안의 동사 arouse의 주어가 which(=actions)다.", "g"], ["combining fear and pity", "현재분사구", "an emotional response를 뒤에서 수식한다. '두려움과 연민을 결합하는' 반응 — 비극의 첫 번째 요소다.", "g"]]}, {"en": "While comedy shows us a progression from adversity to prosperity, tragedy must show the reverse; moreover, this progression must be experienced by a certain kind of character whom we can designate as the tragic hero.", "g": [["While comedy shows us", "대조의 While", "'~하는 반면'. 희극(역경→번영)과 비극(그 반대)을 대조한다. '~하는 동안'으로 읽지 않도록 주의.", "v"], ["moreover", "추가의 연결어", "비극의 두 번째 요소(전개 방향)에 세 번째 요소(비극적 주인공)를 덧붙인다.", "v"], ["whom we can designate as", "목적격 관계대명사", "character를 수식한다. designate A as B(A를 B로 지명하다)에서 A가 whom으로 앞에 나갔다.", "g"]]}], [{"en": "This central figure must be basically good and noble: “good” because we will not be aroused to fear and pity over the misfortunes of a villain, and “noble” both by social position and moral standards because the fall to misfortune would not otherwise be great enough for impact.", "key": 1, "g": [["both by social position and moral standards", "both A and B", "'A와 B 둘 다에서'. 고귀함의 두 기준(사회적 지위, 도덕적 기준)을 묶는다.", "g"], ["would not otherwise be", "otherwise = 가정법", "'그렇지 않으면(고귀하지 않으면) ~하지 않을 것이다'. otherwise 하나가 if절을 대신하므로 would가 쓰였다.", "g"], ["great enough for impact", "형용사 + enough", "enough는 형용사 뒤에 온다. '충격을 줄 만큼 충분히 큰'. 높은 곳에서 떨어져야 충격이 크다는 논리다.", "g"]]}, {"en": "These virtues do not make the tragic hero perfect, however, for he must also possess a certain flaw — the weakness which leads the hero to make an error in judgment which initiates the reversal in his life, causing his death or the death of others or both.", "key": 1, "g": [["make the tragic hero perfect", "make + O + C(형용사)", "'O를 ~하게 만들다'. 5형식으로, perfect가 목적격보어다.", "g"], ["for he must also possess", "이유의 접속사 for", "'왜냐하면 ~이니까'. 전치사가 아니라 접속사로 쓰여 뒤에 절(he must possess)이 왔다.", "g"], ["which leads the hero to make", "관계사절 + lead O to-v", "the weakness를 수식한다. lead A to-v는 'A가 ~하도록 이끌다'. 뒤의 which initiates는 an error in judgment를 수식하는 두 번째 관계사절이다.", "g"], ["causing his death", "결과의 분사구문", "'그 결과 ~의 죽음을 야기하면서'. 앞 절 전체의 결과를 분사구문으로 덧붙였다.", "g"]]}]], "choices": [["reasons why tragic dramas are loved", false, "비극이 '사랑받는 이유'는 나오지 않는다. 비극이 무엇으로 이루어지는지를 설명하는 글이다."], ["the stages of the tragic hero’s journey", false, "주인공의 여정을 단계별로 나누지 않았다. 주인공은 비극의 요소 중 하나로 다뤄질 뿐이다."], ["dramatic elements that make up a tragedy", true, "정답. 감정적 반응(두려움+연민), 번영→역경의 전개, 선하고 고귀하면서도 결점을 지닌 주인공 — 비극을 구성하는 요소들을 차례로 정의한다."], ["the process of adversity turning into prosperity", false, "정반대다. 역경→번영은 '희극'의 전개이고, 비극은 그 반대를 보여 준다."], ["how tragedy creates stronger impressions than comedy", false, "희극과 비교는 전개 방향의 대조일 뿐, 어느 쪽이 더 강한 인상을 주는지는 말하지 않았다."]], "flow": ["도입 — '비극'은 단순히 불행하게 끝나는 극이 아니다", "정의 1 — 두려움과 연민이 결합된 감정적 반응을 일으키는 행동의 모방", "정의 2 — 희극(역경→번영)과 반대로 번영→역경의 전개", "정의 3 — 그 전개를 겪는 '비극적 주인공': 선하고(악당이면 연민이 없다) 고귀해야(추락이 커야 충격이 있다) 한다", "정의 4 — 그러나 완벽하지 않다: 판단 착오를 낳는 결점(flaw)이 파 nourish the stump of a felled tree for centuries by feeding it sugars and other nutrients, and so keeping it ① alive.", "g": [["going so far as to nourish", "분사구문 + go so far as to-v", "주어 The trees가 '심지어 ~하기까지 하면서'. 뒤의 keeping과 and로 병렬된 분사구문이다.", "g"], ["by feeding it sugars", "by v-ing / 4형식", "'~에게 …을 먹임으로써'. feed A B(A에게 B를 먹이다)의 4형식이다.", "g"], ["① alive", "① 적절", "keep + O + C(O를 C인 상태로 두다)의 목적격보어 자리에 형용사 alive가 왔다. alive는 서술 용법으로만 쓰이는 형용사이므로 보어 자리에 알맞다.", "v"]]}, {"en": "A tree’s most important means of staying connected to other trees is a “wood wide web” of soil fungi that connects vegetation in an intimate network.", "key": 1, "g": [["means of staying connected", "주어의 핵 + of v-ing", "주어는 A tree’s most important means(수단)이고 동사는 is다. means는 단·복수 형태가 같다. stay connected는 '연결된 상태로 있다'.", "g"], ["that connects vegetation", "주격 관계대명사절", "a “wood wide web” of soil fungi를 수식한다. 선행사가 단수(web)이므로 connects.", "g"]]}, {"en": "Scientific research aimed at understanding the astonishing abilities of this partnership between fungi and plants ② have only just begun.", "g": [["aimed at understanding", "과거분사구", "Scientific research를 수식한다. be aimed at(~을 목표로 하다)에서 나온 수식어로, 여기까지가 긴 주어다.", "g"], ["② have", "② 어법상 틀림 → has", "주어는 Scientific research(단수)다. 바로 앞의 plants(복수)에 끌려 have를 쓰면 안 된다. 수식어 aimed at ~ plants를 걷어 내고 주어를 찾아야 한다.", "v"]]}, {"en": "The reason trees share food and communicate is that they need each other.", "key": 1, "g": [["The reason trees share", "관계부사 why 생략", "The reason (why) trees share ~. 주어는 The reason, 동사는 is.", "g"], ["is that they need", "보어 that절", "'~라는 것이다'. The reason is that ~ 은 이유를 설명하는 정형 구문이다(because를 쓰지 않는다).", "g"]]}], [{"en": "It takes a forest to create the unique atmospheric conditions ③ where trees can grow and thrive.", "g": [["It takes a forest to create", "it takes A to-v", "'~하는 데 A가 필요하다'. It은 가주어, to create 이하가 진주어다.", "g"], ["③ where", "③ 적절", "선행사 the unique atmospheric conditions(장소·환경)를 수식하며, 뒤에 완전한 절(trees can grow and thrive)이 오 including negative numbers", "전치사 including", "'~을 포함하여'. 분사에서 온 전치사로, 뒤에 명사구가 온다.", "g"]]}, {"en": "These two problems, which rely on simple addition, differ only in the way they are framed.", "key": 1, "g": [[", which rely on simple addition,", "삽입된 관계사절", "These two problems를 보충 설명하는 계속적 용법. 주어와 동사 differ 사이에 끼어 있다.", "g"], ["the way they are framed", "the way (that) + 절", "'그것들이 틀에 넣어지는 방식'. the way 뒤의 관계부사 that(=how)이 생략되었다. 빈칸의 reframe이 여기서 나온다.", "g"]]}, {"en": "In fact, all questions are the frame into which the answers fall.", "key": 1, "g": [["into which the answers fall", "전치사 + 관계대명사", "the frame을 수식한다. the answers fall into the frame에서 into which가 앞으로 나갔다. 질문 = 답의 틀이라는 핵심 문장이다.", "g"]]}], [{"en": "And as you can see, by changing the frame, you can dramatically change the range of possible solutions.", "key": 1, "g": [["by changing the frame", "by v-ing", "'틀을 바꿈으로써'. 이것이 빈칸의 reframe problems(문제의 틀을 다시 만들다)과 같은 말이다.", "v"]]}, {"en": "Albert Einstein is quoted as saying, “If I had an hour to solve a problem and my life depended on the solution, I would spend the first fifty-five minutes determining the proper question to ask, for once I know the proper question, I could solve the problem in less than five minutes.”", "g": [["is quoted as saying", "be quoted as v-ing", "'~라고 말한 것으로 인용되다'. 인용 출처를 밝히는 표현이다.", "v"], ["If I had an hour", "가정법 과거", "현재 사실의 반대를 가정. if절에 과거형 had, 주절에 would spend가 짝을 이룬다.", "g"], ["spend the first fifty-five minutes determining", "spend + 시간 + v-ing", "'~하는 데 시간을 쓰다'. 60분 중 55분을 '질문 정하기'에 쓴다 — 질문(틀)이 그만큼 중요하다는 뜻이다.", "g"], ["for once I know", "for(이유) + once(일단 ~하면)", "for는 '왜냐하면'의 접속사, once는 '일단 ~하면'의 접속사다.", "v"]]}, {"en": "______ is an important tool for increasing your imagination because it unlocks a vast array of solutions.", "key": 1, "g": [["______ is an important tool", "빈칸의 논리", "빈칸은 주어. 글 전체가 '질문의 틀(frame)을 바꾸면 해법의 범위가 넓어진다'고 했으므로 '문제의 틀을 다시 만드는 능력'이 들어가야 한다.", "v"], ["because it unlocks a vast array of solutions", "빈칸의 힌트", "'수많은 해법을 열어 준다'는 것은 앞의 by changing the frame, you can dramatically change the range of possible solutions와 같은 내용이다.", "v"]]}]], "choices": [["Letting your mind flow freely", false, "자유로운 사고가 아니라 '질문을 어떻게 짜느냐'가 핵심이다. 아인슈타인은 55분을 질문 결정에 쓴다고 했다."], ["Being willing to learn new things", false, "새로운 것을 배우는 태도는 언급되지 않았다."], ["Removing stereotypes and prejudices", false, "고정관념·편견이라는 말은 나오지 않는다. 질문의 틀(frame)이 열쇠말이다."], ["Mastering the ability to reframe problems", true, "정답. 두 덧셈 문제는 '틀에 넣어지는 방식(the way they are framed)'만 다르고, 틀을 바꾸면 해법의 범위가 극적으로 바뀐다고 했다. reframe = 틀을 다시 만들다."], ["Expanding your interests by shifting your focus", false, "관심사 확장은 무관하다. 주안점을 바꾸는 것이 아니라 질문 자체를 다시 짜는 것이다."]], "flow": ["예시 — '5+5는?'은 답이 하나, '합이 10인 두 수는?'은 답이 무한", "분석 — 같은 덧셈인데 '틀에 넣어지는 방식'만 다르다", "일반화 — 모든 질문은 답이 담기는 틀이다. 틀을 바꾸면 해법의 범위가 바뀐다", "권위 — 아인슈타인: 60분 중 55분을 '적절한 질문 정하기'에 쓰겠다", "결론(빈칸) — 문제의 틀을 다시 만드는 능력이 상상력을 키우는 도구다"], "bg": "Tina Seelig의 『인지니어스(inGenius)』에 나오는 '리프레이밍(reframing)' 개념이다. 같은 문제라도 어떻게 묻느냐에 따라 답의 범위가 완전히 달라진다는 것으로, 디자인 씽킹에서 '문제 정의' 단계를 중시하는 이유다. 아인슈타인의 인용구는 그가 실제로 한 말인지 확실하지 않지만, 좋은 질문이 좋은 답을 낳는다는 뜻으로 널리 쓰인다.", "quiz": [{"q": "두 덧셈 문제의 차이는 무엇인가?", "opts": ["난이도가 다르다", "틀에 넣어지는 방식(질문 방식)만 다르다", "덧셈과 뺄셈으로 연산이 다르다"], "a": 1, "exp": "These two problems, which rely on simple addition, differ only in the way they are framed."}, {"q": "아인슈타인은 한 시간 중 55분을 무엇에 쓰겠다고 했는가?", "opts": ["문제를 푸는 데", "묻기에 적절한 질문을 정하는 데", "답을 검토하는 데"], "a": 1, "exp": "I would spend the first fifty-five minutes determining the proper question to ask."}]}, {"no": 3204, "dn": "4", "label": "DAY 32 · 4번", "type": "무관한 문장", "answer": 4, "q": "다음 글에서 전체 흐름과 관계 없는 문장은?", "subject": "관찰의 힘과 한계", "vocab": [["solid", "믿을 수 있는, 확실한", 1, "🧱", "Observation can offer ethnographers solid evidence of demonstrated behaviors …", "a"], ["verify", "입증하다, 확인하다", 4, "✅", "… when we want to use people’s actions to independently verify their spoken claims …", "v"], ["make sense of", "~을 이해하다", 5, "🧩", "… describe and make sense of what is happening when no one can — or will — talk with us …", "phr"], ["capture", "포착하다", 7, "📸", "… and better capture higher-level patterns of behavior especially regarding objects and environments.", "v"], ["justify", "옳음을 보여주다, 정당화하다", 10, "⚖️", "… and justify our claims to others.", "v"], ["attribute A to B", "B에 A(의 성질)가 있다고 생각하다", 12, "🔗", "… and the meanings actors attribute to them.", "phr"], ["address", "(문제를) 다루다", 16, "🛠️", "… to address most ethnographers’ problems of interest.", "v"]], "pages": [[{"en": "Observation can offer ethnographers solid evidence of demonstrated behaviors occurring within a specific environment at a specific time.", "key": 1, "g": [["offer ethnographers solid evidence", "4형식 offer A B", "'A에게 B를 제공하다'. 글의 주제어 Observation(관찰)이 주어다.", "g"], ["occurring within a specific environment", "현재분사구", "demonstrated behaviors를 수식한다. '특정 환경 안에서 일어나는' 행동.", "g"]]}, {"en": "① Observational skills help, for instance, when we want to use people’s actions to independently verify their spoken claims; describe and make sense of what is happening when no one can — or will — talk with us; and better capture higher-level patterns of behavior especially regarding objects and environments.", "g": [["① Observational skills help", "① 흐름에 맞음", "관찰이 도움이 되는 세 가지 경우를 for instance로 예시한다. 첫 문장의 '믿을 수 있는 증거'를 구체화한다.", "v"], ["to independently verify", "to부정사 병렬의 시작", "want의 목적어 to use 뒤에 (to) describe, (to) make sense of, (to) better capture가 세미콜론(;)과 and로 병렬된다. 반복되는 to는 생략되었다.", "g"], ["no one can — or will — talk", "조동사의 삽입", "can(할 수 있다)과 will(하려 한다)이 대시로 나란히 놓였다. '말할 수 없거나, 말하려 하지 않을 때'.", "g"]]}, {"en": "② Systematic, observation-based data can help us both find out what is actually going on and justify our claims to others.", "g": [["② Systematic, observation-based data", "② 흐름에 맞음", "관찰 데이터의 두 가지 쓸모(실제 파악 + 주장 정당화). 관찰의 장점을 이어서 말한다.", "v"], ["help us both find out", "help + O + (to) 동사원형 / both A and B", "help의 목적격보어로 동사원형 find out과 justify가 both ~ and로 병렬되었다.", "g"]]}], [{"en": "③ But observation only gives clues and partial answers as to why things happen and the meanings actors attribute to them.", "key": 1, "g": [["③ But observation only gives", "③ 흐름에 맞음 — 전환", "But으로 관찰의 '한계'로 넘어간다. '왜'와 '의미'는 관찰만으로 알 수 없다. 이 한계가 ⑤의 결론으로 이어진다.", "v"], ["as to why things happen", "as to(~에 관해) + 간접의문문", "as to의 목적어로 why절과 the meanings가 and로 병렬된다.", "g"], ["the meanings actors attribute to them", "목적격 관계대명사 생략", "the meanings (which) actors attribute to them. attribute A to B에서 A가 관계사로 앞에 나갔다.", "g"]]}, {"en": "④ To avoid such an observational bias we have to carefully design the study questionnaire.", "g": [["④ To avoid such an observational bias", "④ 무관 — 정답", "such an observational bias(그러한 관찰상의 편견)가 받을 내용이 앞에 없다. ③은 관찰이 '왜'를 답하지 못한다는 한계를 말했을 뿐, 편견을 말한 것이 아니다. 설문지 설계라는 화제도 갑자기 등장한다.", "v"]]}, {"en": "⑤ This is why direct observation should be combined with other methods of understanding to address most ethnographers’ problems of interest.", "key": 1, "g": [["⑤ This is why", "⑤ 흐름에 맞음", "This = ③의 한계(관찰은 부분적 답만 준다). 그래서 다른 방법과 결합해야 한다는 결론이다. ④를 빼면 ③ → ⑤가 바로 이어진다.", "v"], ["should be combined with", "be combined with", "'~와 결합되어야 한다'. 관찰 + 다른 방법이 글의 결론이다.", "v"]]}]], "choices": [["Observational skills help, for instance, when we want to use people’s actions to independently verify their spoken claims; describe and make sense of what is happening when no one can — or will — talk with us; and better capture higher-level patterns of behavior especially regarding objects and environments.", false, "관찰이 도움이 되는 경우를 예시한다. 첫 문장을 구체화하므로 흐름에 맞다."], ["Systematic, observation-based data can help us both find out what is actually going on and justify our claims to others.", false, "관찰 데이터의 쓸모를 이어서 말한다. 흐름에 맞다."], ["But observation only gives clues and partial answers as to why things happen and the meanings actors attribute to them.", false, "But으로 관찰의 한계를 제시한다. ⑤의 결론으로 이어지는 전환 문장이다."], ["To avoid such an observational bias we have to carefully design the study questionnaire.", true, "정답. '관찰상의 편견'은 앞에 나온 적이 없고, 설문지 설계는 이 글의 화제가 아니다. 관찰의 한계 → 다른 방법과 결합이라는 흐름을 끊는다."], ["This is why direct observation should be combined with other methods of understanding to address most ethnographers’ problems of interest.", false, "③의 한계를 This로 받아 결론을 내린다. 흐름에 맞다."]], "flow": ["주제 — 관찰은 민족지학자에게 믿을 수 있는 행동 증거를 준다", "장점 — 말의 검증, 말 없는 상황의 이해, 행동 패턴 포착 / 실제 파악 + 주장 정당화", "한계(But) — 그러나 '왜'와 '의미'에 대해서는 부분적인 답만 준다", "④ — '관찰상의 편견'을 피하려면 설문지를 잘 설계하라 → 무관", "결론 — 그래서 관찰은 다른 이해 방법과 결합되어야 한다"], "bg": "민족지학(ethnography)은 연구자가 현장에 들어가 사람들의 삶을 직접 관찰하고 기록하는 인류학의 연구 방법이다. 관찰은 사람들이 '실제로 무엇을 하는지'를 보여 주지만, '왜 그렇게 하는지'와 그 행동이 그들에게 어떤 의미인지는 인터뷰 같은 다른 방법으로 물어야 알 수 있다. 무관한 문장 문제에서는 ④처럼 such, this 같은 지시어가 받을 대상이 앞에 없으면 강력한 단서가 된다.", "quiz": [{"q": "글에 따르면 관찰만으로 알기 어려운 것은?", "opts": ["특정 시간에 일어난 행동", "일이 일어나는 '이유'와 행위자가 부여하는 의미", "사물과 환경에 관한 행동 패턴"], "a": 1, "exp": "observation only gives clues and partial answers as to why things happen and the meanings actors attribute to them."}, {"q": "글의 결론은?", "opts": ["관찰은 다른 방법과 결합되어야 한다", "관찰 대신 설문지를 써야 한다", "관찰만으로 충분하다"], "a": 0, "exp": "direct observation should be combined with other methods of understanding."}]}, {"no": 3205, "dn": "5", "label": "DAY 32 · 5번", "type": "요약문 완성", "answer": 2, "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "summary": "We tend to unknowingly (A)__________ our behavior to make it seem that we have made a (B)__________ choice all along.", "subject": "바뀐 선택도 정당화하는 우리", "vocab": [["readily", "기꺼이; 손쉽게", 7, "🙋", "They readily complied.", "ad"], ["comply", "(요청에) 응하다, 따르다", 7, "👌", "They readily complied.", "v"], ["confront", "(증거 등을) 들이대다; 직면하다", 11, "🃏", "… a double-card ploy was used to confront subjects with the picture of woman B …", "v"], ["distinct", "(성질·종류가) 다른, 별개의", 13, "↔️", "(the two women depicted on the photos were quite distinct).", "a"], ["discrepancy", "불일치", 18, "⚡", "… they ignored the discrepancy between their original conscious decision and what they were told they had decided.", "n"], ["justify", "정당화하다", 20, "🗣️", "… they proceeded to justify this choice …", "v"], ["contradict", "모순되다", 21, "🚫", "… even though it contradicted what they actually did a few seconds earlier.", "v"]], "pages": [[{"en": "In an experiment, more than one hundred volunteers were shown two photographs, each of a woman’s face.", "g": [["were shown two photographs", "4형식의 수동태", "show A B(A에게 B를 보여 주다)에서 A가 주어가 된 수동태. 목적어 two photographs가 뒤에 그대로 남았다.", "g"], ["each of a woman’s face", "each (being) of", "'각각은 여성의 얼굴(사진)'. each (of them being a photograph) of a woman’s face를 줄인 동격적 표현이다.", "g"]]}, {"en": "After looking at both pictures for a few seconds, they had to choose the one that looked most attractive to them.", "g": [["After looking at", "전치사 + 동명사", "After (they looked at) ~ 를 동명사로 줄였다.", "g"], ["the one that looked most attractive", "the one + 관계사절", "the one = the picture. that 이하가 수식한다. look + 형용사는 '~하게 보이다'.", "g"]]}, {"en": "Immediately after three such choices, subjects were shown again the face they had just chosen and were asked to explain their choice.", "g": [["the face they had just chosen", "관계사 생략 + 과거완료", "the face (which) they had just chosen. 보여진 시점(were shown)보다 선택이 먼저이므로 과거완료 had chosen.", "g"], ["were asked to explain", "ask + O + to-v의 수동", "'~하도록 요청받았다'. 실험의 정상 조건: 자기가 고른 얼굴을 설명한다.", "g"]]}, {"en": "They readily complied.", "g": []}, {"en": "On three other trials, the experimentalist, in a sleight of hand, exchanged the picture of the chosen woman with the opposite image.", "key": 1, "g": [["On three other trials", "실험의 조작 조건", "정상 조건 3회와 대비되는 '속임수 조건' 3회. 여기서부터가 실험의 핵심이다.", "v"], ["exchanged the picture of the chosen woman with", "exchange A with B", "'A를 B와 맞바꾸다'. 고른 사진을 고르지 않은 사진과 바꿔치기했다.", "g"]]}], [{"en": "That is, immediately after deciding that woman A was more attractive, a double-card ploy was used to confront subjects with the picture of woman B and they had to explain why they chose her (the two women depicted on the photos were quite distinct).", "g": [["That is", "재진술의 연결어", "'즉'. 앞 문장의 속임수를 구체적으로 다시 설명한다.", "v"], ["confront subjects with the picture of woman B", "confront A with B", "'A에게 B를 들이대다'. A를 골랐는데 B를 보여 주고 설명하게 한 것이다.", "g"], ["the two women depicted on the photos", "과거분사구", "depicted ~ 가 the two women을 수식한다. 두 여성이 '꽤 달랐다'는 것은 속임수를 알아차리기 쉬웠어야 한다는 뜻이다.", "g"]]}, {"en": "Remarkably, most of the time the subjects were fooled.", "key": 1, "g": [["Remarkably", "결과의 신호", "'놀랍게도'. 두 여성이 꽤 달랐는데도 대부분 속았다는 결과다.", "v"]]}, {"en": "Only in fewer than 25% of trials were participants aware that their original choice was not honored, that they had been fooled.", "g": [["Only in fewer than 25% of trials were participants aware", "Only + 부사구 도치", "준부정어 Only가 이끄는 부사구가 문두에 오면서 주어(participants)와 동사(were)가 도치되었다. 75% 이상은 속임수를 눈치채지 못했다.", "g"], [", that they had been fooled", "that절의 재진술", "앞의 that절(원래 선택이 존중되지 않았다)을 다른 말로 다시 쓴 동격적 that절이다.", "g"]]}, {"en": "Most of the time, they ignored the discrepancy between their original conscious decision and what they were told they had decided.", "key": 1, "g": [["between their original conscious decision and", "between A and B", "A는 명사구, B는 뒤의 what이 이끄는 명사절. '원래 결정'과 '결정했다고 들은 것' 사이의 불일치다.", "g"], ["what they were told they had decided", "삽입절 they were told", "what (they were told) they had decided. '(그들이 들은 바로는) 자신이 결정했다는 것'. they were told가 삽입되었다.", "g"]]}, {"en": "And even more remarkably, they proceeded to justify this choice even though it contradicted what they actually did a few seconds earlier.", "key": 1, "g": [["proceeded to justify this choice", "proceed to-v / 요약문의 근거", "'~하기에 이르다'. 바꿔치기된 선택을 정당화했다 = 처음부터 그렇게 고른 것처럼(deliberately) 보이도록 행동을 바꿨다(change).", "v"], ["even though it contradicted", "양보의 even though", "'~에도 불구하고'. it = this choice(바뀐 선택). 몇 초 전 실제 행동과 모순되는데도 정당화했다.", "g"]]}]], "choices": [["change – accidentally", false, "(A)는 맞지만 (B)가 틀렸다. 피실험자들은 바뀐 선택을 '우연한' 것이 아니라 자기가 의도해서 고른 것처럼 설명했다."], ["change – deliberately", true, "정답. 피실험자들은 자기가 고르지 않은 사진을 보고도 왜 골랐는지 설명하며 정당화했다. 즉 처음부터 '의도적으로' 고른 것처럼 보이도록 자신도 모르게 행동을 '바꾼' 것이다."], ["overlook – symbolically", false, "불일치를 무시(ignored)하긴 했지만 요약문의 (A)는 '행동'을 어떻게 하느냐다. '상징적으로'는 무관하다."], ["maintain – accidentally", false, "행동을 '유지'한 것이 아니라 바뀐 선택에 맞게 설명을 바꿨다. (B)도 틀렸다."], ["maintain – deliberately", false, "(B)는 맞지만 (A)가 틀렸다. 원래 선택을 유지하지 않고 바뀐 선택을 정당화했다."]], "flow": ["실험 설정 — 100명 이상에게 두 여성 사진 중 더 매력적인 쪽을 고르게 함", "정상 조건 — 3회는 고른 얼굴을 다시 보여 주고 이유를 설명하게 함 (기꺼이 응함)", "조작 조건 — 다른 3회는 손재주로 사진을 바꿔치기해 고르지 않은 얼굴을 설명하게 함", "결과 — 대부분 속았다. 25% 미만만 알아차림. 불일치를 무시함", "핵심 — 몇 초 전 행동과 모순되는데도 바뀐 선택을 정당화함 → 의도적 선택처럼 행동을 바꾼다"], "bg": "스웨덴 룬드 대학의 Petter Johansson 연구팀이 2005년에 발표한 '선택 맹시(choice blindness)' 실험이다. 마술사의 카드 기술을 응용해 사진을 바꿔치기했는데, 대부분의 참가자가 눈치채지 못했을 뿐 아니라 고르지 않은 얼굴에 대해서도 그럴듯한 이유를 만들어 냈다. 우리가 말하는 '선택의 이유'가 실제 결정 과정이 아니라 사후에 만들어진 설명일 수 있음을 보여 주는 대표적인 연구다.", "quiz": [{"q": "속임수 실험에서 참가자들이 바꿔치기를 알아차린 비율은?", "opts": ["25% 미만", "약 절반", "75% 이상"], "a": 0, "exp": "Only in fewer than 25% of trials were participants aware that their original choice was not honored."}, {"q": "가장 놀라운 결과로 제시된 것은?", "opts": ["참가자들이 실험을 거부했다", "참가자들이 고르지 않은 얼굴에 대해서도 선택 이유를 정당화했다", "참가자들이 두 여성을 구별하지 못했다"], "a": 1, "exp": "they proceeded to justify this choice even though it contradicted what they actually did a few seconds earlier."}]}, {"no": 3301, "dn": "1", "label": "DAY 33 · 1번", "type": "빈칸 추론", "answer": 2, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "This raises the worrisome possibility that especially clever individuals holding a weak or unpopular position can get us to agree with that position by ▢.", "subject": "검열이 오히려 믿음을 키운다", "vocab": [["intriguing", "아주 흥미로운", 1, "🧐", "The intriguing thing about the effects of censoring information is not that …", "a"], ["censor", "검열하다", 1, "🚫", "The intriguing thing about the effects of censoring information …", "v"], ["oppose", "반대하다", 6, "✋", "… a speech opposing coed dorms on campus would be banned …", "v"], ["ban", "금지하다", 7, "⛔", "… a speech opposing coed dorms on campus would be banned …", "v"], ["sympathetic", "공감하는, 동조하는", 9, "🤝", "Thus, without ever hearing the speech, they became more sympathetic to its argument.", "a"], ["worrisome", "걱정스러운", 10, "😟", "This raises the worrisome possibility that especially clever individuals …", "a"], ["publicize", "공표하다, 알리다", 15, "📢", "… the most effective strategy may not be to publicize their unpopular views …", "v"]], "pages": [[{"en": "The intriguing thing about the effects of censoring information is not that audience members want to have the information more than they did before; that seems natural.", "g": [["is not that audience members want", "not A(that절) … Rather B", "'흥미로운 점은 ~라는 것이 아니다'. 다음 문장의 Rather, it is that ~ 과 짝을 이루어 진짜 흥미로운 점을 뒤로 미룬다.", "g"], ["more than they did before", "대동사 did", "did = wanted to have the information. 앞의 동사구 반복을 피했다.", "g"]]}, {"en": "Rather, it is that they come to believe in the information more, even though they haven’t received it.", "key": 1, "g": [["Rather, it is that", "진짜 요점", "'오히려 ~라는 것이다'. it = The intriguing thing. 검열의 진짜 효과는 '더 원함'이 아니라 '더 믿음'이다.", "v"], ["come to believe in", "come to-v", "'~하게 되다'. 상태의 변화를 나타낸다. believe in은 '~을 신뢰하다'.", "g"], ["even though they haven’t received it", "양보 + 현재완료", "'받지 못했음에도'. 내용을 모르는데도 더 믿게 된다는 역설이다.", "g"]]}, {"en": "For example, when University of North Carolina students learned that a speech opposing coed dorms on campus would be banned, they became more opposed to the idea of coed dorms.", "key": 1, "g": [["a speech opposing coed dorms", "현재분사구", "opposing ~ 이 a speech를 수식한다. '남녀 공용 기숙사에 반대하는 연설'.", "g"], ["would be banned", "시제 일치 + 수동", "주절 learned(과거)에 맞춰 will → would. 연설이 '금지되는' 것이므로 수동태다.", "g"], ["became more opposed to", "실험 결과", "연설을 듣지도 않았는데 연설의 주장(기숙사 반대)에 더 동조하게 되었다.", "v"]]}, {"en": "Thus, without ever hearing the speech, they became more sympathetic to its argument.", "key": 1, "g": [["without ever hearing the speech", "without + 동명사", "'연설을 전혀 듣지 않고도'. ever가 부정의 뜻을 강조한다. 검열된 정보를 받지 못했다는 앞 문장의 haven’t received it과 대응한다.", "g"]]}], [{"en": "This raises the worrisome possibility that especially clever individuals holding a weak or unpopular position can get us to agree with that position by ______.", "key": 1, "g": [["the worrisome possibility that", "동격의 that", "possibility의 내용을 that절이 설명한다. '~라는 가능성'.", "g"], ["holding a weak or unpopular position", "현재분사구", "especially clever individuals를 수식한다. 인기 없는 입장을 가진 사람들이 주어다.", "g"], ["can get us to agree with that position by ______", "get + O + to-v / 빈칸의 논리", "'우리가 ~에 동조하게 만들다'. 방법(by)이 빈칸. 앞의 예에서 연설이 '금지되자' 사람들이 더 동조했으므로, 자기 메시지가 '제한되도록 만드는 것'이 방법이다.", "v"]]}, {"en": "The irony is that for such people — members of fringe political groups, for example — the most effective strategy may not be to publicize their unpopular views, but to get those views officially censored and then to publicize the censorship.", "key": 1, "g": [["may not be to publicize their unpopular views, but", "not A but B", "'A가 아니라 B'. 견해를 알리는 것(A)이 아니라 검열되게 하는 것(B)이 효과적이라는 결론. 빈칸의 재진술이다.", "g"], ["get those views officially censored", "get + O + p.p.", "'O가 ~되게 하다'. 견해가 '검열되는' 것이므로 과거분사 censored. 빈칸의 have their message restricted와 같은 구조다.", "g"]]}]], "choices": [["provoking sympathy for their weakness", false, "약점에 대한 동정이 아니다. 사람들이 동조한 것은 연설의 '주장'이었고, 그 이유는 검열이었다."], ["arranging to have their message restricted", true, "정답. 연설이 금지되자 학생들은 듣지도 않은 주장에 더 동조했다. 그러니 똑똑한 사람이라면 자기 메시지가 '제한되도록' 만들 것이다. 마지막 문장의 get those views officially censored가 재진술이다."], ["setting forth their views as often as possible", false, "정반대다. 마지막 문장에서 견해를 공표하는 것(publicize their views)은 효과적인 전략이 '아니다'라고 했다."], ["providing enough evidence in their argument", false, "증거는 무관하다. 학생들은 연설 내용을 들은 적도 없이 동조했다."], ["forming public opinion to remove the censorship", false, "검열을 없애는 것이 아니라 검열을 '유도하고 알리는' 것이 전략이다."]], "flow": ["도입 — 검열의 흥미로운 효과는 '더 원함'이 아니라 '더 믿음'이다", "예시 — 남녀 공용 기숙사 반대 연설이 금지되자
