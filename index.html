", "opts": ["사람들은 친숙한 의견을 널리 퍼진 의견으로 추론한다", "관리자는 직원의 요청을 무시한다", "고객의 의견이 직원의 의견보다 중요하다"], "a": 0, "exp": "people have a tendency to infer that a familiar opinion is a prevalent one."}, {"q": "(B)에서 관리자가 판단해야 하는 것은?", "opts": ["정책을 바꿀 비용", "조직의 다른 사람들이 그 사안을 어떻게 느끼는지", "요청하는 직원을 해고할지"], "a": 1, "exp": "the manager must decide how the other people in the organization feel about the issue in question."}]}, {"no": 3903, "dn": "3", "label": "DAY 39 · 3번", "type": "문장 넣기", "answer": 5, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "If you discover that the Down-Mouth has crept into your repertoire, practice smiling regularly, which will not only help you avoid looking like an obstinate person, but will make you feel more positive.", "subject": "입꼬리가 처진 표정의 대가", "vocab": [["repertoire", "(할 수 있는 것들의) 목록, 레퍼토리", 2, "🎭", "If you discover that the Down-Mouth has crept into your repertoire …", "n"], ["obstinate", "고집 센, 완고한", 3, "🪨", "… help you avoid looking like an obstinate person …", "a"], ["hopeless", "절망적인, 희망이 없는", 7, "🌧️", "This is done by the person who feels unhappy, hopeless, depressed, angry, or tense.", "a"], ["permanent", "영구적인", 9, "🔒", "… the corners of the mouth will set into a permanent down position.", "a"], ["appearance", "외모, 겉모습", 10, "🪞", "In later life, this can give them an appearance similar to a bulldog …", "n"], ["desirable", "바람직한, 원할 만한", 11, "👍", "… an appearance similar to a bulldog — not a desirable image!", "a"], ["grumpy", "심술궂은", 17, "😠", "… preventing you from frightening little children and being thought of as a grumpy dog.", "a"]], "pages": [[{"en": "The opposite to pulling up the corners of the mouth to show happiness is pulling both corners downward to show the Down-Mouth expression.", "g": [["is pulling both corners downward", "동명사 보어", "주어 The opposite ~ happiness의 보어로 동명사구가 왔다. 진행형이 아니다. 화제인 Down-Mouth(처진 입) 표정을 정의하는 문장이다.", "g"]]}, {"en": "( ① ) This is done by the person who feels unhappy, hopeless, depressed, angry, or tense.", "g": [["( ① )", "①의 판단", "넣을 수 없다. 앞에서 표정을 정의했을 뿐이고, 이 문장은 누가 그 표정을 짓는지 설명한다. 아직 '나쁜 점'이 나오지 않았으므로 웃는 연습을 권할 이유가 없다.", "v"], ["This is done by", "This의 지칭 + 수동태", "This는 앞 문장의 처진 입 표정(the Down-Mouth expression)이다. by 이하가 표정을 짓는 행위자다.", "v"]]}, {"en": "( ② ) Unfortunately, if a person holds these negative emotions throughout their lifetime, the corners of the mouth will set into a permanent down position.", "g": [["( ② )", "②의 판단", "넣을 수 없다. 이 문장의 these negative emotions는 바로 앞 문장의 감정 목록(unhappy, hopeless …)을 받는다. 그 사이에 다른 문장이 끼면 these가 끊긴다.", "v"], ["these negative emotions", "지시어 these", "앞 문장에 열거된 부정적 감정들을 묶어 받는다. 앞 문장과 이 문장이 단단히 붙어 있다는 표시다.", "v"]]}], [{"en": "( ③ ) In later life, this can give them an appearance similar to a bulldog — not a desirable image!", "g": [["( ③ )", "③의 판단", "넣을 수 없다. this는 앞 문장의 '입꼬리가 영구적으로 처지는 것'을 받아 그 결과(불독 같은 외모)를 말한다. 부정적 영향의 설명이 계속되는 중이다.", "v"], ["similar to a bulldog", "형용사구의 후치 수식", "similar to ~가 an appearance를 뒤에서 수식한다. '불독과 비슷한 외모'. 대시 뒤는 필자의 논평이다.", "g"]]}, {"en": "( ④ ) Studies show that we stand further away from people who have this expression, give them less eye contact, and avoid them when they are walking towards us.", "key": 1, "g": [["( ④ )", "④의 판단", "넣을 수 없다. 이 문장도 처진 입의 부정적 영향(사람들이 피한다)을 덧붙이는 연구 결과다. 아직 해결책으로 넘어갈 자리가 아니다.", "v"], ["give them less eye contact, and avoid them", "동사구의 병렬", "that절 안에서 stand, give, avoid 세 동사구가 and로 연결되었다. 모두 주어 we의 행동이다.", "g"]]}, {"en": "( ⑤ ) It will also play a role in preventing you from frightening little children and being thought of as a grumpy dog.", "key": 1, "g": [["( ⑤ )", "⑤의 판단 — 정답", "앞까지는 처진 입의 나쁜 영향, 이 문장은 갑자기 It이 '또 다른' 좋은 효과를 준다고 한다. It이 가리킬 것과 also가 이어받을 첫 번째 효과가 없다. 주어진 문장(웃는 연습 → 고집 세 보이지 않고 긍정적으로 느낌)이 들어가면 It = 웃는 연습, also = 두 번째 효과로 자연스럽다.", "v"], ["It will also", "It과 also의 단서", "It은 주어진 문장의 practice smiling regularly를 받고, also는 주어진 문장에서 말한 효과에 하나를 더한다는 뜻이다. 이 두 단어가 정답의 열쇠다.", "v"], ["preventing you from frightening", "prevent + O + from + v-ing", "'O가 ~하지 못하게 막다'. from 뒤에 frightening과 being thought of 두 동명사가 and로 병렬되었다.", "g"]]}]], "choices": [["( ① ) — This is done by the person who feels unhappy, hopeless, depressed, angry, or tense.", false, "표정을 정의한 직후다. 아직 나쁜 점이 나오지 않았으므로 해결책(웃는 연습)이 올 자리가 아니다.", "( ① ) This is done by the person who feels unhappy, hopeless, depressed, angry, or tense."], ["( ② ) — Unfortunately, if a person holds these negative emotions throughout their lifetime, the corners of the mouth will set into a permanent down position.", false, "these negative emotions가 앞 문장의 감정 목록을 직접 받으므로 사이에 끼울 수 없다.", "( ② ) Unfortunately, if a person holds these negative emotions throughout their lifetime, the corners of the mouth will set into a permanent down position."], ["( ③ ) — In later life, this can give them an appearance similar to a bulldog — not a desirable image!", false, "this가 앞 문장의 '영구적으로 처진 입꼬리'를 받아 그 결과를 말한다. 부정적 영향의 설명이 이어지는 중이다.", "( ③ ) In later life, this can give them an appearance similar to a bulldog — not a desirable image!"], ["( ④ ) — Studies show that we stand further away from people who have this expression, give them less eye contact, and avoid them when they are walking towards us.", false, "처진 입의 또 다른 부정적 영향(사람들이 피한다)을 덧붙이는 연구 결과다. 해결책 뒤에 올 내용이 아니다.", "( ④ ) Studies show that we stand further away from people who have this expression, give them less eye contact, and avoid them when they are walking towards us."], ["( ⑤ ) — It will also play a role in preventing you from frightening little children and being thought of as a grumpy dog.", true, "정답. 앞까지는 부정적 영향, 이 문장은 It이 '또 다른' 긍정적 효과를 준다고 한다. 주어진 문장이 들어가야 It(웃는 연습)과 also(효과 추가)가 성립한다.", "( ⑤ ) It will also play a role in preventing you from frightening little children and being thought of as a grumpy dog."]], "flow": ["정의 — 입꼬리를 위로 올리는 웃음의 반대가 양쪽 입꼬리를 내리는 '처진 입' 표정이다", "원인 — 불행·절망·우울·분노·긴장을 느끼는 사람이 이 표정을 짓는다", "결과 1 — 평생 그 감정을 지니면 입꼬리가 영구적으로 처지고, 노년에 불독 같은 외모가 된다", "결과 2 — 사람들은 이런 표정의 사람과 거리를 두고, 눈을 덜 마주치고, 피한다", "⑤ 주어진 문장 — 처진 입을 발견하면 웃는 연습을 하라: 고집 세 보이지 않고 긍정적으로 느낀다 / 또한 아이를 겁주거나 심술궂은 개로 여겨지는 것도 막는다"], "bg": "앨런 피즈의 『보디 랭귀지』 계열 책에서 자주 소개되는 내용으로, 표정이 습관이 되면 근육과 주름으로 굳어져 실제 감정과 무관하게 인상을 결정한다는 것이다. 웃는 표정을 짓는 것만으로도 기분이 좋아진다는 '안면 피드백 가설'도 이 글의 '웃는 연습이 더 긍정적으로 느끼게 한다'는 주장과 통한다. 문장 넣기에서는 It, also처럼 앞 내용을 전제로 하는 단어가 흐름의 단절을 드러내는 신호다.", "quiz": [{"q": "처진 입 표정을 가진 사람에게 우리는 어떻게 반응하는가?", "opts": ["더 가까이 다가가 말을 건다", "더 멀리 떨어져 서고 눈을 덜 마주치며 피한다", "웃음으로 응답한다"], "a": 1, "exp": "we stand further away from people who have this expression, give them less eye contact, and avoid them."}, {"q": "주어진 문장이 권하는 것과 그 효과는?", "opts": ["규칙적으로 웃는 연습 — 고집 세 보이지 않고 더 긍정적으로 느낀다", "거울 보기 — 표정을 점검한다", "말을 줄이기 — 오해를 막는다"], "a": 0, "exp": "practice smiling regularly, which will not only help you avoid looking like an obstinate person, but will make you feel more positive."}]}, {"no": 3904, "dn": "4~5", "label": "DAY 39 · 4~5번", "type": "장문 (제목 · 어휘)", "answer": 5, "q": "윗글의 제목으로 가장 적절한 것은?", "q2": "밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은? [3점]", "answer2": 5, "subject": "손실 혐오 편견과 이민에 대한 반감", "vocab": [["controversial", "논란거리의, 논란이 많은", 1, "🔥", "Immigration is controversial because we tend to focus more on the downside than the upside.", "a"], ["loss aversion", "손실 혐오", 6, "📉", "… our thinking is clouded by the loss aversion bias.", "n"], ["equivalent", "동등한", 9, "🟰", "… favor avoiding losses rather than securing equivalent gains.", "a"], ["adverse", "부정적인, 불리한", 17, "👎", "… which contributed to an adverse attitude toward immigration.", "a"], ["manipulate", "조작하다", 23, "🎛️", "… policies can be shaped and even manipulated in the direction of objecting to immigration …", "v"], ["adept", "능숙한", 27, "🎯", "… it’s important to recognize how adept — and influential — the adverse framing of immigration has been …", "a"], ["rhetoric", "과장된 말, 미사여구", 32, "🎤", "… the rhetoric of “we’re losing our country” is so convincing …", "n"]], "pages": [[{"en": "Immigration is controversial because we tend to focus more on the downside than the upside.", "key": 1, "g": [["tend to focus more on the downside than the upside", "주제의 제시", "'긍정적 면보다 부정적 면에 더 집중하는 경향'. 이민이 논란인 이유를 심리(편향)에서 찾겠다는 선언이다. 제목 ⑤의 '무엇이 이민을 바람직하지 않다고 생각하게 하는가'가 여기서 출발한다.", "v"]]}, {"en": "The psychologists Amos Tversky and Daniel Kahneman proposed that in many areas of life we make bad decisions because our thinking is clouded by the loss aversion bias.", "key": 1, "g": [["is clouded by the loss aversion bias", "글의 핵심 개념", "cloud는 '흐리게 하다'. 손실 혐오 편견(같은 크기의 이익보다 손실을 더 크게 느끼는 성향)이 이 글 전체를 설명하는 열쇠말이다.", "v"]]}, {"en": "After conducting many experiments, they concluded that people have a tendency to (a) favor avoiding losses rather than securing equivalent gains.", "g": [["(a) favor", "(a) 적절", "손실 혐오란 손실을 피하는 것을 '선호'하는 것이다. 뒤의 rather than securing equivalent gains(같은 이익을 얻기보다)와 짝이 맞는다.", "v"], ["rather than securing", "A rather than B", "'B보다는 A'. avoiding losses와 securing gains 두 동명사가 비교된다. 손실 회피 > 이익 확보.", "g"]]}, {"en": "To support their idea, Norwegian economist Thea Wiig conducted an experiment presenting people with statistics about the employment of immigrants (showing the potential gains from immigration) and about the impact of immigration on welfare programs (implying the potential losses).", "g": [["presenting people with statistics", "현재분사구 + present A with B", "presenting ~이 an experiment를 수식한다. present A with B는 'A에게 B를 제시하다'. 뒤의 about ~ and about ~ 두 전치사구가 statistics를 수식하며 병렬을 이룬다.", "g"]]}, {"en": "She found that losses appear to be more (b) significant than gains in people’s minds, which contributed to an adverse attitude toward immigration.", "key": 1, "g": [["(b) significant", "(b) 적절", "손실 혐오 편견대로, 사람들 마음속에서 손실이 이익보다 더 '크게' 느껴진다. 그것이 반이민 태도로 이어진다는 흐름과 맞다.", "v"], ["which contributed to", "계속적 용법의 which", "콤마 뒤의 which는 앞 절 전체(손실이 더 크게 느껴진다는 사실)를 받는다. contribute to는 '~에 기여하다, ~의 원인이 되다'.", "g"]]}], [{"en": "Specifically, information about the employment rate of immigrants in Norway, which is almost 60 percent, causes individuals to rate their preferences for immigration policy more strictly.", "g": [["which is almost 60 percent", "삽입된 관계사절", "콤마 사이의 which는 the employment rate를 보충 설명한다. 주어는 information, 동사는 멀리 있는 causes다.", "g"], ["causes individuals to rate", "cause + O + to-v", "'O가 ~하게 하다'. 취업률 정보(이익 정보)를 봐도 사람들은 오히려 이민 정책을 더 엄격하게 평가했다 — 이익은 마음을 움직이지 못한다는 예다.", "g"]]}, {"en": "The implication of this research is that policies can be shaped and even manipulated in the direction of (c) objecting to immigration once we note that people are more willing to go without the benefits of immigration than to bear the costs of it.", "key": 1, "g": [["(c) objecting", "(c) 적절", "사람들이 이익을 포기하더라도 손실(비용)은 피하려 한다면, 정책은 이민에 '반대하는' 쪽으로 몰아가기 쉽다. object to는 '~에 반대하다'.", "v"], ["more willing to go without the benefits of immigration than to bear", "비교 구문의 병렬", "more willing to A than to B. '비용을 감당하기보다 이익 없이 지내는 쪽을 택한다'. go without은 '~ 없이 지내다'. 손실 혐오를 이민에 적용한 문장이다.", "g"]]}, {"en": "As we approach 2030, it’s important to recognize how adept — and influential — the adverse framing of immigration has been, and how effectively it has (d) overpowered those who have promoted its benefits.", "g": [["how adept — and influential — the adverse framing of immigration has been", "간접의문문(how + 형용사)", "recognize의 목적어. how adept ~ has been은 「how + 형용사 + 주어 + 동사」 순서다. 대시 사이의 and influential은 삽입이다.", "g"], ["(d) overpowered", "(d) 적절", "부정적 프레임이 이민의 이익을 홍보한 사람들을 '압도했다'. 손실 강조가 이익 강조를 이긴다는 글의 논지와 맞다.", "v"]]}, {"en": "Journalist James Surowiecki argues that the rhetoric of “we’re losing our country” is so convincing because it appeals to our loss aversion bias, which has given an electoral edge to (e) pro-immigration candidates.", "g": [["so convincing because", "so ~ because", "'~때문에 그토록 설득력 있다'. '나라를 잃고 있다'는 말은 '손실'을 자극하므로 손실 혐오 편견에 정확히 호소한다.", "v"], ["(e) pro-immigration", "(e) 문맥상 틀림 → anti-immigration", "'나라를 잃고 있다'는 반이민 구호가 손실 혐오에 호소해 선거에서 유리해진 쪽은 '반이민' 후보여야 한다. pro-(찬성)를 anti-(반대)로 바꿔야 한다.", "v"]]}]], "choices": [["Benefits of Immigration Outweigh the Costs", false, "이민의 이익이 비용보다 크다는 주장은 하지 않았다. 사람들이 왜 손실에 더 반응하는지를 설명하는 글이다."], ["Locals vs. Immigrants: Who Has Actual Power?", false, "현지인과 이민자의 힘겨루기는 글에 없다."], ["How Immigrants Adapt to Life in a New Country", false, "이민자의 적응 과정은 전혀 다루지 않는다."], ["Approaching Immigration Policy from a Humanitarian Perspective", false, "인도적 관점은 언급되지 않았다. 글은 심리적 편향이 정책과 여론에 미치는 영향을 다룬다."], ["What Influences People to Consider Immigration Undesirable?", true, "정답. 이민을 부정적으로 보게 만드는 것은 손실 혐오 편견이라는 설명이 글의 핵심이다."]], "choices2": [["(a) favor", false, "손실 회피를 '선호'하는 것이 손실 혐오 편견의 정의다. 맞다."], ["(b) significant", false, "사람들 마음속에서 손실이 이익보다 더 '크게' 보인다. 맞다."], ["(c) objecting", false, "이익을 포기해도 손실은 피하려 하므로 정책은 이민에 '반대하는' 방향으로 조작될 수 있다. 맞다."], ["(d) overpowered", false, "부정적 프레임이 이익을 홍보한 사람들을 '압도했다'. 맞다."], ["(e) pro-immigration", true, "정답. '나라를 잃고 있다'는 손실 호소로 선거에서 이득을 본 것은 반이민(anti-immigration) 후보다."]], "flow": ["도입 — 이민이 논란인 것은 우리가 이익보다 손해에 더 집중하기 때문이다", "이론 — Tversky와 Kahneman: 손실 혐오 편견이 판단을 흐린다. 사람들은 같은 이익보다 손실 회피를 선호", "실험 — Thea Wiig: 이민자 고용(이익) 통계와 복지 부담(손실) 통계를 보여 주자 손실이 더 크게 느껴져 반이민 태도로", "함의 — 사람들이 이익을 포기해도 비용은 피하려 하니, 정책은 반이민 방향으로 조작될 수 있다", "결론 — '나라를 잃고 있다'는 구호는 손실 혐오에 호소해 반이민 후보에게 선거 우위를 준다"], "bg": "손실 혐오는 카너먼과 트버스키의 전망 이론(prospect theory)의 핵심으로, 같은 금액이라도 잃을 때의 고통이 얻을 때의 기쁨보다 약 두 배 크다는 것이다. 카너먼은 이 연구로 2002년 노벨 경제학상을 받았다. 이 글은 그 편향이 이민 여론과 선거 구호에 어떻게 이용되는지를 보여 주며, '프레이밍(framing)' — 같은 사실을 이익으로 말하느냐 손실로 말하느냐 — 이 판단을 바꾼다는 점을 강조한다.", "quiz": [{"q": "Thea Wiig의 실험에서 사람들에게 제시한 두 종류의 통계는?", "opts": ["이민자 고용(이익)과 복지 프로그램에 미치는 영향(손실)", "이민자의 범죄율과 세금", "이민자의 언어 능력과 학력"], "a": 0, "exp": "statistics about the employment of immigrants (showing the potential gains from immigration) and about the impact of immigration on welfare programs (implying the potential losses)."}, {"q": "'우리는 조국을 잃어버리고 있다'는 말이 설득력 있는 이유는?", "opts": ["사실에 근거하기 때문", "우리의 손실 혐오 편견에 호소하기 때문", "기자들이 자주 인용하기 때문"], "a": 1, "exp": "is so convincing because it appeals to our loss aversion bias const CLS = {}, CLSNO = {};
CLIST.forEach(c => {
  CLS[c]   = DATA.classes[c].map(x => Array.isArray(x) ? x[1] : x);
  CLSNO[c] = DATA.classes[c].map((x,i) => Array.isArray(x) ? x[0] : i+1);
});
const byNo = {}; PS.forEach(p => byNo[p.no] = p);
document.getElementById('logo').src = IMG.emblem;

function screensFor(p){
  const s = [{k:'vocab', label:'VOCAB'}];
  p.pages.forEach((pg,i) => s.push({k:'read', i:i, label:'READ '+(i+1)}));
  s.push({k:'sum', label:'KEY IDEA'});
  s.push({k:'quest', label:'QUESTION'});
  return s;

let saveTimer = null;
function flash(msg, warn){

function collectState(){ return {v:2, done:done, uploads:uploads, vimg:vimg, part:part}; }
function applyState(s){
  if (!s) return;
  Object.keys(done).forEach(k => delete done[k]);
  Object.keys(uploads).forEach(k => delete uploads[k]);
  Object.keys(vimg).forEach(k => delete vimg[k]);

async function exportData(){
  const name = '2학년독해_자료_' + new Date().toISOString().slice(0,10) + '.json';
  const json = JSON.stringify(collectState());

      catch(e){ if (e && e.code === 'declined') flash('저장을 취소했습니다'); else flash('저장에 실패했습니다', true); }
      return;
    }
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    flash('파일로 저장했습니다');
  } catch(e){ flash('저장에 실패했습니다', true); }
}
function importData(inp){
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { applyState(JSON.parse(r.result)); saveState(true); paint(); flash('불러왔습니다'); }
    catch(e){ flash('이 파일은 읽을 수 없습니다', true); }
  };
  r.readAsText(f); inp.value = '';
}
function shrink(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const M = 1500; let w = im.width, h = im.height;
      if (w > M || h > M){ const k = M/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const c = cv.getContext('2d');
      c.fillStyle = '#fff'; c.fillRect(0,0,w,h);
      c.drawImage(im, 0, 0, w, h);
      try { cb(cv.toDataURL('image/jpeg', 0.82)); } catch(e){ cb(r.result); }
    };
    im.onerror = () => cb(r.result);
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mascot(n, css){ return '<img class="mascot" src="'+IMG[n]+'" style="'+css+'" alt="">'; }

function markup(sent, sid){
  let t = esc(sent.en); const gs = sent.g || []; const hits = [];
  gs.forEach((g,gi) => { const ph = esc(g[0]); const at = t.indexOf(ph);
    if (at >= 0) hits.push({at:at, len:ph.length, gi:gi, ty:(g[3]==='v'?'v':'g')}); });
  hits.sort((a,b)=>a.at-b.at);
  let out='', last=0;
  hits.forEach(h => { if (h.at < last) return;
    out += t.slice(last,h.at) + '<span class="gw '+h.ty+'" data-s="'+sid+'" data-g="'+h.gi+'">'+t.slice(h.at,h.at+h.len)+'</span>';
    last = h.at + h.len; });
  out += t.slice(last);
  if (sent.key) out = '<span class="keytag">KEY</span><span class="hlb">' + out + '</span>';
  return out;
}

function hl(sent, word){
  const stop = {'a':1,'an':1,'the':1,'to':1,'of':1,'in':1,'on':1,'with':1,'be':1,'A':1,'B':1};
  const toks = (word.replace(/\([^)]*\)/g,'').match(/[A-Za-z][A-Za-z'\-]*/g) || []).filter(t => !stop[t.toLowerCase()]);
  const base = (toks[0] || word).toLowerCase();
  const phrase = word.replace(/\([^)]*\)/g,'').replace(/\b[AB]\b/g,'').replace(/\s+/g,' ').trim();
  const alt = [];
  if (phrase.split(' ').length > 1) alt.push(phrase);
  alt.push(base, base+'s', base+'es', base+'ed', base+'d', base+'ing', base+'ies', base+'ied',
               base+base.slice(-1)+'ed', base+base.slice(-1)+'ing');
  if (base.endsWith('e')) alt.push(base.slice(0,-1)+'ing', base.slice(0,-1)+'ed');
  if (base.endsWith('y')) alt.push(base.slice(0,-1)+'ies', base.slice(0,-1)+'ied');
  if (phrase.split(' ').length > 1) { const f = alt.shift(); alt.sort((a,b)=>b.length-a.length); alt.unshift(f); }
  else alt.sort((a,b) => b.length - a.length);
  let out = esc(sent);
  for (const a of alt){
    const re = new RegExp('\\b(' + a.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&') + ')\\b', 'i');
    if (re.test(out)){ out = out.replace(re, '<b>$1</b>'); break; }
  }
  return out;
}

function bindSort(){
  const l = document.getElementById('sortlist'); if (!l) return;
  renumber();
  let dragEl = null;
  function onMove(e){
    if (!dragEl) return;
    e.preventDefault();
    const top = document.querySelector('.topbar').offsetHeight + 20;
    const bot = window.innerHeight - document.querySelector('.dock').offsetHeight - 20;
    if (e.clientY < top) window.scrollBy(0, -14);
    else if (e.clientY > bot) window.scrollBy(0, 14);
    const sibs = [...l.children].filter(x => x !== dragEl);
    let idx = 0;
    for (const s of sibs){
      const r = s.getBoundingClientRect();
      if (e.clientY > r.top + r.height/2) idx++;
    }
    if ([...l.children].indexOf(dragEl) !== idx){
      l.insertBefore(dragEl, sibs[idx] || null);
      renumber();
    }
  }
  function onUp(){
    if (!dragEl) return;
    dragEl.classList.remove('drag'); dragEl = null;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  [...l.children].forEach(c => {
    c.addEventListener('pointerdown', e => {
      if (e.target.closest('.arrow')) return;
      e.preventDefault();
      dragEl = c; c.classList.add('drag'); clearMarks();
      document.addEventListener('pointermove', onMove, {passive:false});
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

let wheelRot = 0, spinning = false, actx = null;
function tick(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = 1250;
    g.gain.setValueAtTime(.06, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008, actx.currentTime + .045);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + .05);
  }catch(e){}
}
function fanfare(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    [523,659,784,1047].forEach((f,i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + i*.11;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.11, t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t+.30);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+.32);
    });
  }catch(e){}
}
function drawWheel(names, rot, win){
  const cv = document.getElementById('wheel'); if (!cv) return;
  const c = cv.getContext('2d'), S = 680, R = 320, cx = S/2, cy = S/2;
  const n = names.length, seg = 2*Math.PI/n;
  c.clearRect(0,0,S,S);
  for (let i=0;i<n;i++){
    const a0 = rot + i*seg, a1 = a0 + seg;
    c.beginPath(); c.moveTo(cx,cy); c.arc(cx,cy,R,a0,a1); c.closePath();
    const gold = (win === i);
    c.fillStyle = gold ? '#F5B301' : (i%2 ? '#FFE9AE' : '#1B5299');
    c.fill();
    c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.stroke();
    c.save(); c.translate(cx,cy); c.rotate(a0 + seg/2);
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillStyle = (gold || i%2) ? '#08213F' : '#FFFFFF';
    c.font = '700 ' + Math.max(15, Math.min(30, 620/n + 10)) + 'px "Noto Sans KR", sans-serif';
    c.fillText(names[i], R - 16, 0);
    c.restore();
  }
  c.beginPath(); c.arc(cx,cy,R,0,2*Math.PI);
  c.strokeStyle = '#123A6B'; c.lineWidth = 12; c.stroke();
}
function spin(cls){
  if (spinning) return;
  const pool = CLS[cls].filter(n => !(drawn[cls]||[]).includes(n));
  const win = document.getElementById('winner');
  if (!pool.length){
    drawWheel(['ALL PICKED'], 0);
    win.innerHTML = '<div class="winner"><div class="lbl">ALL PICKED</div>'
      + '<div class="nm en-t" style="font-size:26px">Everyone in '+cls+' has been picked</div></div>';
    return;
  }
  win.innerHTML = '';
  spinning = true;
  const n = pool.length, seg = 2*Math.PI/n;
  const target = Math.floor(Math.random()*n);
  const turns = 5 + Math.floor(Math.random()*3);
  const endRot = turns*2*Math.PI - Math.PI/2 - (target + .5)*seg;
  const start = performance.now(), dur = 4600, from = wheelRot % (2*Math.PI);
  let lastIdx = -1;
  function frame(t){
    const e = Math.min(1, (t - start)/dur);
    const k = 1 - Math.pow(1 - e, 3.4);
    wheelRot = from + (endRot - from)*k;
    drawWheel(pool, wheelRot);
    const idx = Math.floor(((((-Math.PI/2 - wheelRot) % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI))/seg);
    if (idx !== lastIdx){ lastIdx = idx; if (e < .985) tick(); }
    if (e < 1) requestAnimationFrame(frame);
    else {
      spinning = false;
      drawWheel(pool, wheelRot, target);
      const name = pool[target];
      (drawn[cls] = drawn[cls] || []).push(name);
      fanfare();
      win.innerHTML = '<div class="winner"><div class="lbl">TODAY\u2019S SPEAKER</div>'
        + '<div class="nm">'+esc(name)+'</div><div class="cl">'+cls+'</div>'
        + '<div class="qbtns">'
        + '<button class="mini" onclick="quickPart(\''+name+'\',\''+cls+'\',\'p\')">\uD83D\uDCAA 참여로 기록</button>'
        + '<button class="mini" onclick="quickPart(\''+name+'\',\''+cls+'\',\'s\')">\uD83D\uDE34 미참여로 기록</button>'
        + '</div></div>';
      showDrawn();
    }
  }
  requestAnimationFrame(frame);
}
function resetDraw(){
  CLIST.forEach(c => drawn[c] = []);
  const w = document.getElementById('winner'); if (w) w.innerHTML = '';
  drawWheel(CLIST.concat(['READY','SPIN','START']), 0);

function step(d){
  if (cur.no === null) return;
  const sc = screensFor(byNo[cur.no]), ni = cur.idx + d;
  const order = DATA.days.flatMap(x => x[1]), at = order.indexOf(cur.no);
  if (ni < 0){
    if (at > 0){ const pn = order[at-1]; cur = {no:pn, idx:screensFor(byNo[pn]).length-1}; paint(); } else goHome();

  if (ni >= sc.length){

const ink = document.getElementById('ink'), cx = ink.getContext('2d');
let drawing = false, color = '#C0304F', eraser = false, penOn = false;
function fitInk(){
  const st = document.getElementById('stage');
  const w = st.clientWidth, h = Math.max(st.clientHeight, window.innerHeight - 96);
  if (ink.width === w && ink.height === h) return;
  const keep = ink.width ? ink.toDataURL() : null;
  ink.width = w; ink.height = h; ink.style.width = w+'px'; ink.style.height = h+'px';
  if (keep){ const im = new Image(); im.onload = () => cx.drawImage(im,0,0); im.src = keep; }
}
function saveInk(){
  if (!ink.width) return;
  const b = document.createElement('canvas'); b.width = ink.width; b.height = ink.height;
  const d = ink.toDataURL();
  if (d !== b.toDataURL()) store[key()] = d; else delete store[key()];
}
function loadInk(){
  cx.clearRect(0,0,ink.width,ink.height);
  const d = store[key()];
  if (d){ const im = new Image(); im.onload = () => cx.drawImage(im,0,0); im.src = d; }
}
function pos(e){ const r = ink.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
  return {x:t.clientX - r.left, y:t.clientY - r.top}; }
function start(e){ if (!penOn) return; e.preventDefault(); drawing = true;
  const p = pos(e); cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineCap='round'; cx.lineJoin='round'; }
function move(e){ if (!drawing) return; e.preventDefault(); const p = pos(e);
  if (eraser){ cx.globalCompositeOperation='destination-out'; cx.lineWidth=34; }
  else { cx.globalCompositeOperation='source-over'; cx.lineWidth=4.5; cx.strokeStyle=color; }
  cx.lineTo(p.x,p.y); cx.stroke(); }
function end(){ drawing = false; }
['mousedown','touchstart'].forEach(e => ink.addEventListener(e, start, {passive:false}));
['mousemove','touchmove'].forEach(e => ink.addEventListener(e, move, {passive:false}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(e => ink.addEventListener(e, end));
function togglePen(){ penOn = !penOn; if (penOn) eraser = false;
  document.body.classList.toggle('pen', penOn);
  document.getElementById('penBtn').classList.toggle('on', penOn && !eraser);
  document.getElementById('eraBtn').classList.remove('on'); }
function toggleEraser(){ eraser = !eraser; penOn = eraser ? true : penOn;
  document.body.classList.toggle('pen', penOn);
  document.getElementById('eraBtn').classList.toggle('on', eraser);
  document.getElementById('penBtn').classList.toggle('on', penOn && !eraser); }
function setColor(b){ document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
  b.classList.add('on'); color = b.dataset.c; eraser = false;
  if (!penOn) togglePen();
  document.getElementById('eraBtn').classList.remove('on');
  document.getElementById('penBtn').classList.add('on'); }
function clearInk(){ cx.clearRect(0,0,ink.width,ink.height); delete store[key()]; }

window.addEventListener('resize', fitInk);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'Escape'){ const p = document.querySelector('.pop'); if (p) p.remove(); else goHome(); }
});
new MutationObserver(() => setTimeout(fitInk, 40)).observe(document.getElementById('view'), {childList:true, subtree:true});
loadState();
paint();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
