ek: 가정 요리의 이상화는 유급 요리사들을 무시한다"], "bg": "'옛날엔 엄마가 집에서 다 해 먹였다'는 향수는 실제로는 가사 노동자를 고용할 수 있던 계층의 기억이라는 지적이다. 20세기 초 미국에서는 가사 노동이 여성, 특히 이민자와 흑인 여성의 가장 흔한 직업이었다. 문장 넣기 문제에서는 these women처럼 앞에 선행사가 반드시 있어야 하는 지시어를 찾고, 그 선행사가 본문에 없으면 주어진 문장이 그 자리라는 원리를 확인한다.", "quiz": [{"q": "글에 따르면 오늘날의 음식 전도사들이 걱정하는 것은?", "opts": ["사람들이 빵을 직접 굽지 않는다", "사람들이 요리를 아예 하지 않는다", "식당 음식이 건강에 나쁘다"], "a": 1, "exp": "today’s food evangelists worry that we’ve stopped cooking altogether."}, {"q": "한 세기 전과 오늘날의 '차이'로 제시된 것은?", "opts": ["요리하는 사람이 달라졌다", "요리하는 장소가 집 안에서 식당으로 바뀌었다", "식사 횟수가 줄었다"], "a": 1, "exp": "The difference is that these women previously worked inside the home, as domestic laborers, rather than in restaurants."}]}, {"no": 3604, "dn": "4~5", "label": "DAY 36 · 4~5번", "type": "장문 (제목 · 어휘)", "answer": 1, "q": "윗글의 제목으로 가장 적절한 것은?", "q2": "밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은? [3점]", "answer2": 4, "subject": "타인의 신경계를 빌려 생존하기", "vocab": [["owe A to B", "A는 B의 덕분이다", 3, "🙏", "… you owe your escape from injury to communication by means of noises.", "phr"], ["for the time being", "잠시, 당분간", 9, "⏳", "You had, for the time being, the advantage of someone else’s nervous system …", "phr"], ["stand for", "~을 의미하다, 상징하다", 12, "🔤", "… the black marks on paper that stand for such noises …", "phr"], ["draw upon", "~에 의지하다", 13, "🪣", "… we are drawing upon the experiences of others in order to make up for what we ourselves have (b) missed.", "phr"], ["supplement", "보완하다, 보충하다", 16, "➕", "… make use of the nervous systems of others to (c) supplement his own …", "v"], ["congregate", "모이다, 집합하다", 21, "🐦", "Birds and animals congregate with their own kind and make noises …", "v"], ["gregariousness", "군거성", 23, "🐑", "In fact, gregariousness as an aid to survival and self-defense is forced upon animals as well as upon man …", "n"]], "pages": [[{"en": "When someone shouts at you, “Look out!” and you jump just in time to avoid being hit by an automobile, you owe your escape from injury to communication by means of noises.", "g": [["to avoid being hit", "avoid + 동명사(수동)", "avoid는 동명사를 목적어로 취한다. '치이는 것'이므로 수동형 being hit.", "g"], ["owe your escape from injury to communication", "owe A to B", "'A는 B 덕분이다'. 부상을 면한 것(A)은 소리를 통한 소통(B) 덕분이다.", "g"]]}, {"en": "You did not see the car coming; nevertheless, someone did, and he made certain noises to communicate his alarm to you.", "g": [["someone did", "대동사 did", "= someone saw the car coming. 나는 못 봤지만 남은 봤다는 대비다. see the car coming은 지각동사 + O + 현재분사.", "g"]]}, {"en": "In other words, although your nervous system did not record the danger, you were (a) unharmed because another nervous system did.", "key": 1, "g": [["(a) unharmed", "(a) 적절", "차를 피했으니 '해를 입지 않았다'. 첫 문장의 escape from injury와 같은 말이다.", "v"], ["because another nervous system did", "대동사 did", "= recorded the danger. 여기서 '신경계'라는 열쇠말이 처음 나온다. 제목의 Nervous Systems of Others다.", "v"]]}, {"en": "You had, for the time being, the advantage of someone else’s nervous system in addition to your own.", "key": 1, "g": [["in addition to your own", "in addition to + 명사", "'~에 더하여'. your own 뒤에 nervous system이 생략되었다. 남의 신경계를 내 것에 보태 쓴다는 핵심 개념이다.", "g"]]}, {"en": "Indeed, most of the time when we are listening to the noises people make or looking at the black marks on paper that stand for such noises, we are drawing upon the experiences of others in order to make up for what we ourselves have (b) missed.", "g": [["the noises people make", "목적격 관계대명사 생략", "the noises (that) people make. '사람들이 내는 소리' = 말. 뒤의 black marks on paper는 글자다.", "g"], ["what we ourselves have (b) missed", "(b) 적절", "남의 경험에 의지하는 것은 내가 '놓친' 것을 메우기 위해서다. make up for(보상하다)와 짝이 맞는다.", "v"]]}], [{"en": "Obviously the more an individual can make use of the nervous systems of others to (c) supplement his own, the easier it is for him to survive.", "key": 1, "g": [["the more an individual can make use of", "the 비교급 ~, the 비교급 …", "'~하면 할수록 더 …하다'. 뒤의 the easier와 짝이다.", "g"], ["(c) supplement", "(c) 적절", "타인의 신경계로 내 것을 '보완한다'. 앞의 in addition to your own과 같은 방향이다.", "v"], ["the easier it is for him to survive", "가주어 it + 의미상 주어 for him", "it이 가주어, to survive가 진주어, for him이 의미상 주어. 제목의 for Survival이 여기 있다.", "g"]]}, {"en": "And, of course, the more individuals in a group make helpful noises at each other, the better it is for all — within the limits, naturally, of the group’s talents for social organization.", "g": [["the more individuals in a group make helpful noises", "the 비교급 구문의 반복", "개인 차원(앞 문장)에서 집단 차원으로 논의를 넓힌다. 뒤의 within the limits, naturally, of는 naturally가 삽입된 형태다.", "g"]]}, {"en": "Birds and animals congregate with their own kind and make noises when they find food or become alarmed.", "g": [["congregate with their own kind", "동물의 예", "인간만이 아니라 동물도 모여 살며 소리로 신호를 주고받는다. 다음 문장의 gregariousness(군거성)로 이어진다.", "v"]]}, {"en": "In fact, gregariousness as an aid to survival and self-defense is forced upon animals as well as upon man by the necessity of (d) separating nervous systems even more than by physical strength.", "key": 1, "g": [["is forced upon animals as well as upon man", "A as well as B", "'B뿐만 아니라 A도'. upon이 이끄는 전치사구 두 개가 병렬된다. 주어는 gregariousness, 동사는 is forced다.", "g"], ["(d) separating", "(d) 문맥상 틀림 → uniting", "군거성(모여 사는 성질)이 필요한 이유는 신경계를 서로 '결합'해 남의 신경계를 빌려 쓰기 위해서다. '분리'는 정반대다. uniting, combining 등으로 고쳐야 한다.", "v"], ["even more than by physical strength", "비교의 대상", "by the necessity of ~ 와 by physical strength를 비교한다. 힘보다 신경계의 결합이 더 큰 이유라는 뜻이다. 제목 ②(신체적 힘)가 오답인 근거이기도 하다.", "v"]]}, {"en": "Societies, both animal and human, might almost be regarded as huge (e) cooperative nervous systems.", "key": 1, "g": [["(e) cooperative", "(e) 적절", "사회 전체가 하나의 거대한 '협동' 신경계라는 결론. 서로 신경계를 빌려 준다는 글 전체의 요지와 맞다.", "v"], ["might almost be regarded as", "regard A as B의 수동", "'거의 ~로 간주될 수도 있다'. might와 almost로 조심스럽게 비유를 제시한다.", "g"]]}]], "choices": [["Using the Nervous Systems of Others for Survival", true, "정답. 남의 신경계를 내 것에 보태 쓸수록 생존이 쉬워지고, 사회는 거대한 협동 신경계라는 글의 요지를 그대로 담았다."], ["The Importance of Physical Strength for Survival", false, "정반대다. 군거성은 신체적 힘'보다' 신경계 결합의 필요 때문에 강요된다고 했다."], ["Noise as an Aid for Gathering and Living Together", false, "소리는 신경계를 이어 주는 수단이지 글의 주제가 아니다. 모여 사는 것 자체가 아니라 '왜' 모여 사는지(남의 신경계를 빌리려고)가 핵심이다."], ["Language and Survival: How We Imitate Each Other", false, "모방은 언급되지 않는다. 남의 경험을 '빌리는' 것이지 따라 하는 것이 아니다."], ["Principles of Perception to Improve Communication", false, "의사소통을 개선하는 원리가 아니라, 의사소통이 생존에 어떤 역할을 하는지를 말하는 글이다."]], "choices2": [["(a) unharmed", false, "차를 피했으니 '해를 입지 않았다'. escape from injury와 같다."], ["(b) missed", false, "남의 경험에 의지하는 것은 내가 '놓친' 것을 보상하기 위해서다. make up for와 짝이 맞는다."], ["(c) supplement", false, "타인의 신경계로 자기 것을 '보완한다'. in addition to your own과 같은 방향이다."], ["(d) separating", true, "정답. 모여 사는 이유는 신경계를 '결합'해 남의 것을 빌려 쓰기 위해서다. '분리'는 정반대이므로 uniting 등으로 고쳐야 한다."], ["(e) cooperative", false, "사회 = 거대한 '협동' 신경계. 서로 신경계를 빌려 준다는 결론과 맞다."]], "flow": ["예시 — \"조심해!\"라는 소리 덕에 차를 피한다: 소리를 통한 소통이 부상을 막았다", "해석 — 내 신경계는 못 봤지만 남의 신경계가 봤다. 잠시 남의 신경계를 빌린 것", "확장 — 말을 듣고 글을 읽는 것도 남의 경험으로 내가 놓친 것을 메우는 일", "원리 — 남의 신경계를 많이 쓸수록 생존이 쉽고, 집단이 서로 신호를 줄수록 모두에게 좋다", "결론 — 동물도 모여 살며 소리를 낸다. 군거성은 신경계 결합의 필요 때문 → 사회는 거대한 협동 신경계"], "bg": "S. I. 하야카와의 『사고와 행동 속의 언어(Language in Thought and Action)』에 나오는 유명한 대목이다. 하야카와는 언어를 '시간과 공간을 넘어 남의 신경계를 빌리는 장치'로 보았다. 책을 읽는 것은 죽은 사람의 신경계까지 빌려 쓰는 셈이다. 어휘 문제에서는 글의 방향(신경계를 '더하고, 보완하고, 협동하는' 쪽)을 잡은 뒤 그 방향에 어긋나는 단어를 찾으면 (d)가 바로 보인다.", "quiz": [{"q": "\"조심해!\"라는 외침 덕에 차를 피한 상황을 필자는 어떻게 설명하는가?", "opts": ["운이 좋았다", "잠시 남의 신경계를 내 것에 보태 쓴 것이다", "반사 신경이 빨랐다"], "a": 1, "exp": "You had, for the time being, the advantage of someone else’s nervous system in addition to your own."}, {"q": "필자에 따르면 군거성이 강요되는 더 큰 이유는?", "opts": ["신체적 힘을 합치기 위해", "신경계를 결합해 서로 빌려 쓰기 위해", "먹이를 나누기 위해"], "a": 1, "exp": "by the necessity of uniting nervous systems even more than by physical strength — 원문의 separating은 uniting으로 고쳐 읽는다."}]}, {"no": 3701, "dn": "1", "label": "DAY 37 · 1번", "type": "글의 제목", "answer": 2, "q": "다음 글의 제목으로 가장 적절한 것은?", "subject": "이야기에 아이 이름을 넣어 주기", "vocab": [["ask for", "~을 찾다; ~을 청하다", 4, "🙋", "I tell the children I’d like to ‘borrow’ a name for the story and ask for a volunteer.", "phr"], ["insert", "끼워 넣다, 삽입하다", 5, "📝", "Then I tell the story inserting the child’s name at the appropriate points.", "v"], ["periodically", "주기적으로, 정기적으로", 7, "🔁", "… a group of children I had worked with periodically over a year …", "ad"], ["occasion", "(특정한) 때, 경우", 11, "🎈", "… many of the other children, too, found that occasion meaningful and exciting.", "n"], ["could do with", "~을 필요로 하다", 12, "🤲", "You might pick a child who you feel could do with feeling special that day …", "phr"], ["alternatively", "혹은, 그 대신에", 14, "🔀", "Alternatively, if you are struggling to build a positive relationship with a particular child, choose them.", "ad"], ["assure", "확신시키다, 납득시키다", 16, "🤝", "It will help to assure the child that you notice and think about them.", "v"]], "pages": [[{"en": "One way you can show children a little special attention is by putting them into your stories.", "key": 1, "g": [["One way you can show children a little special attention is", "관계부사 생략 + 수 일치", "One way (that) you can show ~ 로 관계부사가 생략되었다. 주어의 핵심은 One way이므로 동사는 is. show + 간접목적어(children) + 직접목적어(attention)의 4형식.", "g"], ["by putting them into your stories", "주제문", "'아이들을 이야기 속에 넣음으로써'. 제목의 Add a Child’s Name in a Story가 바로 이 방법이다.", "v"]]}, {"en": "I have done this with a Bob Hartman story called “The Big Soft Fluffy Bed.”", "g": [["called “The Big Soft Fluffy Bed.”", "과거분사구", "a Bob Hartman story를 수식한다. '~라고 불리는'.", "g"]]}, {"en": "I tell the children I’d like to ‘borrow’ a name for the story and ask for a volunteer.", "g": [["tell the children I’d like to", "tell + IO + (that)절", "tell의 직접목적어인 that절에서 that이 생략되었다. '아이들에게 ~하고 싶다고 말하다'.", "g"]]}, {"en": "Then I tell the story inserting the child’s name at the appropriate points.", "g": [["inserting the child’s name", "동시 동작의 분사구문", "'~을 끼워 넣으면서'. 이야기를 하는 것과 이름을 넣는 것이 동시에 일어난다.", "g"]]}, {"en": "When I asked a group of children I had worked with periodically over a year what they had enjoyed most about the story work we had done, many of them chose the time I had used Ethan’s name to tell a story.", "key": 1, "g": [["a group of children I had worked with", "목적격 관계대명사 생략", "children (whom) I had worked with. 이것이 asked의 간접목적어이고, 뒤의 what절이 직접목적어다.", "g"], ["what they had enjoyed most", "간접의문문 + 과거완료", "asked의 직접목적어인 명사절. 물어본 시점보다 앞선 경험이라 과거완료를 썼다.", "g"], ["the time I had used Ethan’s name", "관계부사 when 생략", "the time (when) I had used ~. '내가 Ethan의 이름을 썼던 때'. 아이들이 가장 즐거웠다고 꼽은 것이 이 경험이다.", "g"]]}], [{"en": "Not only Ethan, but many of the other children, too, found that occasion meaningful and exciting.", "key": 1, "g": [["Not only Ethan, but many of the other children", "not only A but (also) B", "'A뿐만 아니라 B도'. 이름이 불린 아이만이 아니라 듣던 아이들도 좋아했다는 점이 이 방법의 힘이다.", "g"], ["found that occasion meaningful and exciting", "find + O + 형용사 보어", "5형식. '그때를 의미 있고 신난다고 여겼다'. that occasion은 Ethan의 이름을 쓴 때다.", "g"]]}, {"en": "You might pick a child who you feel could do with feeling special that day and use their name.", "key": 1, "g": [["who you feel could do with", "삽입절이 든 관계사절", "you feel이 삽입절이다. who가 could do with의 주어이므로 whom이 아니라 who를 쓴다. could do with는 '~을 필요로 하다'.", "g"], ["feeling special", "제목의 열쇠", "'특별하게 느끼는 것'. 제목 ②의 Make Her Feel Special이 여기서 나온다.", "v"]]}, {"en": "Alternatively, if you are struggling to build a positive relationship with a particular child, choose them.", "g": [["Alternatively", "대안의 연결어", "'또는, 그 대신에'. 이름을 넣어 줄 아이를 고르는 두 번째 기준을 제시한다.", "v"], ["struggling to build", "struggle to-v", "'~하려고 애쓰다'. 관계가 잘 안 풀리는 아이일수록 이름을 넣어 주라는 조언이다.", "g"]]}, {"en": "It will help to assure the child that you notice and think about them.", "g": [["assure the child that", "assure + O + that절", "'O에게 ~라고 확신시키다'. 이 방법의 효과: 아이가 자신이 관심받고 있음을 알게 된다.", "g"]]}]], "choices": [["A Personalized Book Inspires Children’s Imagination", false, "책이 아니라 구연하는 이야기이고, 상상력이 아니라 '특별한 관심'을 느끼게 하는 것이 목적이다."], ["Add a Child’s Name in a Story and Make Her Feel Special", true, "정답. 아이의 이름을 이야기에 끼워 넣어 특별한 관심을 보이고, 특별함을 느낄 필요가 있는 아이를 고르라는 글의 요지 그대로다."], ["Putting a Child Into a Story Helps Her Remember the Story", false, "아이들이 그 시간을 즐거워했다는 것이지, 이야기를 더 잘 기억했다는 내용은 없다."], ["Let Children Pick Their Favorite Stories for Themselves", false, "이야기를 고르는 것은 교사다. 아이는 이름을 빌려줄 뿐이다."], ["Classroom Tales: Using Storytelling to Develop Social Skills", false, "사교 기술의 발달은 언급되지 않는다. 교사와 아이 사이의 관계와 관심이 초점이다."]], "flow": ["주제 — 아이에게 특별한 관심을 보이는 한 방법: 이야기 속에 아이를 넣는다", "방법 — 이름을 '빌려' 자원자를 받고, 적절한 곳에 그 이름을 끼워 넣어 들려준다", "경험 — 일 년 뒤 아이들은 Ethan의 이름을 쓴 때를 가장 즐거웠던 순간으로 꼽았다 (Ethan만이 아니라 다른 아이들도)", "조언 — 그날 특별함이 필요한 아이, 또는 관계 맺기가 힘든 아이의 이름을 쓰라", "효과 — 아이는 자신이 관심받고 있음을 확신하게 된다"], "bg": "교실에서 아이의 이름을 불러 주는 것은 가장 값싸고 강력한 관심 표현이다. 이야기 속 주인공 자리에 자기 이름이 들어가면 아이는 이야기의 관찰자에서 참여자가 되고, 듣는 아이들도 친구가 등장하는 이야기에 몰입한다. 필자가 '관계 맺기가 힘든 아이'를 고르라고 조언하는 대목은 문제 행동을 보이는 학생일수록 긍정적 관심이 필요하다는 생활지도의 원칙과 통한다.", "quiz": [{"q": "아이들이 일 년간의 이야기 활동 중 가장 즐거웠다고 꼽은 것은?", "opts": ["새 그림책을 읽은 날", "Ethan의 이름을 넣어 이야기를 들려준 때", "직접 이야기를 지어낸 날"], "a": 1, "exp": "many of them chose the time I had used Ethan’s name to tell a story."}, {"q": "필자가 이름을 넣어 줄 아이로 고르라고 제안한 경우가 아닌 것은?", "opts": ["그날 특별함을 느낄 필요가 있는 아이", "긍정적 관계를 맺기 힘든 아이", "이야기를 가장 잘 기억하는 아이"], "a": 2, "exp": "a child who you feel could do with feeling special that day / if you are struggling to build a positive relationship with a particular child, choose them."}]}, {"no": 3702, "dn": "2", "label": "DAY 37 · 2번", "type": "밑줄 함의", "answer": 5, "q": "밑줄 친 are 90 percent chimp and 10 percent bee가 다음 글에서 의미하는 바로 가장 적절한 것은?", "subject": "팀 스포츠의 역설: 침팬지와 벌", "vocab": [["accompany", "함께 가다, 동행하다", 1, "🚶", "My father was a basketball coach, so as a kid I accompanied him to practice every day.", "v"], ["paradox", "역설", 6, "🔄", "… I learned very early about the paradox of team sports …", "n"], ["collective", "집단의, 단체의", 7, "👥", "… the tension between individual and collective competition.", "a"], ["fiercely", "맹렬하게, 사납게", 9, "🔥", "… just as chimps fight fiercely to have a bigger share of food.", "ad"], ["put A aside", "A를 제쳐두다", 11, "🧹", "… teammates were required to put all of their individual rivalries aside …", "phr"], ["cohesive", "화합하는, 결합하는", 13, "🧲", "We came together as a cohesive unit for the higher purpose of defeating the opposing foe.", "a"], ["pull A off", "A를 해내다", 15, "🏆", "… humans possess the equipment to pull this off under the right conditions.", "phr"]], "pages": [[{"en": "My father was a basketball coach, so as a kid I accompanied him to practice every day.", "g": [["as a kid", "전치사 as", "'아이였을 때'. 여기서 as는 '~로서, ~일 때'의 전치사다.", "v"]]}, {"en": "As I grew older, I was at the gym or on the sports field from dawn to dusk.", "g": [["As I grew older", "접속사 as(~함에 따라)", "'나이가 들면서'. 앞 문장의 전치사 as와 다르게 여기서는 절을 이끄는 접속사다.", "g"]]}, {"en": "This investment of time and energy eventually led to a basketball scholarship at a university in southern Ohio.", "g": [["led to", "lead to(~로 이어지다)", "'결국 ~라는 결과를 낳았다'. 도입부(개인사)가 여기서 마무리되고 다음 문장부터 본론이다.", "v"]]}, {"en": "As a basketball player, I learned very early about the paradox of team sports — the tension between individual and collective competition.", "key": 1, "g": [["the paradox of team sports", "글의 열쇠말", "'팀 스포츠의 역설'. 대시 뒤에서 개인 경쟁 vs 집단 경쟁의 긴장이라고 풀어 준다. 밑줄의 chimp(개인)와 bee(집단)가 이 두 축이다.", "v"], ["between individual and collective competition", "between A and B", "individual과 collective가 모두 competition을 수식한다. '개인 경쟁과 집단 경쟁 사이'.", "g"]]}, {"en": "During practice, athletes competed with fellow teammates for playing time, just as chimps fight fiercely to have a bigger share of food.", "key": 1, "g": [["just as chimps fight fiercely", "just as(~와 꼭 마찬가지로) — 침팬지의 뜻", "연습 때 동료와 출전 시간을 다투는 모습 = 먹이를 두고 싸우는 침팬지. 즉 chimp는 '이기적으로 자기 몫을 다투는 성향'이다.", "v"], ["to have a bigger share of food", "목적의 to부정사", "'더 큰 몫의 먹이를 가지려고'. 자기 이익을 위한 경쟁이다.", "g"]]}], [{"en": "When game day rolled around, however, teammates were required to put all of their individual rivalries aside and became like bees working for the sake of the hive.", "key": 1, "g": [["however", "대조의 전환", "연습(침팬지) vs 경기일(벌). 밑줄의 두 비유가 여기서 갈린다.", "v"], ["were required to put all of their individual rivalries aside", "be required to-v + put A aside", "'A를 제쳐두도록 요구받았다'. 개인 경쟁심을 내려놓는 것이 벌의 조건이다.", "g"], ["like bees working for the sake of the hive", "벌의 뜻", "'벌집을 위해 일하는 벌처럼'. working은 bees를 수식하는 현재분사. bee는 '집단을 위해 협동하는 성향'이다.", "v"]]}, {"en": "We came together as a cohesive unit for the higher purpose of defeating the opposing foe.", "g": [["for the higher purpose of defeating", "동격의 of", "'~을 이긴다는 더 높은 목적을 위해'. of 뒤의 동명사가 purpose의 내용을 설명한다.", "g"]]}, {"en": "While this is difficult to accomplish, humans possess the equipment to pull this off under the right conditions.", "g": [["this is difficult to accomplish", "난이 형용사 + to부정사", "this가 to accomplish의 의미상 목적어다. this = 개인 경쟁심을 내려놓고 하나가 되는 것.", "g"], ["the equipment to pull this off", "to부정사의 형용사적 용법", "equipment는 여기서 '장비'가 아니라 '능력'. pull off는 '해내다'.", "v"]]}, {"en": "We can do this because we are by nature ‘homo duplex.’", "key": 1, "g": [["‘homo duplex.’", "밑줄의 근거", "'이중의 인간'. 인간에게는 두 층위가 있다는 뜻으로, 그 두 층위가 다음 문장의 침팬지(90%)와 벌(10%)이다.", "v"]]}, {"en": "As Jonathan Haidt puts it, we are 90 percent chimp and 10 percent bee.", "key": 1, "g": [["As Jonathan Haidt puts it", "as ~ puts it", "'~가 표현하듯이'. put은 여기서 '말하다, 표현하다'.", "v"], ["90 percent chimp and 10 percent bee", "밑줄의 함의", "침팬지 = 자기 몫을 다투는 이기적 성향(대부분), 벌 = 집단을 위해 협동하는 성향(적절한 조건에서). 그래서 '주로 이기적이지만 협동할 줄 아는 존재'다.", "v"]]}]], "choices": [["are inherently social, but sometimes enjoy being alone", false, "혼자 있기를 즐긴다는 내용은 없다. 침팬지의 비유는 '고독'이 아니라 '자기 몫을 위한 경쟁'이다."], ["are fundamentally greedy, yet benevolent to our families", false, "탐욕스럽다는 앞부분은 비슷하지만, 협동의 대상은 가족이 아니라 팀(벌집)이다."], ["are excellent in reasoning, but often make errors of judgment", false, "추론 능력이나 판단 오류는 글과 무관하다."], ["are aggressive in nature, yet try to be friendly to others", false, "벌의 비유는 '친절'이 아니라 '집단을 위한 협동'이다. 상대 팀에게는 오히려 적(foe)으로 맞선다."], ["are primarily self-serving, yet cooperative creatures", true, "정답. 침팬지처럼 자기 몫을 위해 다투는 것이 대부분(90%)이지만, 벌처럼 집단을 위해 협동하는 성향(10%)도 지녔다."]], "flow": ["도입 — 농구 감독의 아들로 자라 대학 농구 장학금까지 받았다", "역설 — 팀 스포츠에는 개인 경쟁과 집단 경쟁 사이의 긴장이 있다", "침팬지 — 연습 때는 출전 시간을 두고 동료와 맹렬히 경쟁한다 (먹이를 다투는 침팬지처럼)", "벌 — 경기일에는 개인 경쟁심을 내려놓고 벌집을 위한 벌처럼 하나가 된다", "결론 — 인간은 '이중의 인간'이라 이것이 가능하다: 90% 침팬지, 10% 벌"], "bg": "조나단 하이트는 『바른 마음(The Righteous Mind)』에서 인간을 '90퍼센트 침팬지, 10퍼센트 벌'이라고 표현했다. 대부분의 시간은 침팬지처럼 자기 이익과 평판을 좇지만, 특정 조건(공동의 적, 의식, 팀)에서는 '벌집 스위치'가 켜져 자아를 잊고 집단에 헌신한다는 것이다. homo duplex(이중의 인간)는 사회학자 뒤르켐이 쓴 말이다. 함의 문제에서는 두 비유가 본문 어디에 각각 대응하는지를 찾으면 된다.", "quiz": [{"q": "글에서 '침팬지'의 비유가 가리키는 상황은?", "opts": ["경기일에 팀이 하나로 뭉치는 것", "연습 때 출전 시간을 두고 동료와 경쟁하는 것", "상대 팀을 응원하는 것"], "a": 1, "exp": "athletes competed with fellow teammates for playing time, just as chimps fight fiercely to have a bigger share of food."}, {"q": "팀원들이 '벌'처럼 되기 위해 요구받은 것은?", "opts": ["더 열심히 연습하는 것", "개인적 경쟁의식을 제쳐두는 것", "감독의 말에 복종하는 것"], "a": 1, "exp": "teammates were required to put all of their individual rivalries aside and became like bees working for the sake of the hive."}]}, {"no": 3703, "dn": "3", "label": "DAY 37 · 3번", "type": "빈칸 추론", "answer": 3, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "▢ when people come along who see how to connect the dots, apply multiple perspectives, and build a bridge between unrelated ideas.", "subject": "창의성은 남이 못 보는 것을 보는 것", "vocab": [["ordinary", "평범한", 5, "🪨", "Changing the game starts with seeing the unseen within even the ordinary.", "a"], ["carve", "조각하다", 7, "🗿", "Out of a plain slab of marble, Michelangelo carved his best work.", "v"], ["target", "과녁, 표적", 8, "🎯", "“Talent hits a target no one else can hit. Genius hits a target no one else can see.”", "n"], ["breakthrough", "획기적인 진전", 10, "💡", "Creative solutions and breakthroughs come from viewing something differently …", "n"], ["novel", "참신한", 12, "🆕", "Patents for novel ideas, processes, and methodologies …", "a"], ["come along", "나타나다", 15, "🚪", "… when people come along who see how to connect the dots …", "phr"], ["perspective", "관점", 16, "🔭", "… apply multiple perspectives, and build a bridge between unrelated ideas.", "n"]], "pages": [[{"en": "Creativity is about “connecting the dots” — making connections between things that have never before been linked.", "key": 1, "g": [["“connecting the dots”", "글의 열쇠말", "'점들을 연결하기'. 빈칸 문장의 connect the dots가 이 말을 그대로 받는다.", "v"], ["that have never before been linked", "주격 관계대명사 + 현재완료 수동", "things를 수식한다. '전에 한 번도 연결된 적 없는'. 새로움이 창의성의 조건이다.", "g"]]}, {"en": "It is the ability to recognize the possibilities that exist within any scenario and the opportunities in every situation.", "g": [["the ability to recognize", "to부정사의 형용사적 용법", "'~을 알아보는 능력'. recognize의 목적어는 the possibilities와 the opportunities 둘이다.", "g"]]}, {"en": "Changing the game starts with seeing the unseen within even the ordinary.", "key": 1, "g": [["Changing the game", "동명사 주어 — 빈칸의 힌트", "'판을 바꾸는 것'. 빈칸의 Paradigms shift(사고의 틀이 바뀐다)와 같은 말이다.", "v"], ["seeing the unseen within even the ordinary", "the + 과거분사 = 명사", "the unseen은 '보이지 않는 것', the ordinary는 '평범한 것'. 남이 못 보는 것을 본다는 글의 반복 주제다.", "g"]]}, {"en": "Out of a plain slab of marble, Michelangelo carved his best work.", "g": [["Out of a plain slab of marble", "예 1 — 부사구의 전치", "'평범한 대리석 판에서'. 강조를 위해 문장 앞으로 나왔다. 평범한 것 속의 보이지 않는 것을 본 예다.", "v"]]}], [{"en": "German philosopher Arthur Schopenhauer once said, “Talent hits a target no one else can hit. Genius hits a target no one else can see.”", "g": [["a target no one else can see", "목적격 관계대명사 생략 — 예 2", "a target (that) no one else can see. 재능은 '맞히기'의 문제, 천재는 '보기'의 문제라는 대비다.", "g"]]}, {"en": "Creative solutions and breakthroughs come from viewing something differently and discovering what others have missed.", "key": 1, "g": [["come from viewing something differently and discovering", "동명사의 병렬", "from 뒤에 viewing과 discovering이 and로 연결된다. '다르게 보고, 남이 놓친 것을 발견하는 데서'.", "g"], ["what others have missed", "관계대명사 what", "'다른 사람들이 놓친 것'. discovering의 목적어다.", "g"]]}, {"en": "Patents for novel ideas, processes, and methodologies are simply the tangible results of someone seeing something differently than the world had ever seen it before.", "g": [["someone seeing something differently", "동명사의 의미상 주어", "someone이 seeing의 의미상 주어다. '누군가가 ~을 다르게 보는 것'.", "g"], ["than the world had ever seen it before", "과거완료", "특허가 나온 시점보다 앞선 '그 이전까지의 세상'을 가리키므로 과거완료다.", "g"]]}, {"en": "______ when people come along who see how to connect the dots, apply multiple perspectives, and build a bridge between unrelated ideas.", "key": 1, "g": [["______", "빈칸의 논리", "점을 잇고, 다르게 보고, 관련 없는 것에 다리를 놓는 사람이 나타나면 무슨 일이 생기는가? 앞의 Changing the game, breakthroughs가 답이다. '사고의 틀이 바뀐다(Paradigms shift)'.", "v"], ["people come along who see", "선행사와 떨어진 관계사절", "who절은 people을 수식하는데 동사 come along 뒤로 밀렸다. 주어가 짧고 관계사절이 길 때 흔한 구조다.", "g"], ["connect the dots, apply multiple perspectives, and build a bridge", "동사원형의 병렬", "how to 뒤에 세 개의 동사구가 연결된다. 첫 문장의 connecting the dots가 회수되며 글이 닫힌다.", "g"]]}]], "choices": [["Brains work", false, "'두뇌가 작동한다'는 너무 약하다. 글은 판을 바꾸는 획기적 변화를 말한다."], ["Analyses start", false, "분석의 시작은 글과 무관하다. 창의성은 분석보다 '다르게 보기'로 설명되었다."], ["Paradigms shift", true, "정답. 남이 못 보는 것을 보고 관련 없는 것을 잇는 사람이 나타나면 판이 바뀐다(Changing the game). 그것이 사고의 틀(paradigm)의 전환이다."], ["Persistence pays", false, "인내의 보상은 언급되지 않는다. 글의 열쇠는 노력의 양이 아니라 '보는 방식'이다."], ["Enthusiasm retreats", false, "열정이 물러난다는 부정적 결과는 글의 방향과 정반대다."]], "flow": ["정의 — 창의성은 '점 잇기': 연결된 적 없는 것들을 연결하는 것", "부연 — 어떤 상황에서든 가능성과 기회를 알아보는 능력. 판을 바꾸는 것은 평범한 것 속의 보이지 않는 것을 보는 데서 시작한다", "예 — 미켈란젤로는 평범한 대리석에서 걸작을 조각했다 / 쇼펜하우어: 천재는 아무도 못 보는 과녁을 맞힌다", "일반화 — 획기적 진전과 특허는 남과 다르게 보고 남이 놓친 것을 발견한 결과다", "결론(빈칸) — 점을 잇고 다리를 놓는 사람이 나타날 때 사고의 틀이 바뀐다"], "bg": "'패러다임 전환(paradigm shift)'은 과학사가 토머스 쿤이 『과학혁명의 구조』에서 쓴 말로, 한 시대의 사고 틀 자체가 바뀌는 것을 뜻한다. 미켈란젤로가 다른 조각가들이 버린 대리석에서 다비드상을 조각했다는 일화는 '평범한 것 속의 보이지 않는 것'의 대표적인 예로 자주 인용된다. 빈칸 문제에서는 마지막 문장이 첫 문장의 connecting the dots를 회수하는 수미상관 구조이므로, 글 앞부분의 Changing the game이 빈칸의 바꿔 말하기임을 알아채면 된다.", "quiz": [{"q": "글에서 말하는 창의성의 정의는?", "opts": ["새로운 도구를 발명하는 것", "연결된 적 없는 것들 사이에 관련성을 만드는 것", "남보다 열심히 노력하는 것"], "a": 1, "exp": "Creativity is about “connecting the dots” — making connections between things that have never before been linked."}, {"q": "쇼펜하우어의 말에서 '천재'와 '재능'의 차이는?", "opts": ["천재는 아무도 못 보는 과녁을 맞힌다", "천재는 더 많은 과녁을 맞힌다", "천재는 과녁 없이도 쏜다"], "a": 0, "exp": "Talent hits a target no one else can hit. Genius hits a target no one else can see."}]}, {"no": 3704, "dn": "4", "label": "DAY 37 · 4번", "type": "글의 순서", "answer": 2, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "subject": "코닥 카메라와 회화주의 사진의 흥망", "vocab": [["afford", "(~을 살) 여유가 있다", 2, "💵", "In 1890, Kodak introduced a cheap consumer camera that everyone could afford.", "v"], ["portrait", "인물 사진, 초상화", 2, "🖼️", "This put the portrait studios out of business …", "n"], ["out of business", "폐업한, 망한", 3, "🚪", "This put the portrait studios out of business …", "phr"], ["distinguish", "구별하다", 4, "🔍", "… needed a way to distinguish between what they did and this new popular photography.", "v"], ["collegial", "조합의; 대학의", 8, "🤝", "… collegial groups called “photo clubs,” a journal called Camera Work, and shows and openings.", "a"], ["marginalize", "무시하다; 하찮은 존재로 만들다", 14, "🚫", "However, art photography remained marginalized …", "v"], ["die out", "자취를 감추다, 사라지다", 17, "🕯️", "Pictorialism eventually died out with the outbreak of World War I.", "phr"]], "pages": [[{"label": "주어진 글", "en": "In 1890, Kodak introduced a cheap consumer camera that everyone could afford. This put the portrait studios out of business; the newly unemployed photographers needed a way to distinguish between what they did and this new popular photography.", "key": 1, "g": [["needed a way to distinguish", "순서의 열쇠", "사진사들에게 '구별할 방법이 필요했다'. 그 방법이 무엇이었는지, 즉 (B)의 the response가 바로 뒤에 와야 한다.", "v"], ["a cheap consumer camera that everyone could afford", "목적격 관계대명사", "that절이 camera를 수식한다. afford의 목적어가 that으로 빠져나갔다.", "g"], ["put the portrait studios out of business", "put A out of business", "'A를 폐업하게 하다'. 값싼 카메라가 전문 사진관을 몰아냈다.", "v"]]}], [{"label": "(B)", "en": "The movement of pictorialism was the response, with photographers attempting to imitate the artistic processes of painting; they worked directly on the negatives and other materials of the process.", "key": 1, "g": [["was the response", "순서의 열쇠", "'그 대응이었다'. 주어진 글의 needed a way에 대한 답이다. the가 붙은 것은 앞에 '필요'가 제시되었기 때문이다.", "v"], ["with photographers attempting to imitate", "with + O + v-ing", "'사진사들이 ~을 모방하려 하면서'. 부대 상황의 with 분사구문이다.", "g"], ["they worked directly on the negatives", "(A)를 부르는 장치", "원판에 직접 손을 대 회화처럼 만든 '작품(works)'이 (A)에서 미술관에 걸린다.", "v"]]}], [{"label": "(A)", "en": "They presented their works in art galleries, next to paintings. The elements of an art world began to form: collegial groups called “photo clubs,” a journal called Camera Work, and shows and openings.", "g": [["They presented their works", "순서의 열쇠", "They = (B)의 photographers, their works = (B)에서 원판에 직접 작업한 결과물. 회화 옆에 전시했다는 것은 (B)의 '회화 모방'의 연장이다.", "v"], ["began to form:", "콜론의 나열", "콜론 뒤에 예술계의 구성 요소 세 가지(클럽, 잡지, 전시회)가 나열된다.", "g"], ["collegial groups called “photo clubs,”", "과거분사구", "'사진 클럽이라 불리는 조합 단체'. called가 groups를 수식한다. 뒤의 a journal called Camera Work도 같은 구조다.", "g"]]}], [{"label": "(C)", "en": "However, art photography remained marginalized; there were no markets, buyers, or collectors, and museums were not interested in adding photos to their collections. Pictorialism eventually died out with the outbreak of World War I.", "key": 1, "g": [["However, art photography", "순서의 열쇠", "(A)에서 예술계의 모양새를 갖추기 시작했다 → 그러나(However) 여전히 변방이었다. 성과 뒤의 반전이므로 (A) 다음이다.", "v"], ["remained marginalized", "remain + 과거분사", "'~한 상태로 남아 있었다'. remain은 2형식 동사로 뒤에 보어가 온다.", "g"], ["eventually died out", "결말", "'결국 사라졌다'. 운동의 시작(B) → 전개(A) → 소멸(C)이라는 시간 순서로 글이 닫힌다.", "v"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)의 They와 their works가 가리킬 사진사들의 '작업'이 아직 나오지 않았다."], ["(B) – (A) – (C)", true, "정답. 구별할 방법이 필요했다 → (B) 그 대응이 회화주의 운동: 원판에 직접 작업 → (A) 그 작품을 미술관에 걸고 클럽·잡지·전시회가 생겼다 → (C) 그러나 여전히 무시당했고 1차 대전과 함께 사라졌다."], ["(B) – (C) – (A)", false, "(C)는 '그러나 여전히 무시되었다'는 반전이다. (A)의 성과(전시, 클럽, 잡지)가 먼저 나와야 However가 성립한다."], ["(C) – (A) – (B)", false, "(C)의 However와 art photography는 앞에 예술 사진의 시도가 있어야 한다. 주어진 글에는 아직 없다."], ["(C) – (B) – (A)", false, "같은 이유로 (C)가 주어진 글 바로 뒤에 올 수 없다. 운동의 소멸이 시작보다 먼저 올 수도 없다."]], "flow": ["주어진 글 — 1890년 코닥의 값싼 카메라로 사진관이 망하고, 실직한 사진사들은 자신들의 사진을 구별할 방법이 필요했다", "(B) the response — 회화주의(pictorialism) 운동: 회화의 과정을 모방해 원판에 직접 작업했다", "(A) They — 그 작품을 미술관에 회화 옆에 걸었고, 사진 클럽·잡지 Camera Work·전시회가 생겼다", "(C) However — 그러나 시장도 수집가도 미술관의 관심도 없었고, 1차 대전과 함께 사라졌다"], "bg": "1888년 코닥은 '버튼만 누르세요, 나머지는 우리가 합니다'라는 광고로 아마추어 사진 시대를 열었다. 전문 사진사들은 자신들의 사진이 '예술'임을 보이려고 회화처럼 흐릿하고 회화적인 회화주의(pictorialism) 사진을 추구했고, 앨프리드 스티글리츠가 창간한 잡지 Camera Work가 그 중심이었다. 순서 문제로는 needed a way → the response, photographers → They, 시도 → However 실패라는 세 연결 고리를 잡으면 된다.", "quiz": [{"q": "실직한 사진사들이 취한 대응은?", "opts": ["코닥 카메라를 판매하는 것", "회화의 예술적 과정을 모방하는 회화주의 운동", "사진관을 더 싸게 여는 것"], "a": 1, "exp": "The movement of pictorialism was the response, with photographers attempting to imitate the artistic processes of painting."}, {"q": "회화주의가 결국 사라진 시점은?", "opts": ["코닥 카메라 출시 직후", "제1차 세계 대전의 발발과 함께", "Camera Work 창간 때"], "a": 1, "exp": "Pictorialism eventually died out with the outbreak of World War I."}]}, {"no": 3705, "dn": "5", "label": "DAY 37 · 5번", "type": "문장 넣기", "answer": 4, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "They’d be ready, they’d know where to look and what to look for, and they’d see what you wanted them to see.", "subject": "독자에게 미리 알려 주는 글쓰기", "vocab": [["interstate", "주(州)간 고속도로", 1, "🛣️", "Say you’re driving down the interstate at sixty-five miles an hour with three friends from out of town …", "n"], ["elbow", "팔꿈치", 5, "💪", "… and someone’s elbow ends up in someone else’s ribs …", "n"], ["rib", "갈비뼈", 5, "🦴", "… someone’s elbow ends up in someone else’s ribs …", "n"], ["get a glimpse", "언뜻 보다", 6, "👀", "… maybe one of your friends gets a glimpse, but probably nobody really gets a chance to see it …", "phr"], ["advise", "조언하다, 알려 주다", 12, "🗣️", "Writers need to advise their readers in a similar way.", "v"], ["thesis statement", "주제 서술문, 주제문", 13, "📌", "That advice doesn’t always need to be in a thesis statement or a topic sentence …", "n"], ["crucial", "중대한, 결정적인", 15, "❗", "… so that readers don’t miss something crucial.", "a"]], "pages": [[{"en": "Say you’re driving down the interstate at sixty-five miles an hour with three friends from out of town, and you suddenly say to them, “Hey, there’s that amazing Pink House!”", "g": [["Say you’re driving", "가정의 Say", "'~라고 하자, 가령 ~라고 치자'. Suppose와 같은 뜻으로 상황을 설정한다.", "v"], ["you suddenly say to them", "실패 상황의 열쇠", "'갑자기' 말한다. 미리 알려 주지 않은 것이 문제의 원인이다.", "v"]]}, {"en": "( ① ) What happens?", "g": [["( ① )", "①의 판단", "넣을 수 없다. 갑자기 말한 뒤 '무슨 일이 일어날까?'라고 묻는 흐름이다. 주어진 문장의 '준비가 되어 있을 것'은 갑작스러운 상황과 맞지 않는다.", "v"]]}, {"en": "( ② ) Probably there’s a lot of sudden head turning, and someone’s elbow ends up in someone else’s ribs, and maybe one of your friends gets a glimpse, but probably nobody really gets a chance to see it (and somebody might not believe you if she didn’t see it for herself!).", "key": 1, "g": [["( ② )", "②의 판단", "넣을 수 없다. 질문의 답(우왕좌왕하다 아무도 못 본다)이 바로 이어져야 한다. 주어진 문장은 성공한 결과이므로 여기 올 수 없다.", "v"], ["nobody really gets a chance to see it", "실패의 결과", "'아무도 볼 기회를 얻지 못한다'. 주어진 문장의 they’d see what you wanted them to see와 정반대의 결과다.", "v"], ["might not believe you if she didn’t see it", "가정법 과거", "'직접 보지 못한다면 믿지 않을지도 모른다'. 「S + might + 동사원형, if + S + 과거동사」.", "g"]]}], [{"en": "( ③ ) What if you had said instead, “Hey, coming up on the right here in about two miles, there’s an amazing huge neon Pink House: watch for it?”", "key": 1, "g": [["( ③ )", "③의 판단", "넣을 수 없다. 이 문장이 '대안'을 제시하는 질문이고, 주어진 문장은 그 대안의 결과다. 결과가 대안보다 먼저 올 수 없다.", "v"], ["What if you had said instead", "가정법 과거완료 + instead", "'대신 ~라고 말했더라면 어땠을까?' 과거 사실의 반대. instead가 앞의 실패 상황과 대비되는 대안임을 알린다.", "g"], ["in about two miles", "미리 알려 주기의 핵심", "'2마일쯤 앞에, 오른쪽에'. 어디를 언제 봐야 할지 미리 알려 준다. 주어진 문장의 know where to look이 이것을 받는다.", "v"]]}, {"en": "( ④ ) Writers need to advise their readers in a similar way.", "key": 1, "g": [["( ④ )", "④의 판단 — 정답", "앞의 대안(미리 알려 주기)의 결과, 즉 '준비가 되어 무엇을 볼지 알고 보게 된다'는 주어진 문장이 여기 들어가야 한다. 이 문장부터는 운전 비유를 떠나 글쓰기로 화제가 바뀌므로 주어진 문장은 반드시 그 전에 와야 한다.", "v"], ["in a similar way", "비유의 적용", "'비슷한 방식으로'. 운전 비유(미리 알려 주면 본다)를 글쓰기(미리 알려 주면 독자가 놓치지 않는다)로 옮긴다.", "v"]]}, {"en": "( ⑤ ) That advice doesn’t always need to be in a thesis statement or a topic sentence, but it does need to happen regularly so that readers don’t miss something crucial.", "g": [["( ⑤ )", "⑤의 판단", "넣을 수 없다. That advice가 앞 문장의 advise를 바로 받으며 글쓰기 이야기를 마무리한다. 운전 비유의 결과가 다시 끼어들 자리가 아니다.", "v"], ["doesn’t always need to be", "부분부정", "'항상 ~일 필요는 없다'. not always는 '항상 ~한 것은 아니다'.", "g"], ["it does need to happen regularly so that", "강조의 do + so that", "does는 need를 강조한다. so that은 '~하도록'. 독자가 중요한 것을 놓치지 않도록 자주 알려 주라는 결론이다.", "g"]]}]], "choices": [["( ① ) — What happens?", false, "갑자기 말한 직후 '무슨 일이 일어날까?'를 묻는 자리다. 준비된 반응은 갑작스러운 상황과 맞지 않는다.", "( ① ) What happens?"], ["( ② ) — Probably there’s a lot of sudden head turning, and someone’s elbow ends up in someone else’s ribs …", false, "질문의 답(우왕좌왕하다 아무도 못 본다)이 바로 이어져야 한다. 주어진 문장은 정반대의 성공한 결과다.", "( ② ) Probably there’s a lot of sudden head turning, and someone’s elbow ends up in someone else’s ribs, and maybe one of your friends gets a glimpse, but probably nobody really gets a chance to see it (and somebody might not believe you if she didn’t see it for herself!)."], ["( ③ ) — What if you had said instead, “Hey, coming up on the right here in about two miles, there’s an amazing huge neon Pink House: watch for it?”", false, "이 문장이 대안을 제시하는 질문이다. 주어진 문장은 그 대안의 결과이므로 뒤에 와야 한다.", "( ③ ) What if you had said instead, “Hey, coming up on the right here in about two miles, there’s an amazing huge neon Pink House: watch for it?”"], ["( ④ ) — Writers need to advise their readers in a similar way.", true, "정답. 앞에서 '미리 알려 줬다면?'이라는 대안을 제시했고, 주어진 문장이 그 결과(준비되어 제대로 본다)를 말한다. 이 문장부터는 글쓰기로 화제가 전환되므로 주어진 문장은 그 앞이어야 한다.", "( ④ ) Writers need to advise their readers in a similar way."], ["( ⑤ ) — That advice doesn’t always need to be in a thesis statement or a topic sentence, but it does need to happen regularly …", false, "That advice가 앞 문장의 advise를 받아 글쓰기 이야기를 마무리한다. 운전 비유의 결과가 들어갈 곳이 아니다.", "( ⑤ ) That advice doesn’t always need to be in a thesis statement or a topic sentence, but it does need to happen regularly so that readers don’t miss something crucial."]], "flow": ["상황 — 고속도로에서 친구들에게 '저기 Pink House!'라고 갑자기 외친다", "결과 — 고개 돌리고 팔꿈치 부딪히고, 결국 아무도 제대로 못 본다", "대안 — '2마일 앞 오른쪽에 거대한 네온 Pink House가 나올 거야, 잘 봐'라고 미리 말했다면?", "④ 주어진 문장 — 그들은 준비가 되어 어디를 볼지 알고, 보길 바라는 것을 본다", "적용 — 글쓴이도 독자에게 비슷하게 미리 알려 줘야 한다. 꼭 주제문일 필요는 없지만 자주 해야 독자가 중요한 것을 놓치지 않는다"], "bg": "글쓰기 지도서에서 '독자에게 신호 보내기(signposting)'라고 부르는 원칙이다. 주제문, 연결어, '다음 세 가지를 살펴보자' 같은 예고 문장은 모두 독자에게 어디를 봐야 할지 미리 알려 주는 장치다. 영어 지문의 첫 문장이나 However 같은 연결어를 먼저 찾으라고 가르치는 것도 필자가 남긴 신호를 읽으라는 뜻이다. 문장 넣기 문제에서는 비유(운전)에서 적용(글쓰기)으로 화제가 바뀌는 경계를 찾는 것이 핵심이다.", "quiz": [{"q": "갑자기 'Pink House!'라고 외쳤을 때의 결과는?", "opts": ["모두가 잘 봤다", "아무도 제대로 볼 기회를 얻지 못했다", "친구들이 차를 세웠다"], "a": 1, "exp": "probably nobody really gets a chance to see it."}, {"q": "글쓴이가 독자에게 주는 '조언'에 대해 필자가 말한 것은?", "opts": ["반드시 주제문 형태여야 한다", "꼭 주제문일 필요는 없지만 자주 해야 한다", "글의 마지막에 한 번만 하면 된다"], "a": 1, "exp": "That advice doesn’t always need to be in a thesis statement or a topic sentence, but it does need to happen regularly."}]}, {"no": 3801, "dn": "1", "label": "DAY 38 · 1번", "type": "글의 주제", "answer": 1, "q": "다음 글의 주제로 가장 적절한 것은?", "subject": "맛 인지에 영향을 주는 요인들", "vocab": [["perceive", "인지하다, 감지하다", 1, "👅", "Not everyone perceives the taste of apple pie the same way.", "v"], ["genetic variation", "유전적 차이", 2, "🧬", "There is considerable genetic variation among individuals in sensitivity to basic tastes.", "n"], ["sensitivity", "민감성", 3, "📡", "… considerable genetic variation among individuals in sensitivity to basic tastes.", "n"], ["taste bud", "(혀의) 미뢰, 맛봉오리", 6, "🌸", "Taste buds operate best at temperatures of around 30℃.", "n"], ["distinguish", "구별하다", 9, "🔍", "… it becomes harder to distinguish their tastes accurately.", "v"], ["preconceived", "미리 생각한, 선입견의", 12, "🧠", "Psychological factors, such as preconceived ideas based on appearance …", "a"], ["identify", "확인하다, 식별하다", 17, "🍒", "… if they are colored yellow, they become difficult to identify as cherry.", "v"]], "pages": [[{"en": "Not everyone perceives the taste of apple pie the same way.", "key": 1, "g": [["Not everyone perceives", "부분 부정", "not + everyone은 '모두가 ~하는 것은 아니다'라는 부분 부정이다. '아무도 ~하지 않는다'(no one)와 다르다. 이 글의 화제(맛 인지의 차이)를 던지는 도입 문장이다.", "g"]]}, {"en": "There is considerable genetic variation among individuals in sensitivity to basic tastes.", "g": [["There is considerable genetic variation", "There is + 단수 명사", "variation이 단수이므로 is를 썼다. 개인 '간'의 차이(유전)를 먼저 말하고, 다음 문장에서 개인 '내'의 차이로 넘어간다.", "g"]]}, {"en": "Tasting abilities may also vary within the individual, depending on a number of outside influences.", "key": 1, "g": [["depending on", "'~에 따라'", "분사구문에서 굳어진 표현으로 전치사처럼 쓰인다. 뒤에 나올 요인들(온도, 심리)을 예고하는 열쇠말이다.", "v"]]}, {"en": "One such factor affecting taste is the temperature of a food or beverage.", "g": [["One such factor affecting taste", "현재분사의 후치 수식", "affecting taste가 factor를 뒤에서 수식한다. '요인이 맛에 영향을 준다'는 능동 관계이므로 현재분사다. One such는 첫 번째 요인(온도)을 소개하는 신호다.", "g"]]}, {"en": "Taste buds operate best at temperatures of around 30℃.", "g": [["operate best at", "operate '작동하다'", "여기서 operate는 자동사 '작동하다'. best는 well의 최상급 부사다.", "v"]]}], [{"en": "As the temperature of foods or beverages goes below 20℃ or above 30℃, it becomes harder to distinguish their tastes accurately.", "g": [["As the temperature", "접속사 as '~함에 따라'", "as는 여기서 '~함에 따라, ~하면서'. 온도 변화와 구별 능력 저하가 함께 간다는 비례 관계다.", "v"], ["it becomes harder to distinguish", "가주어 it - 진주어 to-v", "it은 가주어, to distinguish 이하가 진주어다. '구별하는 것이 더 어려워진다'.", "g"]]}, {"en": "For example, very hot coffee tastes less bitter, whereas slightly melted ice cream tastes sweeter.", "g": [["whereas", "대조의 접속사", "'~인 반면에'. 뜨거운 커피(쓴맛 감소) vs 녹은 아이스크림(단맛 증가)을 맞세운다. while과 바꿔 쓸 수 있다.", "v"], ["tastes sweeter", "taste + 형용사", "taste는 2형식 감각동사로 뒤에 부사가 아닌 형용사(보어)가 온다. sweetly가 아니다.", "g"]]}, {"en": "Psychological factors, such as preconceived ideas based on appearance or on previous experiences with a similar food, also affect a person’s perception of taste.", "key": 1, "g": [["based on appearance or on previous experiences", "과거분사구 + 전치사구 병렬", "based on ~이 preconceived ideas를 수식한다. on appearance와 on previous experiences 두 전치사구가 or로 병렬되어 있다.", "g"], ["also affect", "주어 - 동사 일치", "주어는 멀리 앞의 복수 명사 Psychological factors이므로 affects가 아닌 affect. 긴 삽입구(such as ~)에 속지 말 것. also는 두 번째 요인(심리)을 추가하는 신호다.", "g"]]}, {"en": "For instance, cherry-flavored foods are expected to be red, but if they are colored yellow, they become difficult to identify as cherry.", "g": [["are expected to be red", "be expected to-v", "'~일 것으로 기대되다'. expect + O + to-v의 수동태다.", "g"], ["if they are colored yellow", "they의 지칭", "they는 cherry-flavored foods. 뒤의 they도 같은 대상(노랗게 색이 입혀진 체리 맛 음식)이다.", "v"]]}, {"en": "Also, unpleasant experiences associated with a food may influence the perceived taste of that food in the future.", "g": [["Also", "열거의 연결어", "세 번째 요인(과거의 불쾌한 경험)을 덧붙인다. 온도 → 선입견 → 불쾌한 경험, 이 셋이 주제 ①의 various factors다.", "v"], ["associated with a food", "과거분사구", "experiences를 수식한다. '음식과 연관된' 경험이므로 수동의 과거분사다.", "g"]]}]], "choices": [["various factors that affect the perception of tastes", true, "정답. 유전, 온도, 선입견, 과거 경험 등 맛 인지에 영향을 주는 여러 요인을 나열한 글이다."], ["reasons why taste buds are affected by temperature", false, "온도는 여러 요인 중 하나일 뿐이고, 미뢰가 온도에 영향받는 '이유'는 설명하지 않았다."], ["the necessity to stop using artificial coloring in foods", false, "노란 체리 맛 음식은 색이 인지에 영향을 준다는 예시일 뿐, 인공 색소를 금지하자는 주장은 없다."], ["the effect of climate on the development of preserved foods", false, "기후나 저장 식품은 전혀 언급되지 않았다."], ["the relationship between temperature and preference of tastes", false, "온도가 맛의 '구별'에 영향을 준다고 했을 뿐, 맛 '선호'와의 관계는 아니다. 게다가 온도는 요인 중 하나에 그친다."]], "flow": ["도입 — 모든 사람이 같은 맛을 같게 인지하지는 않는다", "요인 0 — 개인 간 유전적 차이가 있고, 개인 내에서도 외적 영향으로 달라진다", "요인 1 — 온도: 미뢰는 약 30℃에서 가장 잘 작동. 뜨거운 커피는 덜 쓰고, 녹은 아이스크림은 더 달다", "요인 2 — 심리적 선입견: 노란색 체리 맛 음식은 체리로 알아보기 어렵다", "요인 3 — 과거의 불쾌한 경험도 그 음식의 맛 인지에 영향을 준다"], "bg": "미뢰는 혀뿐 아니라 입천장과 목에도 분포하며, 단맛·짠맛·쓴맛·신맛·감칠맛의 다섯 가지 기본 맛을 감지한다. 아이스크림이 얼어 있을 때보다 녹았을 때 훨씬 달게 느껴지는 것은 이 글의 온도 효과 때문이고, 그래서 아이스크림 제조사는 실제로 설탕을 매우 많이 넣는다. 색이 맛 판단을 좌우한다는 실험은 식품 마케팅에서도 널리 활용된다.", "quiz": [{"q": "미뢰가 가장 잘 작동하는 온도는?", "opts": ["약 20℃", "약 30℃", "약 40℃"], "a": 1, "exp": "Taste buds operate best at temperatures of around 30℃."}, {"q": "체리 맛 음식을 노랗게 만들면 어떤 일이 일어나는가?", "opts": ["더 달게 느껴진다", "체리로 식별하기 어려워진다", "쓴맛이 덜 느껴진다"], "a": 1, "exp": "if they are colored yellow, they become difficult to identify as cherry — 외양에 기반한 선입견이 맛 인지에 영향을 준 예다."}]}, {"no": 3802, "dn": "2", "label": "DAY 38 · 2번", "type": "밑줄 어법", "answer": 4, "q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "subject": "자존감을 쌓는 방법", "vocab": [["self-esteem", "자존감", 1, "🪞", "Low self-esteem can make you feel as if you don’t deserve success.", "n"], ["deserve", "~할 자격[가치]이 있다", 1, "🏅", "… make you feel as if you don’t deserve success.", "v"], ["sabotage", "고의로 방해하다", 3, "🧨", "… you’ll sabotage yourself just because of the mistaken belief …", "v"], ["self-monitoring", "자기 점검", 5, "📋", "Building self-esteem starts with self-awareness and self-monitoring.", "n"], ["inner critic", "내면의 비평가", 5, "🗣️", "When you start monitoring your inner critic and replacing bad thoughts …", "n"], ["attribute", "자질, 속성", 8, "✨", "Making a list of positive attributes you believe you possess is another useful technique …", "n"], ["return the favor", "호의를 되돌려 주다", 15, "🤝", "When you treat other people well, they will return the favor …", "phr"]], "pages": [[{"en": "Low self-esteem can make you feel as if you don’t deserve success.", "g": [["make you feel as if", "make + O + 동사원형 / as if", "사역동사 make 뒤에는 to 없는 동사원형(feel)이 온다. as if는 '마치 ~인 것처럼'으로 뒤에 절이 이어진다.", "g"]]}, {"en": "Even if things are going well, you’ll sabotage yourself just ① because of the mistaken belief you don’t deserve to achieve your goal.", "g": [["① because of", "① 적절 — 전치사 because of", "뒤에 명사구 the mistaken belief가 오므로 전치사 because of가 맞다. 절이 왔다면 접속사 because를 써야 한다.", "g"], ["the mistaken belief you don’t deserve", "동격의 that 생략", "the mistaken belief (that) you don’t deserve ~. 명사 belief의 내용을 설명하는 동격절인데 that이 생략되었다.", "g"]]}, {"en": "Building self-esteem starts with self-awareness and self-monitoring.", "key": 1, "g": [["Building self-esteem starts", "동명사 주어 + 단수 동사", "동명사구 Building self-esteem이 주어이므로 단수 동사 starts. 뒤의 ③과 같은 원리다.", "g"]]}, {"en": "When you start monitoring your inner critic and replacing bad thoughts with positive ② ones, you’ll be on your way to killing your self-critical voice.", "g": [["monitoring your inner critic and replacing", "동명사의 병렬", "start의 목적어로 monitoring과 replacing 두 동명사가 and로 연결되었다. replace A with B는 'A를 B로 교체하다'.", "g"], ["② ones", "② 적절 — 대명사 ones", "앞의 복수 명사 thoughts를 받는 부정대명사다. 단수였다면 one. positive ones = positive thoughts.", "g"], ["on your way to killing", "on one's way to + 명사/v-ing", "'~하는 과정에 있다'. 이 to는 전치사이므로 뒤에 동명사 killing이 온다.", "v"]]}, {"en": "Making a list of positive attributes you believe you possess ③ is another useful technique to improve your self-esteem.", "key": 1, "g": [["you believe you possess", "목적격 관계대명사 생략", "positive attributes (which/that) you believe you possess. 관계사절 안에 you believe가 삽입된 형태다. possess의 목적어가 없다는 것이 관계절의 표시다.", "g"], ["③ is", "③ 적절 — 동명사 주어의 수 일치", "주어는 동명사구 Making a list ~ possess 전체다. 바로 앞의 복수 명사 attributes에 끌려 are로 고치면 틀린다. 동명사 주어는 단수 취급.", "g"]]}], [{"en": "The key is to be honest and write the list without any judgments.", "g": [["to be honest and write", "to부정사 보어의 병렬", "to be와 (to) write가 and로 연결된 보어다. 두 번째 to는 생략되었다.", "g"]]}, {"en": "Once it’s ready, re-read it every single day until you understand ④ what you’re not as worthless as you think.", "g": [["④ what", "④ 어법상 틀림 → that", "understand의 목적어인 명사절이 필요한데, 뒤의 you’re not as worthless as you think는 주어·동사·보어가 모두 갖춰진 완전한 절이다. 관계대명사 what은 뒤에 불완전한 절이 와야 하므로 틀렸고, 완전한 절을 이끄는 접속사 that으로 고쳐야 한다.", "g"], ["not as worthless as you think", "as ~ as 원급 비교", "'네가 생각하는 만큼 가치 없지는 않다'. not as ~ as는 '~만큼 ~하지 않다'.", "g"]]}, {"en": "Another useful method is to become kinder toward other people.", "key": 1, "g": [["Another useful method", "열거의 신호", "another useful technique(③ 문장)에 이어 세 번째 방법을 소개한다. 자기 점검 → 목록 작성 → 친절, 이 세 가지가 글의 뼈대다.", "v"]]}, {"en": "When you treat other people well, they will return the favor, thus ⑤ making you feel better about yourself.", "g": [["⑤ making", "⑤ 적절 — 결과의 분사구문", "they will return the favor라는 완전한 절 뒤에 콤마로 이어진 분사구문이다. '그래서 결과적으로 ~하게 만든다'. thus가 결과임을 분명히 한다. 접속사 없이 동사 makes를 쓰면 틀린다.", "g"], ["feel better about yourself", "make + O + 동사원형", "making you feel: 사역동사 make의 목적보어로 동사원형 feel이 왔다. 첫 문장의 make you feel과 같은 구조다.", "g"]]}]], "choices": [["because of", false, "뒤에 명사구 the mistaken belief가 오므로 전치사 because of가 맞다."], ["ones", false, "복수 명사 thoughts를 받는 대명사 ones로 적절하다."], ["is", false, "동명사구 Making ~ possess가 주어이므로 단수 동사 is가 맞다. 바로 앞의 attributes에 속지 말 것."], ["what", true, "정답. understand 뒤에 완전한 절(you’re not as worthless as you think)이 오므로 불완전한 절을 이끄는 what은 쓸 수 없다. 접속사 that으로 고쳐야 한다."], ["making", false, "완전한 절 뒤에 결과를 나타내는 분사구문으로 적절하다."]], "flow": ["문제 — 낮은 자존감은 성공할 자격이 없다고 느끼게 하고, 잘되고 있어도 스스로를 방해하게 한다", "방법 1 — 자기 인식과 자기 점검: 내면의 비평가를 감시하고 나쁜 생각을 긍정적 생각으로 바꾼다", "방법 2 — 자신의 긍정적 자질 목록을 정직하게 쓰고, 매일 다시 읽는다", "방법 3 — 타인에게 더 친절해진다 → 호의가 돌아와 자신에 대한 기분이 좋아진다"], "bg": "자존감이 낮은 사람이 성공을 앞두고 스스로 일을 망치는 행동을 심리학에서는 자기 방해(self-sabotage)라고 부른다. 글이 권하는 '내면의 비평가 감시'와 '생각 바꾸기'는 인지행동치료에서 부정적 자동 사고를 다루는 기본 기법과 같다. 어법 문제로는 명사절 접속사 that과 관계대명사 what의 구별, 동명사 주어의 수 일치가 출제 포인트다.", "quiz": [{"q": "자존감 향상을 위한 목록을 쓸 때 핵심은?", "opts": ["단점을 함께 적는 것", "정직하게, 어떤 판단도 없이 쓰는 것", "다른 사람에게 보여 주는 것"], "a": 1, "exp": "The key is to be honest and write the list without any judgments."}, {"q": "다른 사람에게 친절해지면 어떻게 되는가?", "opts": ["그들이 호의를 돌려주어 자신에 대한 기분이 좋아진다", "내면의 비평가가 사라진다", "목표를 더 빨리 달성한다"], "a": 0, "exp": "they will return the favor, thus making you feel better about yourself."}]}, {"no": 3803, "dn": "3", "label": "DAY 38 · 3번", "type": "빈칸 추론", "answer": 5, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "However, unless the classroom is organized in such a way as ▢, this will be problematic and the teacher may resort to public scolding.", "subject": "교사와 학생의 거리, 근접성의 힘", "vocab": [["barrier", "장벽", 2, "🚧", "… perceived or actual barriers can have a significant impact on communication.", "n"], ["ensconced", "편히 자리 잡은", 4, "🪑", "Teachers who stay securely ensconced behind the ‘barricade’ of their desk …", "a"], ["territorial", "특정 영역의, 영토의", 6, "🗺️", "… gives a territorial feel to the room.", "a"], ["proximity", "근접성", 7, "📏", "The use of proximity, on the other hand, can be a powerful behaviour management tool.", "n"], ["discreetly", "신중하게, 사려 깊게", 10, "🤫", "Firm reminders and warnings are best conducted privately and discreetly …", "ad"], ["tower over", "~ 위에 우뚝 서다", 14, "🗼", "… and not towering over him/her in a threatening way …", "phr"], ["resort to", "~에 의지하다", 19, "🆘", "… the teacher may resort to public scolding.", "phr"]], "pages": [[{"en": "The amount of distance between the teacher and his/her students and perceived or actual barriers can have a significant impact on communication.", "key": 1, "g": [["can have a significant impact on", "have an impact on", "'~에 영향을 미치다'. 주어는 The amount of distance와 barriers 두 개가 and로 묶인 것이다. 화제는 '거리와 장벽'이다.", "v"]]}, {"en": "Teachers who stay securely ensconced behind the ‘barricade’ of their desk automatically create a boundary that blocks effective interpersonal contact and gives a territorial feel to the room.", "g": [["who stay securely ensconced behind", "주격 관계대명사절", "Teachers를 수식한다. 주어 Teachers의 동사는 멀리 있는 create다. 책상 뒤에 앉아 있는 교사 = 거리를 두는 부정적 예.", "g"], ["that blocks effective interpersonal contact and gives", "관계사절 안의 동사 병렬", "that절이 a boundary를 수식하며, 그 안에서 blocks와 gives가 and로 병렬되었다. 선행사가 단수이므로 두 동사 모두 -s가 붙었다.", "g"]]}, {"en": "The use of proximity, on the other hand, can be a powerful behaviour management tool.", "key": 1, "g": [["The use of proximity", "글의 열쇠말", "'근접성의 이용'. 책상 뒤에 숨는 것과 반대로 학생에게 가까이 가는 것이다. 빈칸의 답(개별 학생에게 접근)이 여기서 예고된다.", "v"], ["on the other hand", "대조의 연결어", "'반면에'. 앞 문장(거리 두기 → 경계 생김)과 대조되는 긍정적 내용이 이어진다.", "v"]]}], [{"en": "Firm reminders and warnings are best conducted privately and discreetly (it reduces embarrassment or threat to the student and minimizes the spectator effect, both of which can fuel a challenge or counterattack).", "key": 1, "g": [["are best conducted privately and discreetly", "빈칸의 근거", "주의와 경고는 '사적으로, 신중하게' 하는 것이 최선이다. 그러려면 교사가 학생 개개인에게 다가갈 수 있어야 한다. 그렇지 못하면 공개 질책(public scolding)이 된다.", "v"], ["both of which", "전치사 + 관계대명사", "both of which = and both of them. 앞의 embarrassment or threat와 the spectator effect 둘을 받아 보충 설명한다.", "g"]]}, {"en": "Getting down to the student’s eye level (and not towering over him/her in a threatening way) models consideration and invites the student to respond in an equally respectful way.", "g": [["Getting down to the student’s eye level", "동명사 주어", "Getting ~ level이 주어이고 동사는 괄호 뒤의 models와 invites다. 동명사 주어이므로 단수 동사(-s).", "g"], ["invites the student to respond", "invite + O + to-v", "'O가 ~하도록 이끌다'. 배려를 보이면 학생도 공손하게 반응한다는 뜻이다.", "g"]]}, {"en": "However, unless the classroom is organized in such a way as ______, this will be problematic and the teacher may resort to public scolding.", "key": 1, "g": [["However, unless", "빈칸 문장의 조건", "unless = if ~ not. '교실이 ~한 방식으로 배열되어 있지 않다면' 문제가 생긴다. 즉 빈칸은 근접성을 쓸 수 있게 해 주는 조건이어야 한다.", "v"], ["in such a way as", "such ~ as to-v", "'~하는 그런 방식으로'. as 뒤에 to부정사가 와서 way의 내용을 설명한다. 선지가 모두 to-v인 이유다.", "g"], ["resort to public scolding", "빈칸의 반대 결과", "근접해서 사적으로 주의를 줄 수 없으면 공개 질책에 의지하게 된다. 따라서 빈칸은 '교사가 개별 학생에게 접근할 수 있게 하는'(⑤)이다.", "v"]]}]], "choices": [["to facilitate various types of group activities", false, "단체 활동은 언급되지 않았다. 글은 교사가 학생 개개인에게 가까이 가는 것을 다룬다."], ["to encourage children to work independently", false, "학생의 독립적 학습은 글의 관심사가 아니다. 교사-학생 간 거리와 근접성이 화제다."], ["to take advantage of a child’s innate curiosity", false, "호기심은 전혀 나오지 않는다."], ["to promote positive interactions between children", false, "학생 '사이의' 상호작용이 아니라 교사와 학생 '사이의' 접촉이 핵심이다."], ["to allow the teacher to access individual students", true, "정답. 주의와 경고는 사적으로 신중하게 해야 좋은데, 교사가 개별 학생에게 접근할 수 없는 교실 배치라면 공개 질책에 의지하게 된다."]], "flow": ["도입 — 교사와 학생 사이의 거리와 장벽은 의사소통에 큰 영향을 준다", "부정적 예 — 책상 뒤에 자리 잡은 교사는 접촉을 막는 경계를 만든다", "대조 — 반면 근접성의 이용은 강력한 행동 조절 도구다", "근거 — 주의와 경고는 사적·신중하게(부끄러움·구경꾼 효과 최소화), 눈높이 맞추기는 배려의 모범", "빈칸 — 교사가 개별 학생에게 접근할 수 있는 배치가 아니면 공개 질책에 의지하게 된다"], "bg": "교실 행동 관리에서 '근접성 통제(proximity control)'는 교사가 문제 행동을 보이는 학생 가까이로 조용히 이동하는 것만으로 행동을 바로잡는 기법을 말한다. 공개적으로 꾸짖으면 학생은 친구들 앞에서 체면을 지키려 반항하기 쉬운데, 이것이 글에서 말하는 구경꾼 효과다. 교사가 책상 사이를 자유롭게 다닐 수 있는 좌석 배치가 왜 중요한지를 설명하는 지문이다.", "quiz": [{"q": "책상 뒤에 자리 잡은 교사가 만드는 것은?", "opts": ["학생과의 신뢰", "접촉을 막고 영역 느낌을 주는 경계", "조용한 교실 분위기"], "a": 1, "exp": "automatically create a boundary that blocks effective interpersonal contact and gives a territorial feel to the room."}, {"q": "단호한 주의와 경고를 사적으로 하는 것이 좋은 이유는?", "opts": ["학생의 부끄러움과 위협을 줄이고 구경꾼 효과를 최소화하기 때문", "교사의 권위를 높이기 때문", "시간이 절약되기 때문"], "a": 0, "exp": "it reduces embarrassment or threat to the student and minimizes the spectator effect."}]}, {"no": 3804, "dn": "4", "label": "DAY 38 · 4번", "type": "무관한 문장", "answer": 3, "q": "다음 글에서 전체 흐름과 관계 없는 문장은?", "subject": "생산 방식이 낳은 문화별 세계관 차이", "vocab": [["worldview", "세계관", 1, "🌍", "Cultural differences in worldviews may reflect the adaptations …", "n"], ["adaptation", "적응 (방식)", 2, "🔧", "… may reflect the adaptations that different cultural groups develop …", "n"], ["contemporary", "현대의; 동시대의", 5, "🕰️", "… argued that contemporary differences in cultural worldviews stem from …", "a"], ["stem from", "~에서 기인하다", 6, "🌱", "… contemporary differences in cultural worldviews stem from the original differences in thought …", "phr"], ["prolonged", "장기적인, 오래 계속되는", 12, "⏳", "Disastrous climate change accompanying prolonged droughts has been considered …", "a"], ["ecology", "생태 환경, 생태학", 16, "🌿", "… research on Greek ecology suggests the Greek economy might have been largely based on hunting …", "n"], ["distinct", "분명히 다른, 독특한", 21, "🔀", "… based on their distinct mode of production …", "a"]], "pages": [[{"en": "Cultural differences in worldviews may reflect the adaptations that different cultural groups develop to handle the specific problems they face.", "key": 1, "g": [["the adaptations that different cultural groups develop", "목적격 관계대명사절", "that절이 the adaptations를 수식한다. develop의 목적어 자리가 비어 있다. 주제문: 세계관 차이 = 문제 해결을 위한 적응의 결과.", "g"], ["to handle the specific problems", "to부정사의 목적", "'특정 문제를 처리하기 위해'. 부사적 용법(목적)이다.", "g"]]}, {"en": "① The social psychologist Richard E. Nisbett and his colleagues argued that contemporary differences in cultural worldviews stem from the original differences in thought expressed by the ancient Greek and Chinese cultures.", "g": [["① The social psychologist", "① 흐름에 맞음", "주제문을 뒷받침하는 학자의 주장이다. 현대의 세계관 차이가 고대 그리스·중국의 사고 차이에서 왔다고 하며, 뒤에 두 문명을 차례로 설명할 것을 예고한다.", "v"], ["expressed by the ancient Greek and Chinese cultures", "과거분사구", "the original differences in thought를 수식한다. '고대 그리스와 중국 문화에 의해 표현된' 사고의 차이. 수동이므로 과거분사다.", "g"]]}, {"en": "② Ancient Chinese civilization was based on agriculture, which would promote visual emphasis on the greater context of nature and natural relationships (e.g., the entire field of crops, the climate, and predators).", "g": [["② Ancient Chinese civilization", "② 흐름에 맞음", "①에서 예고한 두 문명 중 중국을 설명한다. 농업 → 전체 맥락(밭·기후·약탈자)에 시각적 주의. 주제(생산 방식 → 세계관)에 딱 맞는다.", "v"], ["which would promote", "계속적 용법의 which", "콤마 뒤의 which는 앞 절 전체(중국 문명이 농업에 기반했다는 사실)를 받는다. would + 동사원형은 '~하곤 했다'는 과거의 습관·경향이다.", "g"]]}], [{"en": "③ Disastrous climate change accompanying prolonged droughts has been considered to have played a key role in the collapse of human societies and ancient civilizations based on farming.", "g": [["③ Disastrous climate change", "③ 정답 — 흐름과 무관", "'농업'이라는 단어로 앞 문장과 이어지는 척하지만, 내용은 기후 변화가 농업 문명을 붕괴시켰다는 것이다. 생산 방식이 세계관(시각적 주의)을 형성했다는 글의 논지와 전혀 관계가 없다.", "v"], ["has been considered to have played", "완료 수동 + 완료부정사", "'~한 것으로 여겨져 왔다'. to have played는 본동사(여겨지는 시점)보다 앞서 일어난 일을 나타내는 완료부정사다.", "g"]]}, {"en": "④ On the other hand, research on Greek ecology suggests the Greek economy might have been largely based on hunting, fishing, and trading, which would have encouraged visual importance of the objects being hunted or traded.", "g": [["④ On the other hand", "④ 흐름에 맞음", "중국(②)과 대조되는 그리스를 설명한다. 사냥·어업·상거래 → 개별 대상에 시각적 주의. ②와 짝을 이루는 문장이므로 ③이 그 사이에 끼어 있으면 어색하다.", "v"], ["might have been largely based on", "might have p.p.", "'~였을 수도 있다'. 과거 사실에 대한 불확실한 추측이다. suggests 뒤에는 접속사 that이 생략되었다.", "g"], ["being hunted or traded", "현재분사구(수동 진행)", "the objects를 수식한다. 대상이 '사냥되거나 거래되는' 것이므로 being + p.p.의 수동형이다.", "g"]]}, {"en": "⑤ The need to visually attune to particular aspects of the environment, based on their distinct mode of production, may have influenced each culture’s social organization of the world.", "key": 1, "g": [["⑤ The need to visually attune", "⑤ 흐름에 맞음 — 결론", "②와 ④를 종합한다. 생산 방식이 다르니 환경의 어디에 시각적으로 적응할지가 달랐고, 그것이 각 문화의 세계 인식을 만들었다는 결론이다.", "v"], ["may have influenced", "may have p.p.", "'영향을 미쳤을 수도 있다'. 과거에 대한 추측. 첫 문장의 may reflect와 호응하며 조심스러운 어조로 글을 닫는다.", "g"]]}]], "choices": [["The social psychologist Richard E. Nisbett and his colleagues argued that contemporary differences in cultural worldviews stem from the original differences in thought expressed by the ancient Greek and Chinese cultures.", false, "주제문을 뒷받침하는 학자의 주장으로, 뒤에 이어질 그리스·중국 비교를 예고한다."], ["Ancient Chinese civilization was based on agriculture, which would promote visual emphasis on the greater context of nature and natural relationships (e.g., the entire field of crops, the climate, and predators).", false, "중국 = 농업 → 전체 맥락에 대한 시각적 강조. 생산 방식과 세계관을 연결하는 핵심 예다."], ["Disastrous climate change accompanying prolonged droughts has been considered to have played a key role in the collapse of human societies and ancient civilizations based on farming.", true, "정답. 기후 변화가 농업 문명을 붕괴시켰다는 내용은 '생산 방식이 세계관을 형성했다'는 논지와 무관하다. farming이라는 단어만 앞 문장과 겹친다."], ["On the other hand, research on Greek ecology suggests the Greek economy might have been largely based on hunting, fishing, and trading, which would have encouraged visual importance of the objects being hunted or traded.", false, "그리스 = 사냥·어업·상거래 → 개별 대상에 대한 시각적 중요성. ②와 대조를 이루는 짝 문장이다."], ["The need to visually attune to particular aspects of the environment, based on their distinct mode of production, may have influenced each culture’s social organization of the world.", false, "생산 방식 → 시각적 적응 → 세계관, 두 예를 종합하는 결론이다."]], "flow": ["주제 — 문화별 세계관 차이는 각 집단이 문제를 해결하려 발전시킨 적응 방식을 반영한다", "주장 — Nisbett: 현대의 세계관 차이는 고대 그리스·중국의 사고 차이에서 왔다", "예 1 — 고대 중국: 농업 → 자연 전체 맥락(밭, 기후, 약탈자)에 시각적 강조", "③ 무관 — 기후 변화가 농업 문명을 붕괴시켰다는 내용은 논지와 관계없다", "예 2·결론 — 고대 그리스: 사냥·어업·상거래 → 개별 대상에 주목. 생산 방식이 세계 인식을 형성했다"], "bg": "리처드 니스벳은 『생각의 지도』에서 동양인은 배경과 관계를 전체적으로 보고 서양인은 개별 대상에 초점을 맞춘다는 문화심리학 연구를 소개했다. 그는 이 차이의 뿌리를 고대 중국의 농경 사회와 고대 그리스의 상업·해양 사회에서 찾는다. 무관한 문장 문제에서는 ③처럼 앞 문장의 핵심어(farming)를 그대로 가져와 이어지는 척하는 문장을 주의해야 한다.", "quiz": [{"q": "고대 중국 문명이 시각적으로 강조하게 된 것은?", "opts": ["사냥되는 개별 대상", "자연과 자연 관계라는 더 큰 맥락", "도시의 건축물"], "a": 1, "exp": "Ancient Chinese civilization was based on agriculture, which would promote visual emphasis on the greater context of nature and natural relationships."}, {"q": "연구에 따르면 고대 그리스 경제의 기반은?", "opts": ["농업", "사냥, 어업, 상거래", "광업"], "a": 1, "exp": "the Greek economy might have been largely based on hunting, fishing, and trading."}]}, {"no": 3805, "dn": "5", "label": "DAY 38 · 5번", "type": "요약문 완성", "answer": 5, "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "summary": "When each person receives a reward in proportion to their (A)__________, people tend to perceive that the distributions are (B)__________.", "subject": "아이들도 아는 비례의 원칙", "vocab": [["moral", "도덕적인", 1, "⚖️", "Sharing plays a big role in the moral lives of children …", "a"], ["divide", "나누다", 2, "➗", "… they get a lot of practice when they divide things equally.", "v"], ["toddler", "걸음마 단계의 아이", 7, "👶", "Even toddlers seem to recognize the importance of proportionality.", "n"], ["proportionality", "비례의 원칙", 8, "📊", "Even toddlers seem to recognize the importance of proportionality.", "n"], ["sign", "기색, 조짐", 9, "🚩", "… two-year-olds showed signs of being surprised when two people were rewarded equally …", "n"], ["reluctant", "꺼리는, 마음이 내키지 않는", 14, "😬", "At younger ages, kids are more reluctant to follow this intuition …", "a"], ["adolescence", "청소년기", 16, "🧑", "… but by adolescence, they are much better at applying proportionality to themselves.", "n"]], "pages": [[{"en": "Sharing plays a big role in the moral lives of children, and they get a lot of practice when they divide things equally.", "g": [["plays a big role in", "play a role in", "'~에서 역할을 하다'. 나눔이 아이들의 도덕성 발달에 중요하다는 도입이다.", "v"], ["divide things equally", "글의 출발점", "'균등하게 나누기'. 글은 이 단순한 균등 분배에서 시작해 '기여에 비례한 분배'로 나아간다.", "v"]]}, {"en": "If there are four kids and twelve jelly beans, each kid should get three.", "g": [["each kid should get three", "균등 분배의 예", "12 ÷ 4 = 3. 모두가 똑같이 일했다면 똑같이 나누는 것이 당연하다는 상황이다.", "v"]]}, {"en": "Obviously.", "g": []}, {"en": "But what do kids do when the jelly beans are a reward for cleaning up the classroom, and one kid did most of the work while another kid did nothing?", "key": 1, "g": [["But what do kids do", "전환의 질문", "But으로 상황을 뒤집는다. 젤리빈이 '보상'이고 기여가 다르다면? 글의 핵심 질문이며 이후 실험들이 그 답이다.", "v"], ["while another kid did nothing", "대조의 while", "'~하는 동안, ~하는 반면'. 대부분 일한 아이와 아무것도 안 한 아이를 맞세운다. 기여(contribution)의 차이가 여기서 등장한다.", "g"]]}], [{"en": "Even toddlers seem to recognize the importance of proportionality.", "key": 1, "g": [["Even toddlers", "강조의 even", "'심지어 걸음마 아기들도'. 아주 어린 아이조차 안다는 강조다. 뒤의 두 살 아이 실험이 근거다.", "v"], ["proportionality", "글의 열쇠말", "'비례의 원칙' — 일한 만큼 받는다. 요약문의 in proportion to their contribution이 이 단어를 풀어 쓴 것이다.", "v"]]}, {"en": "In one experiment, two-year-olds showed signs of being surprised when two people were rewarded equally if only one of them did all the work.", "g": [["showed signs of being surprised", "전치사 + 동명사(수동)", "of 뒤에 동명사가 오는데, 아이들이 '놀라게 되는' 것이므로 수동형 being surprised다.", "g"], ["if only one of them did all the work", "실험의 조건", "한 사람만 일했는데 똑같이 보상받자 두 살 아이들이 놀랐다. 즉 균등 분배가 '이상하다'고 느낀 것이다.", "v"]]}, {"en": "By the age of six, kids show a clear preference for rewarding the hard worker in a group, even if equal pay is an option.", "key": 1, "g": [["a clear preference for rewarding the hard worker", "preference for + v-ing", "'~하는 것에 대한 선호'. for는 전치사이므로 동명사 rewarding이 온다. 6세는 열심히 일한 사람에게 더 주기를 택한다.", "g"], ["even if equal pay is an option", "양보의 even if", "'균등 보수가 선택지에 있더라도'. 똑같이 나눌 수 있는데도 굳이 비례 분배를 고른다는 점이 강조된다.", "v"]]}, {"en": "At younger ages, kids are more reluctant to follow this intuition when it means that they themselves get less reward, but by adolescence, they are much better at applying proportionality to themselves.", "g": [["are more reluctant to follow", "be reluctant to-v", "'~하기를 꺼리다'. 자기가 덜 받게 되면 어린아이들은 비례 원칙을 따르기 싫어한다.", "g"], ["when it means that", "it의 지칭", "it은 to follow this intuition(이 직관을 따르는 것)을 가리킨다. that절은 means의 목적어다.", "g"], ["much better at applying proportionality to themselves",  that few people have heard of.", "a"], ["medieval", "중세의", 5, "🏰", "The main cities of medieval Britain — London, York, Norwich, Glasgow — are relatively uncommon as surnames …", "a"], ["surname", "성(姓)", 7, "🪪", "… are relatively uncommon as surnames even though many thousands of people called those places home.", "n"], ["paradox", "역설, 모순된 일", 9, "🔄", "To understand this apparent paradox, you must keep in mind …", "n"], ["be at a loss", "어쩔 줄 모르다", 13, "😵", "… anyone searching for him would be at a loss.", "phr"], ["as a rule", "대체로, 일반적으로", 14, "📏", "So as a rule a person would earn the name Peter of London only if he moved to a rural location …", "phr"], ["identifying", "신원을 밝히는, 식별하는", 17, "🔎", "… where London would be a clear identifying feature.", "a"]], "pages": [[{"en": "A curious fact about names based on places is that they are so often obscure — usually from places that few people have heard of.", "key": 1, "g": [["is that they are so often obscure", "보어절을 이끄는 that", "주어 A curious fact의 내용을 that절이 보어로 설명한다. '사실은 ~라는 것이다'. 화제: 지명에서 온 성은 대개 이름 없는 시골 지명이다.", "g"], ["that few people have heard of", "관계대명사 + 문미 전치사", "places를 수식한다. hear of의 목적어가 관계대명사 that로 앞에 나가 of가 문장 끝에 남았다. few는 '거의 없는'.", "g"]]}, {"en": "Why should there be so many more Middletons than Londons, so many more Worthingtons than Bristols?", "g": [["Why should there be so many more", "의문의 제기", "there be 구문의 의문문. 작은 마을 이름(Middleton, Worthington)이 대도시 이름(London, Bristol)보다 성으로 훨씬 많다는 수수께끼를 던진다. 고유명사에 -s를 붙여 '~라는 성을 가진 사람들'을 나타냈다.", "v"]]}, {"en": "The main cities of medieval Britain — London, York, Norwich, Glasgow — are relatively uncommon as surnames even though many thousands of people called those places home.", "g": [["are relatively uncommon as surnames", "역설의 내용", "대도시에 수천 명이 살았는데도 그 도시 이름은 성으로 드물다. 다음 문장의 this apparent paradox가 이것을 가리킨다.", "v"], ["even though", "양보의 접속사", "'~에도 불구하고'. 인구가 많았다는 사실과 성이 드물다는 사실의 어긋남을 드러낸다. call A home은 'A를 고향으로 삼다'.", "v"]]}], [{"en": "To understand this apparent paradox, you must keep in mind that the function of surnames is ______.", "key": 1, "g": [["To understand this apparent paradox", "to부정사의 목적", "'이 역설을 이해하기 위해서는'. 부사적 용법. apparent는 '외견상의, 겉보기의'로, 실제로는 역설이 아니라는 뜻을 품고 있다.", "g"], ["keep in mind that", "'~을 명심하다'", "that절이 keep in mind의 목적어다. 빈칸은 '성의 기능'인데, 뒤의 Peter of London 예에서 답을 찾아야 한다.", "v"]]}, {"en": "If a person called himself Peter of London, he would be just one of hundreds of such Peters and anyone searching for him would be at a loss.", "key": 1, "g": [["If a person called himself Peter of London, he would be", "가정법 과거", "if + 과거동사(called), 주절 would + 동사원형. 현재 사실과 반대되는 가정이다. 런던 안에서 'Peter of London'은 아무도 구별하지 못한다는 예.", "g"], ["anyone searching for him would be at a loss", "현재분사 수식 + 빈칸의 근거", "searching for him이 anyone을 수식한다. 그를 찾는 사람이 '어쩔 줄 모른다' = 그 이름으로는 사람을 구별할 수 없다. 성의 기능이 '구별'(③)임을 보여 준다.", "v"]]}, {"en": "So as a rule a person would earn the name Peter of London only if he moved to a rural location, where London would be a clear identifying feature.", "key": 1, "g": [["only if he moved to a rural location", "only if '~하는 경우에만'", "시골로 이사했을 때만 London이 성이 된다. 그곳에서는 런던 출신이 그 사람 하나뿐이라 구별이 되기 때문이다. 대도시 성이 드문 이유가 여기서 풀린다.", "v"], ["where London would be a clear identifying feature", "관계부사 where(계속적 용법)", "콤마 뒤의 where는 a rural location을 보충 설명하며 and there로 바꿀 수 있다. identifying feature '신원을 밝히는 특징'이 곧 빈칸의 distinguish다.", "g"]]}]], "choices": [["to emphasize the importance of class and status", false, "계층이나 신분은 언급되지 않았다."], ["to highlight the most interesting feature of the person", false, "'흥미로운' 특징이 아니라 '남과 구별되는' 특징이 핵심이다."], ["to distinguish one person or family from all the others", true, "정답. Peter of London이 런던에서는 수백 명 중 하나라 아무도 찾을 수 없지만, 시골에서는 명백한 식별 특징이 된다 — 성의 기능은 구별이다."], ["to establish bonds among various community members", false, "공동체 구성원 간의 유대는 글과 무관하다."], ["to identify an individual’s place of birth and background", false, "출생지를 밝히는 것이 기능이라면 런던 출신 수천 명이 모두 London이라는 성을 가졌어야 한다. 글은 그 반대를 설명한다."]], "flow": ["도입 — 지명에서 온 성은 대개 사람들이 들어 본 적 없는 작은 곳의 이름이다", "의문 — 왜 London보다 Middleton, Bristol보다 Worthington이라는 성이 훨씬 많은가", "역설 — 중세 대도시에 수천 명이 살았지만 그 도시 이름은 성으로 드물다", "열쇠 — 성의 기능은 한 사람을 다른 모든 이들로부터 구별하는 것이다(빈칸)", "예시 — 런던 안의 Peter of London은 수백 명 중 하나. 시골로 이사해야 London이 식별 특징이 된다"], "bg": "영국의 성은 대개 직업(Smith, Baker), 아버지 이름(Johnson), 신체 특징(Brown), 그리고 지명에서 왔다. 중세에 인구가 늘어 같은 세례명을 가진 사람이 많아지자 구별을 위해 덧붙인 것이 성의 시작이다. 그래서 성은 '그 사람만의 다른 점'을 담게 되었고, 고향 이름은 고향을 떠난 사람에게만 구별 특징이 된다는 것이 이 글의 논리다. 빌 브라이슨의 『거의 모든 것의 역사』류 교양서에서 자주 다루는 소재다.", "quiz": [{"q": "Peter of London이라는 이름이 런던 안에서 쓸모없는 이유는?", "opts": ["런던 사람들이 성을 쓰지 않았기 때문", "같은 이름의 Peter가 수백 명이어서 구별이 안 되기 때문", "London이 발음하기 어렵기 때문"], "a": 1, "exp": "he would be just one of hundreds of such Peters and anyone searching for him would be at a loss."}, {"q": "어떤 사람이 Peter of London이라는 이름을 얻게 되는 경우는?", "opts": ["런던에서 태어났을 때", "시골 지역으로 이사했을 때", "귀족이 되었을 때"], "a": 1, "exp": "a person would earn the name Peter of London only if he moved to a rural location, where London would be a clear identifying feature."}]}, {"no": 3902, "dn": "2", "label": "DAY 39 · 2번", "type": "글의 순서", "answer": 2, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "subject": "목소리 큰 한 사람이 여론을 왜곡한다", "vocab": [["fluency", "(일의) 능숙함; (언어의) 유창함", 1, "🌊", "An interesting question related to processing fluency in organizations …", "n"], ["gauge", "평가하다, 측정하다", 2, "📐", "… concerns how organizations gauge their employees’ and customers’ opinions.", "v"], ["consistently", "끊임없이, 일관되게", 9, "🔁", "A manager consistently gets requests from one employee that a company policy be changed.", "ad"], ["vocal", "(의견을) 강경하게 밝히는", 5, "📣", "Will the vocal employee’s frequent requests bias the manager’s sense …", "a"], ["bias", "편견을 갖게 하다", 5, "⚖️", "Will the vocal employee’s frequent requests bias the manager’s sense of how the rest of the people … feel …", "v"], ["infer", "추론하다", 15, "🧩", "… people have a tendency to infer that a familiar opinion is a prevalent one …",
