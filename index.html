<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 수능실감 300제 · DAY 28~39 | 단국대학교사범대학부속고등학교</title>
<meta name="theme-color" content="#123A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독해수업">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#123A6B; --navy2:#1B5299; --navy-ink:#08213F; --gold:#F5B301; --gold2:#FFD34D;
  --gold-soft:#FFF4D4; --cream:#F7F9FC; --paper:#fff; --ink:#12243A; --muted:#6E819A;
  --line:#D9E2EE; --blue:#1B5FB8; --blue-soft:#E8F1FC; --red:#C0304F; --red-soft:#FDEEF1;
  --burg:#9C1B3C; --burg-soft:#FCEDF1; --orng:#C2600A; --orng-soft:#FFF1E0;
  --green:#2E6B4F; --green-soft:#E4F3E9;
  --shadow:0 4px 0 rgba(8,33,63,.10), 0 12px 30px rgba(8,33,63,.10);
  --kr:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  --en:'Lexend','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--kr); color:var(--ink); background:var(--cream); -webkit-font-smoothing:antialiased; overflow-x:hidden}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
img{display:block}
.en-t{font-family:var(--en)}

/* 상단바 */
.topbar{position:sticky; top:0; z-index:60; background:linear-gradient(180deg,var(--navy2),var(--navy));
  color:#fff; display:flex; align-items:center; gap:18px; padding:10px 22px; min-height:74px;
  box-shadow:0 3px 0 var(--gold), 0 10px 24px rgba(8,33,63,.22)}
.tb-badge{background:var(--gold); color:var(--navy-ink); font-weight:900; padding:7px 15px;
  border-radius:999px; font-size:19px; white-space:nowrap}
.tb-title{font-weight:900; font-size:23px; letter-spacing:-.01em; white-space:nowrap}
.tb-sub{font-weight:500; font-size:16px; color:#CFE0F5; white-space:nowrap}
.tb-steps{display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end}
.tb-step{font-family:var(--en); font-size:14px; font-weight:700; padding:7px 13px; border-radius:999px;
  background:rgba(255,255,255,.14); color:#FFE9C9; border:2px solid transparent; transition:.15s; letter-spacing:.02em}
.tb-step:hover{background:rgba(255,255,255,.26)}
.tb-step.on{background:var(--gold); color:var(--navy-ink); border-color:#fff}
.tb-logo{display:flex; align-items:center; gap:10px; margin-left:16px; flex:none}
.tb-logo img{height:54px; width:54px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.tb-logo-t{display:flex; flex-direction:column; line-height:1.15}
.tb-logo-t b{font-size:19px; font-weight:800; color:#fff; letter-spacing:-.01em; white-space:nowrap}
.tb-logo-t span{font-family:Lexend,sans-serif; font-size:12.5px; font-weight:500; color:#FFE38A; letter-spacing:.02em; white-space:nowrap}

.stage{position:relative; max-width:1720px; margin:0 auto; padding:24px 26px 118px; min-height:calc(100vh - 96px)}
#ink{position:absolute; inset:0; z-index:40; pointer-events:none; touch-action:none}
body.pen #ink{pointer-events:auto; cursor:crosshair}

.card{background:var(--paper); border-radius:22px; border:3px solid var(--line);
  box-shadow:var(--shadow); padding:30px 30px 26px; position:relative}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--gold-soft); border:2px solid var(--gold);
  color:var(--navy-ink); font-weight:800; padding:6px 14px; border-radius:999px; font-size:16px;
  font-family:var(--en); letter-spacing:.04em}
h2.sec{font-size:29px; font-weight:900; margin:0 0 6px; letter-spacing:-.02em}
h2.sec.en-t{font-weight:800; letter-spacing:-.01em}
.sec-note{color:var(--muted); font-weight:500; font-size:17px; margin:0 0 18px}
.sec-note.en-t{font-weight:400; font-size:16.5px}
.mascot{position:absolute; pointer-events:none; user-select:none}
.rowbtns{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.mini{background:var(--gold-soft); border:2.5px solid var(--gold); color:var(--navy-ink);
  font-weight:900; font-size:15px; padding:9px 18px; border-radius:11px; font-family:var(--en); letter-spacing:.05em}
.mini:hover{background:var(--gold2)}

/* 홈 */
.homeart{position:relative; margin:16px 0 4px; border-radius:22px; overflow:hidden; border:3px solid var(--yellow); box-shadow:0 10px 28px rgba(18,58,107,.18); height:400px; background:#fff}
.homeart img{width:100%; height:100%; object-fit:cover; object-position:center 42%; display:block}
.homeart .cap{position:absolute; right:18px; bottom:14px; background:rgba(18,58,107,.88); color:#fff; font-family:Lexend,sans-serif; font-weight:600; font-size:15px; padding:8px 16px; border-radius:999px; letter-spacing:.02em}
@media (max-width:1300px){.homeart{height:320px}}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 62%,#2A6FBE 100%);
  border-radius:24px; color:#fff; padding:22px 28px; position:relative; overflow:hidden;
  border:4px solid var(--gold); box-shadow:var(--shadow); min-height:172px; display:flex; align-items:center}
.hero .eyebrow{font-family:var(--en); font-weight:800; color:var(--gold2); letter-spacing:.2em; font-size:13px}
.hero h1{font-size:34px; font-weight:900; margin:5px 0 7px; letter-spacing:-.02em; line-height:1.15}
.hero p{font-size:16px; color:#DCE9F8; margin:0; max-width:640px; font-weight:500; line-height:1.55}
.hero .marks{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap}
.hero .mk{background:rgba(255,255,255,.15); border:2px solid rgba(255,215,120,.5);
  padding:5px 13px; border-radius:999px; font-weight:700; font-size:14px}
.hero .mchar{position:absolute; right:26px; bottom:0; height:168px; width:auto;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}

.dayrow{display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:16px; margin-top:18px}
.daycard{background:var(--paper); border:3px solid var(--line); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow)}
.daycard h3{margin:0 0 3px; font-size:22px; font-weight:900; color:var(--navy); font-family:var(--en)}
.daycard .dsub{color:var(--muted); font-size:14px; font-weight:500; margin:0 0 12px}
.plist{display:flex; flex-direction:column; gap:9px}
.prow{display:flex; align-items:center; gap:10px; background:var(--cream); border:2.5px solid var(--line);
  border-radius:14px; padding:9px 11px; transition:.14s}
.prow:hover{border-color:var(--gold); background:var(--gold-soft)}
.pbtn{display:flex; align-items:center; gap:12px; flex:1; min-width:0; text-align:left; overflow:hidden}
.pbtn>span{min-width:0; overflow:hidden}
.pnum{flex:none; width:46px; height:46px; border-radius:12px; background:var(--navy); color:#fff;
  display:grid; place-items:center; font-weight:900; font-size:20px}
.prow:hover .pnum{background:var(--navy2)}
.ptype{font-weight:900; font-size:17px; letter-spacing:-.01em}
.psubj{display:block; color:var(--muted); font-weight:500; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ptype{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cls{display:flex; gap:5px; flex:none}
.clsb{min-width:44px; height:38px; padding:0 8px; border-radius:10px; border:2.5px solid var(--line); background:#fff;
  font-weight:900; font-size:14px; color:var(--muted); display:grid; place-items:center; transition:.12s; line-height:1}
.clsb:hover{border-color:var(--navy2)}
.clsb.done{background:#1E8E4A; border-color:#166B38; color:#fff}
.clsb.done:before{content:"\2713 "; font-size:15px}

/* 어휘 */
.vhead{display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start}
.vpanel{background:linear-gradient(160deg,var(--gold-soft),#FFFDF6); border:3px solid var(--gold);
  border-radius:20px; min-height:296px; padding:18px 22px 16px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; position:relative}
.vpanel .ph{color:#B79A55; font-weight:700; font-size:15px; line-height:1.6}
.vpanel .emo{font-size:72px; line-height:1.05}
.vpanel .w{font-family:var(--en); font-weight:800; font-size:30px; color:var(--navy); margin-top:4px; word-break:break-word}
.vpanel .m{font-weight:700; font-size:20px; margin-top:2px}
.vpanel .ctx{font-family:var(--en); font-size:19px; color:#3D4E63; line-height:1.62; margin-top:12px;
  background:#fff; border-radius:12px; padding:13px 16px; border:2.5px solid var(--gold); text-align:left; width:100%}
.vpanel .ctx b{color:var(--navy2); font-weight:800; background:rgba(245,179,1,.28);
  border-radius:5px; padding:1px 4px}
.vpanel .ln{position:absolute; top:10px; right:14px; font-family:var(--en); font-size:17px; font-weight:800; color:#8C6D2B; background:#fff; border:2px solid var(--gold); border-radius:999px; padding:3px 12px}
.vpanel img.up{max-width:100%; max-height:190px; border-radius:12px; border:2px solid var(--gold); margin-top:8px}
.vtools{display:flex; gap:7px; margin-top:11px; justify-content:center; flex-wrap:wrap}
.vtools .slot{display:inline-block; font-family:var(--en); font-size:13px; font-weight:800; color:#A88439;
  border:2px dashed #E2C579; border-radius:9px; padding:5px 14px; cursor:pointer; letter-spacing:.06em}
.vtools .slot:hover{background:#fff; color:var(--navy)}
.vtools .slot.del{border-style:solid; border-color:var(--red); color:var(--red)}
.vtools .slot.del:hover{background:var(--red); color:#fff}
.dictbtn{display:inline-flex; align-items:center; gap:7px; background:#03C75A; color:#fff;
  font-family:var(--en); font-weight:800; font-size:15px; padding:9px 18px; border-radius:11px;
  text-decoration:none; letter-spacing:.03em}
.dictbtn:hover{background:#02A94C}

.vrow{display:grid; gap:14px; margin-top:16px}
.vrow.r3{grid-template-columns:repeat(3,1fr)}
.vrow.r4{grid-template-columns:repeat(4,1fr)}
.flip{perspective:1100px; height:124px}
.flip .in{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
  display:grid; place-items:center; text-align:center; padding:20px 14px 14px; border:3px solid}
.flip .f{background:var(--gold-soft); border-color:var(--gold); color:var(--navy-ink)}
.flip .b{background:var(--navy); border-color:var(--navy-ink); color:#fff; transform:rotateY(180deg)}
.flip .f span.wd{font-family:var(--en); font-weight:700; font-size:25px; line-height:1.2; word-break:break-word}
.flip .b span.wd{font-weight:700; font-size:20px; line-height:1.35}
.flip .tag{position:absolute; top:7px; left:11px; font-size:9.5px; font-weight:800; opacity:.45;
  letter-spacing:.16em; font-family:var(--en)}
.flip .lno{position:absolute; bottom:7px; right:10px; font-size:16px; font-weight:800; opacity:.9; font-family:var(--en); background:rgba(255,255,255,.75); border-radius:8px; padding:2px 9px; color:var(--navy)}
.flip .b .lno{background:rgba(255,255,255,.18); color:#fff}
.flip .pos{position:absolute; top:7px; right:10px; font-size:12px; font-weight:800; font-family:var(--en); letter-spacing:.06em; background:var(--navy); color:#fff; border-radius:999px; padding:2px 9px}
.flip .b .pos{background:var(--gold); color:var(--navy-ink)}
.vpanel .pos{display:inline-block; font-family:var(--en); font-weight:800; font-size:15px; background:var(--navy); color:#fff; border-radius:999px; padding:2px 11px; vertical-align:middle; margin-left:8px}
.flip.sel .f{box-shadow:0 0 0 4px var(--navy2)}

/* 독해 */
.given{background:var(--gold-soft); border:3px dashed var(--gold); border-radius:18px; padding:15px 22px; margin-bottom:18px}
.given .lb{font-family:var(--en); font-weight:800; color:var(--navy); font-size:14px; letter-spacing:.1em; margin-bottom:5px}
.given .e{font-family:var(--en); font-weight:600; font-size:25px; line-height:1.5}
.given .k{font-weight:500; color:#5A6C82; font-size:18px; margin-top:5px}
.sent{padding:17px 4px 7px; border-bottom:2px dashed var(--line)}
.sent:last-child{border-bottom:none}
.sent .plabel{display:inline-block; background:var(--navy); color:#fff; font-weight:900; font-size:16px;
  padding:4px 14px; border-radius:8px; margin-bottom:9px; font-family:var(--en)}
.en{font-family:var(--en); font-weight:600; font-size:31px; line-height:2.15; letter-spacing:-.005em}
.ko{font-weight:500; font-size:21px; line-height:1.7; color:#5A6C82; margin-top:12px;
  padding-left:15px; border-left:5px solid var(--gold)}
.hlb{background:linear-gradient(180deg,rgba(255,255,255,0) 34%, rgba(64,150,255,.42) 34%);
  border-radius:4px; padding:0 2px}
.keytag{display:inline-block; vertical-align:middle; background:#1B5FB8; color:#fff; font-family:var(--en);
  font-size:11.5px; font-weight:800; letter-spacing:.1em; padding:3px 9px; border-radius:999px; margin-right:9px}

.gw{font-weight:700; cursor:pointer; border-radius:6px; padding:1px 3px; transition:.12s}
.gw.g{color:var(--burg); box-shadow:inset 0 -11px 0 var(--burg-soft)}
.gw.g:hover{box-shadow:inset 0 -32px 0 var(--burg-soft)}
.gw.g.on{background:var(--burg); color:#fff; box-shadow:none}
.gw.v{color:var(--orng); box-shadow:inset 0 -11px 0 var(--orng-soft)}
.gw.v:hover{box-shadow:inset 0 -32px 0 var(--orng-soft)}
.gw.v.on{background:var(--orng); color:#fff; box-shadow:none}
.gcards{display:flex; flex-direction:column; gap:11px; margin-top:13px}
.gcard{background:#fff; border:3px solid; border-radius:16px; padding:13px 18px; animation:pop .18s ease-out}
.gcard.g{border-color:var(--burg); background:#FFFAFB; box-shadow:0 5px 0 rgba(156,27,60,.16)}
.gcard.v{border-color:var(--orng); background:#FFFCF7; box-shadow:0 5px 0 rgba(194,96,10,.16)}
@keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.gcard .t{font-weight:900; font-size:20px; margin-bottom:4px}
.gcard.g .t{color:var(--burg)}
.gcard.v .t{color:var(--orng)}
.gcard .t em{font-family:var(--en); font-style:normal; padding:1px 8px; border-radius:6px; margin-right:8px}
.gcard.g .t em{background:var(--burg-soft)}
.gcard.v .t em{background:var(--orng-soft)}
.gcard .d{font-size:18px; line-height:1.62; font-weight:500; color:var(--ink)}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:14.5px; font-weight:700; margin:0 0 14px}
.legend span b{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px}

/* 문제 */
.qstem{background:var(--navy); color:#fff; border-radius:16px; padding:16px 22px; font-weight:700; font-size:23px; line-height:1.5}
.opts{display:flex; flex-direction:column; gap:12px; margin-top:16px}
.opt{width:100%; text-align:left; display:flex; gap:15px; align-items:flex-start; background:var(--paper);
  border:3px solid var(--line); border-radius:16px; padding:15px 18px; transition:.16s}
.opt:hover{border-color:var(--gold)}
.onum{flex:none; width:40px; height:40px; border-radius:11px; background:var(--cream);
  border:2.5px solid var(--line); display:grid; place-items:center; font-weight:900; font-size:20px}
.otext{font-weight:700; font-size:22px; line-height:1.45; display:block; padding-top:5px}
.opt.long .otext{font-family:var(--en); font-weight:600; font-size:19px; line-height:1.55}
.ofull{display:block; margin-top:9px; font-family:var(--en); font-weight:500; font-size:17px;
  line-height:1.6; color:#5A6C82; background:var(--cream); border-left:5px solid var(--gold);
  border-radius:0 11px 11px 0; padding:10px 15px}
.ofull b{color:var(--navy2); font-weight:800; background:rgba(245,179,1,.3); border-radius:5px; padding:1px 5px}
.opt.pick-ok .ofull, .opt.pick-no .ofull{background:rgba(255,255,255,.92); border-left-color:#fff}
.opt.pick-ok .ofull{color:#12417F}
.opt.pick-no .ofull{color:#8F1D34}
.owhy{display:none; margin-top:11px; font-weight:500; font-size:18px; line-height:1.6; color:#3D4E63;
  background:var(--cream); border-radius:11px; padding:11px 15px}
.opt.open .owhy{display:block}
.opt.pick-ok{background:var(--blue); border-color:#12417F}
.opt.pick-ok .otext{color:#fff}
.opt.pick-ok .onum{background:#fff; color:var(--blue); border-color:#fff}
.opt.pick-ok .owhy{background:rgba(255,255,255,.94); color:#12417F}
.opt.pick-no{background:var(--red); border-color:#8F1D34}
.opt.pick-no .otext{color:#fff}
.opt.pick-no .onum{background:#fff; color:var(--red); border-color:#fff}
.opt.pick-no .owhy{background:rgba(255,255,255,.94); color:#8F1D34}
.opt.ok{border-color:var(--blue); background:var(--blue-soft)}
.opt.ok .onum{background:var(--blue); color:#fff; border-color:#12417F}
.opt.no{border-color:#C3CEDC; background:#F6F8FB}
.opt.no .otext{color:#6E819A}
.qsplit{margin-top:34px; border-top:4px dotted var(--line); padding-top:26px}

/* 순서 배열 */
.sorthint{background:var(--gold-soft); border:2.5px solid var(--gold); border-radius:13px;
  padding:11px 16px; margin-top:16px; font-family:var(--en); font-weight:600; font-size:16px; color:var(--navy-ink)}
.sortlist{display:flex; flex-direction:column; gap:12px; margin-top:14px}
.sortcard{display:flex; gap:14px; align-items:flex-start; background:#fff; border:3px solid var(--line);
  border-radius:16px; padding:14px 16px; cursor:grab; touch-action:none; transition:border-color .12s, background .12s}
.sortcard:hover{border-color:var(--gold)}
.sortcard.drag{cursor:grabbing; border-color:var(--navy2); background:var(--gold-soft);
  box-shadow:0 10px 24px rgba(8,33,63,.20)}
.sortcard .pos{flex:none; width:44px; height:44px; border-radius:12px; background:var(--navy); color:#fff;
  display:grid; place-items:center; font-family:var(--en); font-weight:800; font-size:20px}
.sortcard .bdg{flex:none; width:44px; height:44px; border-radius:12px; background:var(--gold-soft);
  border:2.5px solid var(--gold); color:var(--navy-ink); display:grid; place-items:center;
  font-family:var(--en); font-weight:800; font-size:19px}
.sortcard .txt{flex:1; min-width:0}
.sortcard .txt .e{display:block; font-family:var(--en); font-weight:600; font-size:18px; line-height:1.6}
.sortcard .txt .k{display:block; font-size:16px; color:#5A6C82; line-height:1.65; margin-top:7px;
  padding-left:12px; border-left:4px solid var(--gold)}
.sortcard .arrows{flex:none; display:flex; flex-direction:column; gap:5px}
.arrow{width:36px; height:31px; border:2.5px solid var(--line); border-radius:9px; background:var(--cream);
  font-size:14px; font-weight:900; color:var(--navy); display:grid; place-items:center}
.arrow:hover{border-color:var(--gold); background:var(--gold-soft)}
.sortcard.ok{border-color:var(--blue); background:var(--blue-soft)}
.sortcard.ok .pos{background:var(--blue)}
.sortcard.bad{border-color:var(--red); background:var(--red-soft)}
.sortcard.bad .pos{background:var(--red)}
.sortres{margin-top:14px; border-radius:14px; padding:14px 18px; font-weight:700; font-size:19px; display:none}
.sortres.on{display:block}
.sortres.good{background:var(--blue-soft); border:3px solid var(--blue); color:#12417F}
.sortres.bad{background:var(--red-soft); border:3px solid var(--red); color:#8F1D34}
.sortres .why{display:block; font-weight:500; font-size:17px; line-height:1.6; margin-top:7px}

/* 주제 정리 · 초록 칠판 */
.two{display:grid; grid-template-columns:1.05fr .95fr; gap:20px; align-items:start}
.board{background:
   repeating-linear-gradient(0deg, rgba(255,255,255,.45) 0 1px, rgba(255,255,255,0) 1px 34px),
   linear-gradient(160deg,#EDF7EF,#DDEFE3);
  border:12px solid #7A5A33; border-radius:16px; box-shadow:inset 0 0 0 4px #4B7A5F, 0 8px 20px rgba(8,33,63,.16);
  padding:20px 24px}

 "g": [["goes by the fancy name of", "go by the name of A", "'A라는 이름으로 통하다'.", "v"], ["between and among other texts", "공통 목적어", "other texts가 between과 among의 공통 목적어다. 빈칸의 방향을 정하는 문장이다.", "g"]]}, {"en": "To read something as literature is to consider it as a linguistic event that ______________________.", "key": 1, "g": [["To read something as literature is to consider", "to부정사 주어 + 보어", "To read가 주어, to consider 이하가 보어다. 빈칸은 관계사절로 a linguistic event를 수식한다.", "g"], ["it as a linguistic event", "consider A as B", "'A를 B로 여기다'.", "v"]]}], [{"en": "In one of the lines of Shakespeare's Sonnet 130, 'But no such roses see I in her cheeks,' the speaker takes up the conventions of love poetry, which often compare a beloved to a series of idealized images, such as roses, lilies, and pearls, and challenges them by describing his beloved in realistic, not idealized terms.", "key": 1, "g": [["takes up the conventions of love poetry", "동사의 병렬", "주어 the speaker에 두 동사가 연결된다. '관습을 끌어와서' + '도전한다'는 두 동작이 함께 일어난다.", "g"], ["compare a beloved to", "compare A to B", "'A를 B에 비유하다'. 사랑 시의 오래된 관습을 설명한다.", "v"]]}, {"en": "This subversion of traditional love poetry counts on the reader's familiarity with earlier love poems in order to create meaning.", "key": 1, "g": [["counts on the reader's familiarity", "빈칸의 결정적 단서", "독자가 이전 시들을 알고 있어야 뒤집기가 통한다 → '공유된 문학적 배경에 의존한다'.", "v"], ["in order to create meaning", "in order to-v", "'의미를 만들어 내기 위해'. 목적을 나타낸다.", "g"]]}]], "choices": [["relies on a shared literary background", true, "정답. 소네트 130의 뒤집기는 독자가 전통적인 사랑 시를 알고 있어야 성립한다. 공유된 문학적 배경에 의존한다는 뜻이다."], ["exists primarily for its artistic qualities", false, "'예술적 특성 그 자체를 위해 존재한다'는 것은 상호텍스트성과 정반대의 관점이다."], ["combines cultural contexts with imagination", false, "문화적 맥락과 상상력의 결합은 글에 근거가 없다. 핵심은 '앞선 텍스트'다."], ["preserves social atmosphere of a particular era", false, "특정 시대의 사회 분위기를 보존한다는 내용은 없다."], ["transcends the limitations of literal interpretation", false, "문자 그대로의 해석을 넘어선다는 이야기가 아니다."]], "flow": re to form.", false, "낮아진 어는점의 결과를 설명하므로 흐름에 맞는다."], ["The flavor of ice cream can be enhanced by storing it at an extremely low temperature, which creates an outstanding cold sensation …", true, "정답. 설탕이 조직에 미치는 영향이 아니라 보관 온도와 풍미·감각을 말한다. 화제가 다르다."], ["The greater the content of sugar in an ice cream, the lower the freezing point.", false, "설탕 함량과 어는점의 관계를 다시 정리한 문장이다."], ["This delayed freezing temperature helps to keep the size of crystals in the ice cream very small …", false, "낮아진 어는점이 결정 크기를 작게 만든다는 결론으로, 첫 문장의 '조직상 특성'을 회수한다."]], "flow": ["전제 — 설탕의 분명한 역할은 단맛이다", "전환(However) — 그러나 설탕은 어는점을 낮춰 '조직'도 결정한다", "①② — 설탕 한 컵이 어는점을 약 2°F 낮추고, 그래서 더 낮게 냉각해야 한다", "③은 보관 온도와 풍미 이야기라 무관", "④⑤ — 설탕이 많을수록 어는점이 낮아지고, 그 덕분에 결정이 작게 유지된다"], "bg": "설탕이 어는점을 낮추는 것은 '어는점 내림'이라는 물리 현상이다. 겨울철 도로에 소금을 뿌리는 것과 같은 원리다. 아이스크림이 부드러운 이유는 얼음 결정이 작기 때문인데, 냉동실에 오래 둔 아이스크림이 서걱거리는 것은 녹았다 얼기를 반복하며 결정이 커졌기 때문이다.", "quiz": [{"q": "설탕이 아이스크림 조직에 영향을 주는 원리는?", "opts": ["혼합물의 어는 온도를 떨어뜨려서", "단맛을 더해서", "색을 바꿔서"], "a": 0, "exp": "because sugar causes the freezing temperature of the mixture to drop."}, {"q": "③이 무관한 이유는?", "opts": ["아이스크림 이야기가 아니라서", "설탕과 조직이 아니라 보관 온도와 풍미를 말해서", "수치가 없어서"], "a": 1, "exp": "글의 축은 '설탕 → 어는점 → 결정 크기'다."}]}, {"no": 2804, "dn": "4", "label": "DAY 28 · 4번", "type": "글의 순서", "answer": 5, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "subject": "디지털 기술은 아직 시작일 뿐이다", "vocab": [["live through", "(살면서) 겪다", 1, "🕰️", "For those of us who have lived through the invention of the Internet …", "phr"], ["mature phase", "성숙한 단계", 3, "🌳", "… it feels like digital technology has finally reached a mature phase.", "n"], ["scratch the surface", "수박 겉핥기식으로 하다", 4, "🪨", "But as most tech experts will tell you, we've barely scratched the surface.", "phr"], ["nudge", "주의를 환기시키다", 7, "👉", "It can send birthday greetings for us, nudge us when a friend posts troublesome news …", "v"], ["troublesome", "까다로운, 곤란한", 7, "⚠️", "… nudge us when a friend posts troublesome news.", "a"], ["amuse" 다.", "g"], ["remind us to dress", "remind + O + to-v", "'O에게 ~하라고 상기시키다'.", "g"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)의 It이 가리킬 대상(개인 비서 앱)이 아직 나오지 않았다."], ["(B) – (A) – (C)", false, "(B)의 This modern digital world는 (C)의 묘사를 받는다. (C)가 먼저다."], ["(B) – (C) – (A)", false, "같은 이유로 (B)가 주어진 글 바로 뒤에 올 수 없다."], ["(C) – (A) – (B)", false, "(A)의 It은 (B)에서 소개된 앱을 받으므로 (B)가 (A)보다 앞서야 한다."], ["(C) – (B) – (A)", true, "정답. 아직 시작일 뿐이다 → (C) 매일 수만 개의 앱과 장치가 개발된다 → (B) 이 세계는 개인 비서 앱까지 제공한다 → (A) 그것(It)이 하는 일들."]], "flow": ["주어진 글 — 성숙해 보이지만 우리는 겨우 수박 겉핥기만 했다", "(C) — 매일 수만 개의 앱과 더 강력한 장치가 개발되어 삶의 틈새를 메운다", "(B) This — 이 세계는 5년 전엔 불가능하던 일을 가능하게 한다. 예: 개인 비서 앱", "(A) It — 생일 인사, 알림, 옷차림 조언까지 대신해 준다"], "bg": "순서 문제에서 가장 강력한 단서는 대명사다. (A)의 It은 단수이므로 앞에 단수 명사 하나가 있어야 하는데, 그것이 (B)의 an app이다. 지문 내용을 완전히 이해하지 못해도 It → an app, This modern digital world → (C)의 묘사라는 두 연결만 잡으면 순서가 확정된다.", "quiz": [{"q": "(A)의 It이 가리키는 것은?", "opts": ["인터넷", "개인 비서로 '고용한' 앱", "스마트폰"], "a": 1, "exp": "(B)의 an app as our personal assistant를 받는다."}, {"q": "주어진 글이 말하는 바는?", "opts": ["디지털 기술은 이미 완성되었다", "디지털 기술은 아직 시작 단계다", "디지털 기술은 위험하다"], "a": 1, "exp": "we've barely scratched the surface — 겨우 표면만 긁었다는 뜻이다."}]}, {"no": 2805, "dn": "5", "label": "DAY 28 · 5번", "type": "문장 넣기", "answer": 4, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "According to the historian E. H. Warmington, this absence of silver coins suggests a trade mainly in luxury goods during that period.", "subject": "인도에서 발견된 로마 동전이 말해 주는 것", "vocab": [["absence", "부재, 없음", 1, "🕳️", "… this absence of silver coins suggests a trade mainly in luxury goods.", "n"], ["durable", "영속적인, 내구성 있는", 5, "🪙", "Local goods in India were purchased with durable gold and silver coins.", "a"], ["date", "연대를 추정하다", 6, "📅", "… each dated by the image of a Roman emperor.", "v"], ["cache", "은닉물, 저장물", 7, "🗝️", "Caches of these coins are still being discovered in south India.", "n"], ["glimpse", "언뜻 봄", 8, "👀", "… offering us a glimpse of trade patterns two thousand years ago.", "n"], ["reign", "통치 기간, 치세", 10, "👑", "They include gold and silver coins from the reigns of Augustus and Tiberius.", "n"], ["come to a standstill", "멈추다, 정지하다", 21, "🛑", "… trade with the East came to an almost complete standstill.", "phr"]], "pages": [[{"en": "Local goods in India were purchased with durable gold and silver coins, each dated by the image of a Roman emperor.", "g": [["each dated by", "독립분사구문", "each (being) dated by ~. 의미상 주어 each가 남아 있는 분사구문이다.", "g"]]}, {"en": "Caches of these coins are still being discovered in south India, offering us a glimpse of trade patterns two thousand years ago.", "g": [["are still being discovered", "진행형 수동태", "'여전히 발견되고 있는 중이다'. 「be + being + p.p.」.", "g"]]}, {"en": "( ① ) They include gold and silver coins from the reigns of Augustus and Tiberius (27 BC to AD 37), suggesting a vigorous trade in a large volume of goods.", "key": 1, "g": [["( ① )", "①의 판단", "넣을 수 없다. 여기서는 금화와 은화가 '함께' 있다. 주어진 문장의 '은화의 부재'가 성립하지 않는다.", "v"], ["suggesting", "분사구문", "and this suggests ~ 를 줄인 형태다.", "g"]]}, {"en": "( ② ) After the death of Tiberius, the composition of the Indian coin caches changes.", "key": 1, "g": [["( ② )", "②의 판단", "넣을 수 없다. '구성이 달라진다'고만 했을 뿐, 어떻게 달라지는지가 아직 나오지 않았다.", "v"], ["composition", "글의 열쇠말", "'구성'. 무엇이 있고 무엇이 없는지가 다음 문장에서 밝혀진다.", "v"]]}], [{"en": "( ③ ) Significant numbers of only gold, but not silver, coins bearing the heads of Caligula, Claudius, and Nero (AD 37-68) are found.", "key": 1, "g": [["( ③ )", "③의 판단", "넣을 수 없다. 은화의 부재가 바로 이 문장에서 밝혀진다. 주어진 문장은 그 사실을 해석하므로 이 문장 뒤에 와야 한다.", "v"], ["only gold, but not silver", "은화 부재의 근거", "주어진 문장의 this absence of silver coins가 받을 바로 그 내용이다.", "v"], ["bearing the heads of", "현재분사구", "coins를 수식한다. bear는 '지니다, 담다'.", "g"]]}, {"en": "( ④ ) Few Roman coins of any type are found after the death of Marcus Aurelius in AD 180.", "key": 1, "g": [["( ④ )", "④의 판단 — 정답", "앞 문장에서 은화 부재가 확인되었고, 이 문장부터는 화제가 '모든 동전의 소멸'로 넘어간다. 그 사이가 주어진 문장의 자리다.", "v"], ["Few Roman coins", "few의 부정", "'거의 없는'. a few(조금 있는)와 뜻이 정반대다.", "g"]]}, {"en": "( ⑤ ) When Roman and Han authority finally collapsed around AD 200, trade with the East came to an almost complete standstill.", "g": [["( ⑤ )", "⑤의 판단", "넣을 수 없다. 교역이 아예 끝났다는 결론이므로, 특정 시기의 사치품 교역을 해석하는 문장이 들어갈 자리가 아니다.", "v"], ["came to an almost complete standstill", "come to a standstill", "'멈추다'. 글을 닫는 문장이다.", "v"]]}]], "choices": [["( ① ) — They include gold and silver coins from the reigns of Augustus and Tiberius …", false, "여기서는 금화와 은화가 함께 발견된다. '은화의 부재'가 성립하지 않는다.", "( ① ) They include gold and silver coins from the reigns of Augustus and Tiberius (27 BC to AD 37), suggesting a vigorous trade in a large volume of goods."], ["( ② ) — After the death of Tiberius, the composition of the Indian coin caches changes.", false, "구성이 달라진다고만 했을 뿐, 어떻게 달라지는지는 아직 나오지 않았다.", "( ② ) After the death of Tiberius, the composition of the Indian coin caches changes."], ["( ③ ) — Significant numbers of only gold, but not silver, coins bearing the heads of Caligula, Claudius, and Nero are found.", false, "은화의 부재가 바로 이 문장에서 밝혀진다. 해석은 그다음이어야 한다.", "( ③ ) Significant numbers of only gold, but not silver, coins bearing the heads of Caligula, Claudius, and Nero (AD 37-68) are found."], ["( ④ ) — Few Roman coins of any type are found after the death of Marcus Aurelius in AD 180.", true, "정답. 앞에서 은화 없이 금화만 발견된다는 사실이 제시되었고, 뒤부터는 모든 동전이 사라지는 이야기로 넘어간다. 그 사이에 은화 부재를 해석하는 주어진 문장이 들어간다.", "( ④ ) Few Roman coins of any type are found after the death of Marcus Aurelius in AD 180."], ["( ⑤ ) — When Roman and Han authority finally collapsed around AD 200, trade with the East came to an almost complete standstill.", false, "교역의 완전한 중단을 알리는 결론 문장이다. 특정 시기의 해석이 끼어들 자리가 아니다.", "( ⑤ ) When Roman and Han authority finally collapsed around AD 200, trade with the East came to an almost complete standstill."]], "flow": ["도입 — 인도 상품은 로마 금화·은화로 구매되었고, 그 은닉물이 지금도 발견된다", "1기 — 아우구스투스·티베리우스 시기: 금화와 은화가 함께 → 대량 교역", "변화 — 티베리우스 사후 은닉물의 구성이 달라진다", "2기 — 칼리굴라~네로 시기: 은화 없이 금화만 발견", "④ 주어진 문장 — 은화의 부재 = 주로 사치품 교역 / 이후 동전 자체가 사라지고 교역이 멈춘다"], "bg": "고대 로마는 인도에서 후추와 비단, 보석을 사들이며 막대한 금이 빠져나갔고, 플리니우스는 이를 두고 제국의 부가 동방으로 흘러간다고 한탄했다. 고액 화폐인 금화만 남았다는 것은 소액 거래가 아니라 고가품 위주의 교역이었음을 뜻한다. 동전이라는 물증 하나로 교역의 성격을 읽어 내는 방식이 흥미로운 지문이다.", "quiz": [{"q": "주어진 문장의 this absence of silver coins가 받는 문장은?", "opts": ["금화와 은화가 함께 발견된다는 문장", "은화 없이 금화만 발견된다는 문장", "동전이 전혀 없다는 문장"], "a": 1, "exp": "Significant numbers of only gold, but not silver, coins ~ are found."}, {"q": "은화가 사라진 것이 시사하는 바는?", "opts": ["교역이 완전히 끊겼다", "주로 사치품 교역이 이루어졌다", "인도가 화폐를 만들기 시작했다"], "a": 1, "exp": "suggests a trade mainly in luxury goods during that period."}]}, {"no": 2901, "dn": "1", "label": "DAY 29 · 1번", "type": "글의 제목", "answer": 2, "q": "다음 글의 제목으로 가장 적절한 것은?", "subject": "의식에서는 즉흥이 허용되지 않는다", "vocab": [["equate", "동일시하다", 1, "⚖️", "we tend to equate creativity with novelty and originality.", "v"], ["novelty", "새로움", 2, "✨", "But the high value that we place on novelty is not shared universally in all cultures.", "n"], ["improvisation", "즉흥적인 행위", 5, "🎭", "… improvisation is allowed only in informal performances …", "n"], ["ritual", "의식", 9, "🕯️", "In most cultures, rituals forbid improvisation.", "n"], ["supernatural", "초자연적인", 11, "🔮", "a ritual can only perform its supernatural function if performed exactly …", "a"], ["divergence", "일탈, 분기", 12, "↗️", "… a divergence from the appropriate dance or script would result in an ineffective ritual.", "n"], ["pronounce", "선언하다", 15, "📣", "the religious official is expected to say “I now pronounce you husband and wife”", "v"]], "pages": [[{"en": "In the United States, we tend to equate creativity with novelty and originality.", "g": [["equate creativity with novelty", "equate A with B", "'A를 B와 동일시하다'. 미국인의 통념을 먼저 제시하는 도입이다.", "v"]]}, {"en": "But the high value that we place on novelty is not shared universally in all cultures.", "key": 1, "g": [["But", "반전의 신호", "앞의 통념을 뒤집는다. 제목은 이 문장 이후의 내용에서 나온다.", "v"], ["that we place on novelty", "목적격 관계대명사절", "the high value를 수식한다. place A on B(A를 B에 두다)의 A가 관계사로 빠져나갔다.", "g"], ["is not shared universally", "not + 전체 표현 = 부분부정", "'보편적으로 공유되는 것은 아니다'. 전부 아니라는 뜻이 아니라 '모두가 그런 것은 아니다'라는 부분부정이다.", "g"]]}, {"en": "In performance, for example, we find that in almost all cultures — including our own — improvisation is allowed only in informal performances; in formal settings, in contrast, improvisation is not allowed.", "g": [["only in informal performances", "only의 한정", "'비공식적 공연에서만'. 뒤의 formal settings와 짝을 이루는 대조 구조다.", "v"], ["in contrast", "대조 연결어", "비공식 ↔ 공식을 맞세운다. 이 대조가 글 전체의 뼈대다.", "v"]]}, {"en": "Formal performances must follow the movements of the dance or the words of the script.", "g": [["must follow", "의무의 must", "'반드시 따라야 한다'. 공식 공연에는 선택의 여지가 없다는 강한 표현이다.", "v"]]}], [{"en": "In most cultures, rituals forbid improvisation.", "key": 1, "g": [["rituals forbid improvisation", "핵심 진술", "제목의 두 열쇠말이 모두 들어 있다. 의식(ritual) + 새로움 금지.", "v"]]}, {"en": "This seems to be related to the power of ritual; a ritual can only perform its supernatural function if performed exactly, and a divergence from the appropriate dance or script would result in an ineffective ritual.", "g": [["if performed exactly", "접속사 + 분사", "if (it is) performed exactly. 주어와 be동사가 생략된 형태로, 의식이 '수행되는' 것이므로 과거분사다.", "g"], ["would result in", "result in + 결과", "'~라는 결과를 낳다'. result from(~에서 비롯되다)과 방향이 반대다.", "v"]]}, {"en": "In a traditional U.S. Christian wedding, the religious official is expected to say “I now pronounce you husband and wife”; an unexpected creative improvisation such as “I exclaim that you are now joined for life” or even “From now on you will be married” would be disturbing, generally not welcomed by the participants and audience.", "g": [["is expected to say", "be expected to-v", "'~할 것으로 기대되다'. 정해진 문구가 있다는 뜻이다.", "g"], ["generally not welcomed by", "수동·부정의 분사구문", "(being) generally not welcomed ~. 앞 절을 보충하는 분사구문으로, 부정어 not이 분사 앞에 온다.", "g"], ["would be disturbing", "가정의 would", "실제로 일어난 일이 아니라 '만약 그렇게 말하면'이라는 가정 아래의 결과라서 would를 썼다.", "g"]]}]], "choices": [["Ritual, Formal Performance and Culture", false, "열쇠말을 나열만 했다. '새로움이 금지된다'는 핵심 주장이 빠졌다."], ["Novelty Is Not Welcomed in a Formal Ritual", true, "정답. 즉흥(새로움)은 비공식 공연에서만 허용되고 공식 의식에서는 금지된다는 요지를 그대로 담았다."], ["Ritual Performance: Its Origin and Functions", false, "기원은 전혀 다루지 않았다. 기능도 '정확히 해야 한다'는 조건 하나만 언급된다."], ["Is It Necessary to Protect Tradition in Rituals?", false, "필요성을 묻거나 주장하는 글이 아니다. 실제로 그렇다는 사실을 설명하는 글이다."], ["Novelty and Convention in Ritual Performances", false, "새로움과 관습을 나란히 놓았지만, 글은 새로움이 '거부된다'는 한쪽으로 기울어 있다."]], "flow": ["도입 — 미국에서는 창의성 = 새로움·독창성", "반전 — 그러나 새로움의 가치가 모든 문화에서 공유되는 것은 아니다", "대조 — 즉흥은 비공식 공연에서만, 공식 공연에서는 금지", "이유 — 의식은 정확히 수행되어야 초자연적 기능을 하기 때문", "예시 — 결혼식 선서를 창의적으로 바꾸면 환영받지 못한다"], "bg": "인류학에서 의식(ritual)은 정해진 순서와 말을 반복함으로써 힘을 얻는 행위로 본다. 애국가나 국기에 대한 경례를 가사나 동작을 바꿔서 하면 어색해지는 것과 같은 원리다. 창의성이 늘 미덕인 것은 아니며, 상황에 따라 '정해진 대로 하는 것'이 더 큰 가치를 갖는다는 점을 학생들과 이야기해 볼 만하다.", "quiz": [{"q": "글에 따르면 즉흥적 행위가 허용되는 곳은?", "opts": ["공식적 공연", "비공식적 공연", "종교 의식"], "a": 1, "exp": "improvisation is allowed only in informal performances — 비공식 공연에서만 허용된다."}, {"q": "의식에서 즉흥이 금지되는 이유는?", "opts": ["관객이 지루해하기 때문", "정확히 수행되어야 기능을 하기 때문", "법으로 금지되어 있기 때문"], "a": 1, "exp": "a ritual can only perform its supernatural function if performed exactly."}]}, {"no": 2902, "dn": "2", "label": "DAY 29 · 2번", "type": "밑줄 어휘", "answer": 5, "q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "subject": "소수 민족 우대 제도의 양면성", "vocab": [["legislation", "법률, 법률 제정", 2, "📜", "Despite the widespread adoption of anti-discrimination legislation …", "n"], ["noticeable", "두드러지는, 눈에 띄는", 4, "👁️", "This is particularly noticeable in employment …", "a"], ["exclusively", "독점적으로, 배타적으로", 7, "🔒", "the top positions are occupied almost exclusively by members of the dominant ethnic group.", "ad"], ["quota", "할당량, 몫", 12, "📊", "India … operates a system of quotas in educational places and companies …", "n"], ["vacancy", "공석, 결원", 15, "🪑", "applicants from minority ethnic groups are given preference for vacancies.", "n"], ["scheme", "(운영) 제도, 계획", 16, "🗂️", "However, these schemes have been accused of unfairly tipping the balance …", "n"], ["prejudice", "편견", 18, "🚫", "… run the risk of increasing prejudice against minority ethnic groups …", "n"]], "pages": [[{"en": "Despite the widespread adoption of anti-discrimination legislation, minority ethnic groups are still at a ① disadvantage in many areas of life.", "key": 1, "g": [["Despite the widespread adoption", "Despite + 명사구", "'~에도 불구하고'. 뒤에 절이 아니라 명사구가 온다. although와 구별.", "g"], ["① disadvantage", "① 적절", "법이 있는데도 '여전히(still)' 불리하다는 흐름. at a disadvantage(불리한 처지에)는 굳어진 표현이다.", "v"]]}, {"en": "This is particularly noticeable in employment, where minorities are more than statistically likely to be in lower-paid or unwanted jobs, and the top positions are occupied almost exclusively by members of the ② dominant ethnic group.", "g": [["where minorities are", "계속적 용법의 관계부사", "employment를 보충 설명한다. in which로 바꿔 쓸 수 있고, 이 절 안에서 두 개의 절이 and로 병렬된다.", "g"], ["② dominant", "② 적절", "소수 민족이 불리하다면 고위직은 '지배적인' 다수 집단이 차지하는 것이 자연스럽다.", "v"]]}, {"en": "Legislation is clearly not effective in preventing discrimination, so some countries have used a system of ③ positive discrimination to try to correct the inequality.", "key": 1, "g": [["③ positive discrimination", "③ 적절", "'긍정적 차별' = 소수 집단을 의도적으로 우대하는 제도. 불평등을 바로잡으려는(correct) 수단이므로 맞다.", "v"], ["to try to correct", "목적의 to부정사", "'바로잡으려 노력하기 위해'. 제도를 도입한 목적을 나타낸다.", "g"]]}, {"en": "For example, India, which has a very ethnically diverse population, operates a system of quotas in educational places and companies for the various ethnic groups; elsewhere, applicants from minority ethnic groups are given ④ preference for vacancies.", "g": [["which has a very ethnically diverse population", "삽입된 관계사절", "India를 보충 설명하는 계속적 용법. 주어 India와 동사 operates 사이에 끼어 있다.", "g"], ["are given ④ preference", "④ 적절 / 4형식 수동", "give A B의 수동태. 소수 민족 지원자가 '우선권'을 받는 것이 긍정적 차별의 예다.", "v"]]}, {"en": "However, these schemes have been accused of unfairly tipping the balance, and run the risk of increasing prejudice against minority ethnic groups, although they have played a part in ⑤ deepening inequalities.", "key": 1, "g": [["However", "부작용으로의 전환", "제도의 취지에서 부작용(비난, 편견 증가)으로 넘어간다.", "v"], ["have been accused of", "be accused of + v-ing", "'~로 비난받다'. of 뒤에 동명사 tipping이 왔다.", "g"], ["run the risk of increasing", "run the risk of v-ing", "'~할 위험이 있다'. have been accused와 and로 병렬된 두 번째 동사구다.", "v"], ["⑤ deepening", "⑤ 문맥상 틀림 → resolving", "although(~에도 불구하고)는 앞뒤가 반대여야 한다. 비난받는데도 불평등을 '해소하는' 역할은 했다는 뜻이어야 하므로 deepening(악화시키는)이 아니라 resolving이 맞다.", "v"]]}]], "choices": [["disadvantage", false, "법이 있어도 소수 민족은 여전히 '불리한' 처지다. 문맥에 맞다."], ["dominant", false, "고위직을 차지하는 쪽은 '지배적인' 다수 민족이다. 맞다."], ["positive discrimination", false, "불평등을 바로잡기 위한 '긍정적 차별(우대 제도)'이다. 맞다."], ["preference", false, "소수 민족 지원자에게 '우선권'을 주는 것이 우대 제도의 예다. 맞다."], ["deepening", true, "정답. although는 반대 내용을 연결한다. 비난을 받지만 그래도 불평등을 '해소하는(resolving)' 역할은 했다는 뜻이어야 한다."]], "flow": ["문제 — 차별 금지법이 있어도 소수 민족은 여전히 불리하다", "예 — 취업: 저임금 직업에 몰리고 고위직은 다수 민족이 차지", "대책 — 법이 효과가 없으니 '긍정적 차별' 도입 (인도의 할당제, 우선권)", "부작용 — 부당하게 이득을 준다는 비난, 편견 증가 위험 (단, 불평등 해소에는 기여)"], "bg": "긍정적 차별(positive discrimination)은 미국에서는 affirmative action이라고 부르며, 역사적으로 불리했던 집단에 입학·채용 기회를 우선 배정하는 제도다. 인도는 헌법으로 특정 계층에 대학 정원과 공직의 일부를 할당한다. 취지는 좋지만 '역차별'이라는 반발도 커서 늘 논쟁이 되는 주제다.", "quiz": [{"q": "글에서 인도가 운영하는 제도는?", "opts": ["소수 민족 이민 제한", "교육·기업의 할당제", "차별 금지법 폐지"], "a": 1, "exp": "India … operates a system of quotas in educational places and companies for the various ethnic groups."}, {"q": "긍정적 차별 제도가 받는 비난은?", "opts": ["효과가 전혀 없다", "부당하게 이득을 준다", "비용이 너무 많이 든다"], "a": 1, "exp": "these schemes have been accused of unfairly tipping the balance."}]}, {"no": 2903, "dn": "3", "label": "DAY 29 · 3번", "type": "빈칸 추론", "answer": 1, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "You’ll be more creative if ▢.", "subject": "제약이 창의성을 키운다", "vocab": [["domain", "영역, 분야", 1, "🗺️", "In many domains, there are issues that have not yet been resolved …", "n"], ["pose a question", "문제를 제기하다", 2, "❓", "… questions that have not yet been posed …", "phr"], ["give A free rein", "A에게 자유를 주다", 5, "🐎", "when people are given free rein to solve a problem …", "phr"], ["cognition", "인식, 인지", 8, "🧠", "This is due to the fundamental nature of human cognition …", "n"], ["hinder", "방해하다", 10, "🚧", "Such freedom can hinder creativity …", "v"], ["constraint", "제약, 제한", 11, "⛓️", "… the strategic use of constraints can promote creativity.", "n"], ["preclude", "제외하다, 배제하다", 12, "🚪", "By using constraints, reliable responses are precluded …", "v"]], "pages": [[{"en": "In many domains, there are issues that have not yet been resolved, questions that have not yet been posed, and problems that have no obvious solution.", "g": [["that have not yet been resolved", "관계대명사절의 병렬", "issues, questions, problems를 각각 that절이 수식한다. 세 개의 명사구가 나열된 구조다.", "g"]]}, {"en": "These “ill-structured” problems require a creative approach.", "g": [["These “ill-structured” problems", "지시어 These", "앞 문장의 세 종류 문제를 한 번에 받는다.", "v"]]}, {"en": "Paradoxically, when people are given free rein to solve a problem, they tend to be wholly uncreative, focusing on what’s worked best in the past.", "key": 1, "g": [["Paradoxically", "역설의 신호", "예상과 반대: 자유를 주면 오히려 창의성이 사라진다. 빈칸의 방향을 정하는 단어다.", "v"], ["are given free rein to solve", "4형식 수동 + to부정사", "give A free rein(A에게 자유를 주다)의 수동태. to solve는 free rein을 수식하는 형용사적 용법이다.", "g"], ["focusing on what’s worked best", "분사구문 + 관계대명사 what", "as they focus on ~ 의 분사구문. what은 '~한 것'으로 선행사를 포함한다.", "g"]]}, {"en": "This is due to the fundamental nature of human cognition: to imagine the future we generate what we already know from the past.", "g": [["due to", "원인의 due to", "'~ 때문에'. 자유가 왜 비창의적 결과를 낳는지 원인을 댄다.", "v"], ["to imagine the future", "목적의 to부정사", "문장 앞에 나온 부사적 용법. '미래를 상상하기 위해서'.", "g"]]}], [{"en": "Such freedom can hinder creativity, whereas the strategic use of constraints can promote creativity.", "key": 1, "g": [["whereas", "대조의 접속사", "자유 = 방해 ↔ 제약 = 촉진. 이 대조가 빈칸의 정답을 결정한다.", "v"], ["the strategic use of constraints", "핵심 명사구", "'제약의 전략적 사용'. 정답 ①의 '정신이 자유롭게 배회하지 못하게 하는 것'과 같은 말이다.", "v"]]}, {"en": "By using constraints, reliable responses are precluded and novel surprising ones are encouraged.", "g": [["By using constraints", "by + v-ing", "'~함으로써'. 수단을 나타낸다.", "g"], ["ones", "대명사 ones", "responses를 대신한다. reliable responses ↔ novel surprising ones.", "v"]]}, {"en": "You’ll be more creative if ______.", "key": 1, "g": [["if ______", "빈칸의 조건", "창의적이 되는 조건이 들어간다. 글 전체가 '자유 대신 제약'을 말했으므로 '정신이 자유롭게 돌아다니지 못할 때'가 답이다.", "v"]]}]], "choices": [["your mind is not allowed to roam free", true, "정답. 자유가 창의성을 방해하고 제약이 촉진한다고 했다. 정신이 자유롭게 배회하지 못하게 하는 것 = 제약이다."], ["you keep exposing yourself to new experiences", false, "새로운 경험에 대한 언급은 없다. 글의 열쇠말은 '제약'이다."], ["your mind refers to the reaction of those around you", false, "주변 사람의 반응은 글에 나오지 않는다."], ["you don’t allow yourself to fall for the easiest solution", false, "그럴듯하지만 글은 '가장 쉬운 해법을 피하라'가 아니라 '제약을 두라'고 말한다."], ["you start questioning or being curious about everything", false, "호기심이나 의문 제기는 글의 내용과 무관하다."]], "flow": ["도입 — 해결되지 않은 '비구조화' 문제는 창의적 접근이 필요하다", "역설 — 자유를 주면 사람들은 오히려 과거에 통했던 것에 매달린다", "이유 — 인간 인식은 미래를 상상할 때도 과거 지식을 꺼내 쓴다", "대조 — 자유는 창의성을 방해하고, 전략적 제약은 촉진한다", "결론(빈칸) — 정신이 자유롭게 배회하지 못하게 할 때 더 창의적이 된다"], "bg": "'제약이 창의성을 낳는다'는 창의성 연구의 오랜 주제다. 백지를 주고 '아무거나 그려'라고 하면 막막하지만, '동그라미 세 개로 동물을 그려'라고 하면 아이디어가 쏟아진다. 하이쿠나 소네트 같은 정형시가 엄격한 규칙 속에서 오히려 풍부한 표현을 만들어 내는 것도 같은 원리다. 글쓰기 과제에 조건을 붙이는 이유를 설명할 때 활용할 수 있다.", "quiz": [{"q": "사람들에게 문제 해결의 자유가 주어지면 어떻게 되는가?", "opts": ["매우 창의적이 된다", "과거에 통했던 방법에 집중한다", "문제를 포기한다"], "a": 1, "exp": "they tend to be wholly uncreative, focusing on what’s worked best in the past."}, {"q": "제약을 사용하면 어떤 반응이 촉진되는가?", "opts": ["의지할 수 있는 익숙한 반응", "새
