, and your experiences."}]}, {"no": 3303, "dn": "3", "label": "DAY 33 · 3번", "type": "문장 넣기", "answer": 5, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "given": "But they reduce the likelihood of accumulating greater benefits from exchange and cooperation with the same partner (and perhaps others) in the future.", "subject": "진실성은 단기·장기 이득의 저울질", "vocab": [["likelihood", "가능성", 1, "🎲", "But they reduce the likelihood of accumulating greater benefits …", "n"], ["accumulate", "축적하다, 쌓다", 1, "📚", "… the likelihood of accumulating greater benefits from exchange and cooperation …", "v"], ["integrity", "진실성", 4, "🧭", "Most people use reputation as a proxy for integrity.", "n"], ["trait", "특성", 6, "🧬", "Contrary to common belief, integrity isn’t a stable trait …", "n"], ["wrestle", "씨름하다, 몸싸움을 벌이다", 9, "🤼", "… the notion that people wrestle with “good” and “evil” impulses.", "v"], ["dictate", "좌우하다, 결정하다", 14, "👑", "And it’s the trade-off between them that typically dictates integrity at any given moment.", "v"], ["reap", "거두다, 수확하다", 17, "🌾", "… may reap an immediate reward.", "v"]], "pages": [[{"en": "Most people use reputation as a proxy for integrity.", "g": [["use reputation as a proxy for", "use A as B", "'A를 B로 사용하다'. 평판을 보고 그 사람이 진실한지 판단한다는 통념이다.", "g"]]}, {"en": "But there’s a problem with such a strategy.", "g": [["But there’s a problem", "문제 제기", "통념(평판 = 진실성)에 대한 반박이 시작된다.", "v"]]}, {"en": "Contrary to common belief, integrity isn’t a stable trait: Someone who has been fair and honest in the past won’t necessarily be fair and honest in the future.", "key": 1, "g": [["Contrary to common belief", "대조의 전치사구", "'일반적인 믿음과 반대로'. 글의 요지가 이 문장에 있다: 진실성은 고정된 성격이 아니다.", "v"], ["won’t necessarily be", "부분 부정", "not necessarily는 '반드시 ~한 것은 아니다'. 과거의 정직이 미래를 보장하지 않는다.", "g"]]}, {"en": "( ① ) To understand why, we need to abandon the notion that people wrestle with “good” and “evil” impulses.", "g": [["( ① )", "①의 판단", "넣을 수 없다. 주어진 문장의 they(신뢰를 깨는 사람들)가 받을 대상이 없다. 여기는 '왜 그런지' 설명을 시작하는 자리다.", "v"], ["the notion that people wrestle with", "동격의 that", "notion의 내용을 that절이 설명한다. '사람들이 ~와 씨름한다는 개념'.", "g"]]}], [{"en": "( ② ) Except in cases of serious psychopathology, their brains don’t work that way, and, rather, they focus on two types of gains: short-term and long-term.", "key": 1, "g": [["( ② )", "②의 판단", "넣을 수 없다. 선악이 아니라 '두 가지 이득'으로 판단한다는 새 틀을 제시하는 문장이다. 아직 신뢰를 깨는 사람들이 나오지 않았다.", "v"], ["two types of gains: short-term and long-term", "콜론의 구체화", "콜론 뒤에서 두 유형을 밝힌다. 주어진 문장의 '즉각적 보상 vs 미래의 더 큰 이익' 구도가 여기서 예고된다.", "v"]]}, {"en": "( ③ ) And it’s the trade-off between them that typically dictates integrity at any given moment.", "key": 1, "g": [["( ③ )", "③의 판단", "넣을 수 없다. And로 앞 문장의 두 이득을 them으로 받아 그 저울질이 진실성을 결정한다고 정리한다. 앞뒤가 긴밀하다.", "v"], ["it’s the trade-off between them that", "It is ~ that 강조구문", "the trade-off between them(두 이득 사이의 균형)을 강조한다. '바로 ~이 진실성을 좌우한다'.", "g"]]}, {"en": "( ④ ) Individuals who break a trust — by promising work they won’t or can’t deliver, for instance — may reap an immediate reward.", "key": 1, "g": [["( ④ )", "④의 판단", "넣을 수 없다. 주어진 문장의 they가 받을 '신뢰를 깨는 사람들'이 바로 이 문장에서 처음 나온다. 주어진 문장은 이 문장 뒤여야 한다.", "v"], ["by promising work they won’t or can’t deliver", "관계사 생략 + 조동사 병렬", "work (that) they won’t or can’t deliver. deliver는 '(약속을) 지키다'. won’t와 can’t가 or로 병렬되었다.", "g"], ["may reap an immediate reward", "단기 이득", "'즉각적인 보상을 거둘 수 있다'. 주어진 문장의 But이 이 단기 이득을 뒤집는다.", "v"]]}, {"en": "( ⑤ ) Which outcome is better for them depends on the situation and the parties involved.", "g": [["( ⑤ )", "⑤의 판단 — 정답", "앞 문장은 신뢰를 깨면 '즉각적 보상'(단기 이득), 주어진 문장은 But '미래의 더 큰 이익 가능성이 줄어든다'(장기 손실). 그래야 이 문장의 Which outcome(두 결과 중 어느 쪽)이 성립한다.", "v"], ["Which outcome is better for them depends on", "간접의문문 주어", "Which outcome is better for them이 주어(명사절), depends가 동사. 단수 취급하므로 depends.", "g"], ["the parties involved", "과거분사 후치 수식", "involved가 the parties를 뒤에서 수식한다. '관련된 당사자들'.", "g"]]}]], "choices": [["( ① ) — To understand why, we need to abandon ome(두 결과)이 결정적 단서다.", "quiz": [{"q": "글에 따르면 사람들의 두뇌는 무엇에 집중하는가?", "opts": ["선과 악의 충동", "단기 이득과 장기 이득", "평판과 명성"], "a": 1, "exp": "they focus on two types of gains: short-term and long-term."}, {"q": "신뢰를 깨는 사람들이 얻는 것과 잃는 것은?", "opts": ["즉각적 보상을 얻고, 미래의 더 큰 이익 가능성을 잃는다", "평판을 얻고, 돈을 잃는다", "아무것도 얻지 못하고 신뢰만 잃는다"], "a": 0, "exp": "may reap an immediate reward. But they reduce the likelihood of accumulating greater benefits ~ in the future."}]}, {"no": 3304, "dn": "4~5", "label": "DAY 33 · 4~5번", "type": "장문 (제목 · 어휘)", "answer": 5, "q": "윗글의 제목으로 가장 적절한 것은?", "q2": "밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "answer2": 4, "subject": "변화를 받아들이는 정서적 유연성", "vocab": [["paradox", "역설", 1, "🔄", "The ancient Greek master of paradox, Heraclitus, said that you can never step into the same river twice.", "n"], ["make the most of", "~을 최대한 활용하다", 5, "💎", "To make the most of it, we must continually break down old categories and (a) formulate new ones.", "phr"], ["formulate", "만들어 내다, 공식화하다", 6, "🧪", "… we must continually break down old categories and (a) formulate new ones.", "v"], ["cornerstone", "토대, 주춧돌", 10, "🧱", "This is a cornerstone of emotional flexibility.", "n"], ["lose sight of", "~을 놓치다, 잊다", 18, "🙈", "… we can become trapped in that identity and lose sight of other aspects of ourselves.", "phr"], ["adaptability", "융통성, 적응성", 22, "🦎", "We need adaptability to ensure that we can change too.", "n"], ["authentic", "진정한, 진짜의", 30, "🌟", "… helping you lead a more fulfilling and authentic life.", "a"]], "pages": [[{"en": "The ancient Greek master of paradox, Heraclitus, said that you can never step into the same river twice.", "g": [["The ancient Greek master of paradox, Heraclitus,", "동격", "Heraclitus가 앞의 긴 명사구와 동격이다. 콤마로 둘러싸여 삽입되었다.", "g"]]}, {"en": "It means that the world is constantly changing and thus always presenting us with new opportunities and situations.", "key": 1, "g": [["is constantly changing and thus always presenting", "진행형의 병렬", "is 뒤에 changing과 presenting이 and로 병렬된다. present A with B는 'A에게 B를 제시하다'. '세상은 늘 변한다'가 글의 전제다.", "g"]]}, {"en": "To make the most of it, we must continually break down old categories and (a) formulate new ones.", "g": [["(a) formulate", "(a) 적절", "낡은 범주를 '허물고(break down)' 새 범주를 '만들어 낸다'. 대조가 자연스러우므로 맞다. ones = categories.", "v"]]}, {"en": "The most original and interesting solutions often come when we embrace “the beginner’s mind”, approaching novel experiences with (b) fresh eyes.", "g": [["approaching novel experiences", "분사구문", "and approach ~ 를 줄인 형태. novel은 여기서 '새로운'(형용사)이다.", "g"], ["(b) fresh", "(b) 적절", "'초심자의 마음'으로 새 경험을 대하는 시각은 '신선한' 눈이어야 한다. 맞다.", "v"]]}, {"en": "This is a cornerstone of emotional flexibility.", "key": 1, "g": [["a cornerstone of emotional flexibility", "제목의 열쇠말", "글의 중심 개념 emotional flexibility(정서적 유연성)가 처음 등장한다. 제목 ⑤가 이 표현을 담고 있다.", "v"]]}], [{"en": "Some of us tend to limit ourselves to narrow, predefined categories or identities, failing to recognize our own worth as an individual, seeing ourselves (c) exclusively as a rich person or a fat person.", "key": 1, "g": [["limit ourselves to narrow, predefined categories", "limit A to B", "'A를 B에 제한하다'. 유연성의 반대, 곧 문제 상황이다.", "g"], ["failing to recognize", "결과의 분사구문", "'그 결과 ~을 인식하지 못하고'. 뒤의 seeing ~ 도 같은 결과의 분사구문이다.", "g"], ["(c) exclusively", "(c) 적절", "좁은 범주에 자신을 제한하는 사람은 자신을 '오로지' 부자나 뚱뚱한 사람으로만 본다. 문맥에 맞다.", "v"]]}, {"en": "If we self-categorize based on a particular identity, such as being a “CEO”, “Olympic athlete”, or “the smartest kid in the class”, we can become trapped in that identity and lose sight of other aspects of ourselves.", "g": [["become trapped in that identity", "become + p.p.", "'그 정체성에 갇히게 되다'. (d)의 판단 근거: 특정 역할에 자신을 '가두는' 것이 문제다.", "v"]]}, {"en": "This can also occur when we (d) liberate ourselves to specific roles like “the responsible one” in a family or “the funny one” in a group of friends.", "g": [["This can also occur", "This의 지시 대상", "This = 정체성에 갇혀 다른 면을 놓치는 것. also로 같은 현상의 또 다른 경우를 든다.", "v"], ["(d) liberate", "(d) 문맥상 틀림 → confine", "앞 문장과 '같은 현상(This ~ also)'이 일어나려면 특정 역할에 자신을 '국한시킬(confine)' 때여야 한다. '해방시키다(liberate)'는 정반대이고, liberate ~ to라는 결합도 어색하다.", "v"]]}], [{"en": "We need adaptability to ensure that we can change too.", "key": 1, "g": [["we can change too", "too의 의미", "'우리도' 바뀔 수 있다. 세상이 변하듯(첫 단락) 우리도 변해야 한다는 뜻이다.", "v"]]}, {"en": "In fact, emotional flexibility means the ability to regulate your emotions and respond adaptively to changing situations, rather than being controlled by conditioned or mindless emotional reactions.", "key": 1, "g": [["the ability to regulate your emotions and respond adaptively", "to부정사 병렬", "the ability와 동격인 to부정사. regulate와 (to) respond가 and로 병렬되며, 반복되는 to는 생략되었다.", "g"], ["rather than being controlled by", "A rather than B", "'B보다는 오히려 A'. 전치사 than 뒤이므로 동명사 being이 왔다.", "g"]]}, {"en": "By practicing it, you can respond more effectively to present circumstances and act in (e) accordance with your values and goals, helping you lead a more fulfilling and authentic life.", "g": [["(e) accordance", "(e) 적절", "in accordance with(~에 부합되게). 자기 가치관과 목표에 맞게 행동한다는 긍정적 결과이므로 맞다.", "v"], ["helping you lead", "결과의 분사구문 + help O 동사원형", "'그 결과 당신이 ~한 삶을 살도록 도우면서'. help의 목적격보어로 동사원형 lead가 왔다.", "g"]]}]], "choices": [["Learn from Difficult Emotions and Respond with Clarity", false, "'어려운 감정에서 배우라'는 내용은 없다. 감정 조절은 유연성의 일부로만 언급된다."], ["Emotional Rigidity: How to Live in a Changing World", false, "rigidity(경직)는 정반대다. 글은 유연성(flexibility)을 권한다."], ["Maximize Your Potential through Self-Discovery", false, "자기 발견이나 잠재력 극대화가 아니라, 변화하는 세상에 맞춰 '나도 변하는' 능력이 주제다."], ["How to Let Go of Old Identities and Move Forward", false, "낡은 정체성에 갇히지 말라는 것은 글의 한 부분(둘째 단락)이다. 전체를 아우르는 개념은 정서적 유연성이다."], ["Embracing Change: The Power of Emotional Flexibility", true, "정답. 세상은 늘 변하고(첫 단락) → 정체성에 갇히면 안 되고(둘째 단락) → 우리도 변할 수 있어야 한다(셋째 단락). 그 능력이 emotional flexibility다."]], "choices2": [["(a) formulate", false, "낡은 범주를 허물고 새 범주를 '만들어 낸다'. 맞다."], ["(b) fresh", false, "초심자의 마음 = '신선한' 시각. 맞다."], ["(c) exclusively", false, "좁은 범주에 갇힌 사람은 자신을 '오로지' 한 가지로 본다. 맞다."], ["(d) liberate", true, "정답. 앞 문장의 '정체성에 갇힘'과 같은 현상(This ~ also)이므로 특정 역할에 자신을 '국한시킬(confine)' 때여야 한다. '해방시키다'는 반대다."], ["(e) accordance", false, "가치관과 목표에 '부합되게' 행동한다. 맞다."]], "flow": ["도입 — 헤라클레이토스: 같은 강에 두 번 들어갈 수 없다 = 세상은 끊임없이 변한다", "대응 — 낡은 범주를 허물고 새 범주를 만들며 '초심자의 마음'으로 접근 → 정서적 유연성의 토대", "문제 — 자신을 좁은 정체성('CEO', '반에서 제일 똑똑한 아이', '책임 있는 사람')에 국한하면 다른 면을 놓친다", "주장 — 우리도 변할 수 있어야 한다: 정서적 유연성 = 습관적 반응 대신 감정을 조절하고 상황에 적응하는 능력", "결론 — 이를 실천하면 가치관에 맞게 행동하고 더 충족된 삶을 살 수 있다"], "bg": "헤라클레이토스의 '만물은 흐른다(panta rhei)'는 세상의 본질이 변화라는 사상이다. '초심자의 마음'은 일본 선불교의 스즈키 순류가 쓴 표현으로, 전문가처럼 다 안다고 여기지 않고 처음 배우는 사람처럼 열린 태도를 갖는 것이다. 심리학에서는 하나의 정체성에 자신을 가두는 것을 '정체성 융합'이라 부르며, 그 역할을 잃었을 때 크게 흔들리는 원인으로 본다. 학생들에게 '나는 ~인 사람'이라는 꼬리표가 스스로를 좁히지 않는지 생각해 보게 할 만한 글이다.", "quiz": [{"q": "글에서 '정서적 유연성'의 뜻으로 제시한 것은?", "opts": ["어떤 상황에서도 감정을 드러내지 않는 것", "감정을 조절하고 변화하는 상황에 적응해 반응하는 능력", "다른 사람의 감정에 공감하는 능력"], "a": 1, "exp": "emotional flexibility means the ability to regulate your emotions and respond adaptively to changing situations."}, {"q": "특정 정체성에 근거해 자신을 분류할 때 생기는 문제는?", "opts": ["다른 사람들이 우리를 싫어한다", "그 정체성에 갇혀 자신의 다른 면을 놓친다", "새로운 기회가 줄어든다"], "a": 1, "exp": "we can become trapped in that identity and lose sight of other aspects of ourselves."}]}, {"no": 3401, "dn": "1", "label": "DAY 34 · 1번", "type": "글의 요지", "answer": 2, "q": "다음 글의 요지로 가장 적절한 것은?", "subject": "철학과 과학은 서로 얽혀 있다", "vocab": [["tempting", "유혹적인, 매력적인", 1, "🍎", "It’s tempting to see a strong dividing line between philosophy and science.", "a"], ["concrete", "구체적인", 3, "🧱", "… science is precise and defined by proven, concrete facts …", "a"], ["speculation", "추측", 4, "💭", "… philosophy goes beyond the facts and into areas of speculation that probably can never be proven.", "n"], ["considerable", "상당한", 5, "📏", "Still, there is considerable overlap.", "a"], ["overlap", "공통부분, 겹침", 5, "⭕", "Still, there is considerable overlap.", "n"], ["inquiry into", "~에 대한 탐구", 9, "🔍", "The scientific method itself grew out of philosophical inquiry into the natures of meaning, truth, and knowledge …", "n"], ["in a vacuum", "외부와 단절된 상태에서", 15, "🫙", "… but neither science nor philosophy exists in a vacuum.", "phr"]], "pages": [[{"en": "It’s tempting to see a strong dividing line between philosophy and science.", "g": [["It’s tempting to see", "가주어 - 진주어", "It이 가주어, to see 이하가 진주어. '~하고 싶어진다'. 필자가 뒤에서 뒤집을 통념(둘은 별개다)을 먼저 제시한다.", "g"]]}, {"en": "After all, science is precise and defined by proven, concrete facts, whereas philosophy goes beyond the facts and into areas of speculation that probably can never be proven.", "g": [["After all", "이유 보충", "'어쨌든, 결국'. 앞 문장의 통념이 그럴듯해 보이는 이유를 덧붙인다.", "v"], ["whereas philosophy goes beyond", "대조의 whereas", "'~인 반면'. 과학(증명된 사실) ↔ 철학(증명 불가능한 추측)을 대조한다.", "v"], ["that probably can never be proven", "주격 관계대명사절", "areas of speculation을 수식한다. can never be proven은 조동사 수동태.", "g"]]}, {"en": "Still, there is considerable overlap.", "key": 1, "g": [["Still", "반전의 연결어", "'그래도, 그럼에도'. 통념을 뒤집는 지점이다. 이 뒤가 요지다.", "v"]]}, {"en": "Science may rely on cold, hard facts, but its directions have been determined by philosophy more than by any other area of study.", "key": 1, "g": [["may rely on cold, hard facts, but", "may ~, but …", "'~일지 모르지만 …'. 양보 뒤에 진짜 하고 싶은 말이 온다.", "v"], ["more than by any other area of study", "비교급 + than any other", "'다른 어떤 학문 영역보다도 더'. 최상급의 뜻이다. 철학이 과학의 방향을 가장 많이 결정했다.", "g"]]}], [{"en": "The scientific method itself grew out of philosophical inquiry into the natures of meaning, truth, and knowledge, and these inquiries continue today in the fields of philosophy.", "g": [["The scientific method itself", "재귀대명사의 강조 용법", "itself가 주어를 강조한다. '과학적 방법 그 자체가'.", "g"], ["grew out of", "grow out of", "'~에서 자라나다, 비롯되다'. 과학적 방법의 뿌리가 철학이라는 근거다.", "v"]]}, {"en": "At the same time, the philosophy of ethics determines the types of experiments we allow our scientists to carry out.", "g": [["At the same time", "추가의 연결어", "'동시에'. 철학이 과학에 영향을 주는 두 번째 예(윤리)를 더한다.", "v"], ["the types of experiments we allow our scientists to carry out", "관계사 생략 + allow O to-v", "experiments (which) we allow our scientists to carry out. allow A to-v는 'A가 ~하도록 허용하다'.", "g"]]}, {"en": "In the end, one may be concerned with observable data and the other with meanings and values, but neither science nor philosophy exists in a vacuum.", "key": 1, "g": [["one may be concerned with observable data and the other with", "one ~ the other / 생략", "둘 중 하나(one = 과학)와 나머지(the other = 철학). the other 뒤에 may be concerned가 생략되었다.", "g"], ["neither science nor philosophy exists", "neither A nor B의 수 일치", "'A도 B도 아니다'. 동사는 B(philosophy, 단수)에 맞춰 exists. 요지: 둘은 서로 떨어져 존재하지 않는다.", "g"]]}]], "choices": [["철학과 과학은 사회 발전을 견인한다.", false, "사회 발전은 언급되지 않았다. 두 학문의 '관계'를 다룬 글이다."], ["철학과 과학은 서로 영향을 주고받는다.", true, "정답. 겉보기엔 별개지만 상당히 겹친다. 과학의 방향과 방법은 철학에서 나왔고, 윤리 철학이 실험의 범위를 정한다 — 어느 쪽도 진공 속에 존재하지 않는다."], ["현대 철학은 예전의 방법론을 탈피해야 한다.", false, "철학의 방법론 개혁은 나오지 않는다. 오히려 철학적 탐구가 오늘날에도 계속된다고 했다."], ["철학적 방법론은 과학적 방법론에 비해 한계가 있다.", false, "우열을 가리는 글이 아니다. 과학적 방법 자체가 철학에서 자라났다고 했다."], ["철학이 없는 과학은 필연적으로 윤리적 문제를 야기한다.", false, "윤리 철학이 실험 유형을 결정한다고는 했지만, 철학 없는 과학이 반드시 윤리 문제를 낳는다는 주장은 없다."]], "flow": ["통념 — 철학과 과학 사이에 뚜렷한 선을 긋고 싶어진다", "근거 — 과학은 증명된 사실, 철학은 증명 불가능한 추측", "반전(Still) — 그래도 상당히 겹친다: 과학의 방향은 철학이 결정해 왔다", "예 — 과학적 방법은 철학적 탐구에서 자라났고, 윤리 철학이 허용되는 실험을 정한다", "결론 — 관심 대상은 달라도 어느 쪽도 진공 속에 존재하지 않는다"], "bg": "근대 과학은 원래 '자연철학(natural philosophy)'이라 불렸고, 뉴턴의 대표작 제목도 『자연철학의 수학적 원리』였다. 관찰과 실험으로 지식을 검증한다는 과학적 방법 자체가 '무엇을 안다고 할 수 있는가'라는 인식론적 질문에서 나왔다. 오늘날에도 인간 배아 연구나 AI 실험의 허용 범위는 과학이 아니라 윤리학이 정한다는 점에서, 글의 주장은 현실과 맞닿아 있다.", "quiz": [{"q": "글에 따르면 과학의 방향을 가장 많이 결정해 온 것은?", "opts": ["수학", "철학", "기술"], "a": 1, "exp": "its directions have been determined by philosophy more than by any other area of study."}, {"q": "윤리 철학이 과학에서 결정하는 것은?", "opts": ["과학자들에게 허용되는 실험의 유형", "실험 결과의 해석", "과학자의 급여"], "a": 0, "exp": "the philosophy of ethics determines the types of experiments we allow our scientists to carry out."}]}, {"no": 3402, "dn": "2", "label": "DAY 34 · 2번", "type": "빈칸 추론", "answer": 3, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "So at least one function of the whistles is ▢.", "subject": "돌고래의 '이름' 휘파람", "vocab": [["vocalization", "발성", 1, "🔊", "Each dolphin has its own vocalization that is referred to as a signature whistle …", "n"], ["be referred to as", "~로 지칭되다", 1, "🏷️", "… its own vocalization that is referred to as a signature whistle …", "phr"], ["captive", "사로잡힌, 포획된", 5, "🏊", "… during studies of captive animals Vincent Janik and Peter Slater have shown that …", "a"], ["isolate", "고립시키다", 8, "🏝️", "… in situations where an animal has become isolated from the other members of its pod.", "v"], ["emit", "방출하다, 내다", 10, "📡", "… when they emit their signature whistle …", "v"], ["give away", "누설하다, 드러내다", 11, "📍", "… and thereby broadcast their identity and give away their location.", "phr"], ["reunite", "재결합하다", 12, "🤗", "Once the separated animals are reunited, signature whistle broadcasting stops.", "v"]], "pages": [[{"en": "Each dolphin has its own vocalization that is referred to as a signature whistle, and it will remain relatively unchanged throughout the animal’s relatively long lifetime.", "g": [["that is referred to as a signature whistle", "관계사절 + refer to A as B의 수동", "vocalization을 수식한다. refer to A as B(A를 B라고 부르다)의 수동태로, to가 남아 있는 점에 주의.", "g"], ["remain relatively unchanged", "remain + 형용사", "'변하지 않은 채로 남다'. 2형식 동사 remain의 보어로 과거분사형 형용사 unchanged가 왔다.", "g"]]}, {"en": "The whistles are used in a variety of behavioral contexts, but during studies of captive animals Vincent Janik and Peter Slater have shown that they are particularly commonly heard in situations where an animal has become isolated from the other members of its pod.", "key": 1, "g": [["particularly commonly heard", "빈칸의 단서 1", "'특히 흔히 들린다'. 어떤 상황에서? 바로 뒤의 '고립된 상황'이다. 휘파람의 기능이 무리와 관련됨을 암시한다.", "v"], ["where an animal has become isolated from", "관계부사 where", "situations를 수식한다. become isolated from은 '~로부터 고립되다'.", "g"]]}, {"en": "It is supposed that these animals effectively call out their “name” when they emit their signature whistle and thereby broadcast their identity and give away their location.", "key": 1, "g": [["It is supposed that", "가주어 + 수동", "'~라고 추정된다'. It이 가주어, that절이 진주어다.", "g"], ["emit their signature whistle and thereby broadcast", "동사의 병렬 + thereby", "when절 안에서 emit, broadcast, give away가 and로 병렬된다. thereby는 '그렇게 함으로써'.", "g"], ["give away their location", "빈칸의 단서 2", "고립된 돌고래가 '이름'을 외쳐 자기 위치를 알린다 = 무리에게 나를 찾아 달라는 신호다.", "v"]]}], [{"en": "Once the separated animals are reunited, signature whistle broadcasting stops.", "key": 1, "g": [["Once the separated animals are reunited", "접속사 once", "'일단 ~하면'. 조건의 부사절이므로 미래 대신 현재형 are reunited.", "g"], ["signature whistle broadcasting stops", "빈칸의 단서 3", "다시 만나면 멈춘다 → 휘파람의 목적은 무리와 다시 합치는 것, 곧 집단의 결속을 유지하는 것이다.", "v"]]}, {"en": "So at least one function of the whistles is ______.", "key": 1, "g": [["So at least one function", "결론의 So", "앞의 세 단서(고립될 때 많이 냄, 위치를 알림, 재결합하면 멈춤)를 종합한 결론이다.", "v"], ["is ______", "빈칸의 논리", "고립 → 휘파람 → 재결합 → 멈춤. 휘파람은 무리를 다시 모으는 역할이므로 '집단 응집력의 유지'다.", "v"]]}]], "choices": [["the warning of impending danger", false, "위험 경고가 아니다. 휘파람은 '고립'될 때 나오고, 위험이 아니라 재결합하면 멈춘다."], ["the defence of a group’s territory", false, "영역 방어는 언급이 없다. 휘파람은 무리 밖에서 무리를 찾는 신호다."], ["the maintenance of group cohesion", true, "정답. 무리에서 떨어졌을 때 '이름'을 외쳐 위치를 알리고, 다시 만나면 멈춘다. 곧 무리를 다시 모으는 기능이다."], ["the signature of aggressive behavior", false, "공격성과 무관하다. signature라는 단어만 같다."], ["the strategy for dealing with alienation", false, "그럴듯하지만 '소외감에 대처하는 전략'은 심리적 표현이다. 글은 물리적으로 떨어진 무리와 다시 합치는 '기능'을 말한다."]], "flow": ["도입 — 돌고래는 각자 평생 거의 변하지 않는 '특징적 휘파람'을 가진다", "연구 — 휘파람은 무리에서 고립된 상황에서 특히 자주 들린다", "추정 — 휘파람 = 자기 '이름'을 외쳐 정체와 위치를 알리는 것", "근거 — 무리와 다시 만나면 휘파람이 멈춘다", "결론(빈칸) — 휘파람의 한 기능은 집단 응집력의 유지다"], "bg": "큰돌고래는 생후 1년 안에 자기만의 '시그니처 휘슬'을 만들고 평생 거의 바꾸지 않는다. 연구자들은 이것이 사람의 이름에 가장 가까운 동물의 신호라고 본다. 실제로 야생 돌고래는 다른 개체의 시그니처 휘슬을 흉내 내어 그 개체를 '부르는' 것으로도 알려져 있다. 빈칸 문제로는 '고립될 때 낸다 / 위치를 알린다 / 재결합하면 멈춘다'라는 세 단서를 하나의 기능으로 묶는 것이 핵심이다.", "quiz": [{"q": "특징적 휘파람이 특히 자주 들리는 상황은?", "opts": ["먹이를 찾을 때", "무리의 다른 구성원들로부터 고립되었을 때", "새끼를 낳을 때"], "a": 1, "exp": "particularly commonly heard in situations where an animal has become isolated from the other members of its pod."}, {"q": "고립된 돌고래가 무리와 다시 만나면 어떻게 되는가?", "opts": ["휘파람이 더 커진다", "휘파람이 멈춘다", "휘파람의 종류가 바뀐다"], "a": 1, "exp": "Once the separated animals are reunited, signature whistle broadcasting stops."}]}, {"no": 3403, "dn": "3", "label": "DAY 34 · 3번", "type": "무관한 문장", "answer": 4, "q": "다음 글에서 전체 흐름과 관계 없는 문장은?", "subject": "노인에게 도움이 되는 말투는?", "vocab": [["component", "구성 요소", 1, "🧩", "Elderspeak is characterized by several components.", "n"], ["beneficial", "유익한", 2, "👍", "Which ones are beneficial for older adults and which ones are not helpful?", "a"], ["semantic", "의미의", 8, "📖", "… when the speaker reduced the grammatical complexity and used semantic elaboration.", "a"], ["elaboration", "상세한 말, 상술", 8, "🗒️", "Simpler grammar and semantic elaboration also helped older adults improve their accuracy …", "n"], ["reproduce", "재현하다", 10, "🗺️", "… when they had to reproduce the same route on a map of their own.", "v"], ["utterance", "발언, 발화", 12, "🗣️", "In contrast, shortening the length of the speaker’s utterances into two- and five-word sentences did not improve …", "n"], ["exaggerated", "과장된", 17, "🎭", "… which is characterized by slower speech, exaggerated intonation, higher pitch …", "a"]], "pages": [[{"en": "Elderspeak is characterized by several components.", "g": [["is characterized by", "be characterized by", "'~에 의해 특징지어지다'. 노인에게 말할 때 쓰는 말투(elderspeak)의 여러 요소가 있다는 도입이다.", "v"]]}, {"en": "Which ones are beneficial for older adults and which ones are not helpful?", "key": 1, "g": [["Which ones are beneficial", "글을 이끄는 질문", "ones = components. 글 전체가 이 질문(어떤 요소가 도움이 되고 안 되는가)에 답한다. 이 물음에서 벗어난 문장이 정답이다.", "v"]]}, {"en": "Kemper and Harden had older adults watch a videotape in which a speaker described a route that was also traced on a map.", "g": [["had older adults watch", "사역동사 have + O + 동사원형", "'노인들에게 ~을 보게 했다'. 목적격보어로 동사원형 watch가 왔다.", "g"], ["in which a speaker described a route", "전치사 + 관계대명사", "a videotape를 수식한다. 그 안의 that was also traced on a map은 a route를 수식하는 관계사절이다.", "g"]]}, {"en": "① The older adults reported that the instructions were easier to follow when the speaker reduced the grammatical complexity and used semantic elaboration.", "key": 1, "g": [["① The older adults reported", "① 흐름에 맞음", "도움이 되는 요소 1: 단순한 문법 + 의미 상세화. 질문에 대한 첫 번째 답이다.", "v"], ["easier to follow", "형용사 + to부정사", "'따라가기 더 쉬운'. to follow가 easier를 한정한다. instructions가 follow의 의미상 목적어다.", "g"]]}], [{"en": "② Simpler grammar and semantic elaboration also helped older adults improve their accuracy when they had to reproduce the same route on a map of their own.", "g": [["② Simpler grammar and semantic elaboration also", "② 흐름에 맞음", "같은 두 요소가 이해뿐 아니라 수행(지도 재현)에도 도움이 되었다. ①을 보강한다.", "v"], ["helped older adults improve", "help + O + 동사원형", "'노인들이 ~을 향상하도록 도왔다'. help의 목적격보어는 동사원형(또는 to부정사)이다.", "g"]]}, {"en": "③ In contrast, shortening the length of the speaker’s utterances into two- and five-word sentences did not improve the older adults’ comprehension of the instructions, nor did it improve their performance when they traced a map of their own.", "key": 1, "g": [["③ In contrast, shortening the length", "③ 흐름에 맞음 — 도움 안 되는 요소", "In contrast로 도움이 '안 되는' 요소로 넘어간다: 문장을 두세 단어로 짧게 끊는 것. 동명사구 shortening ~ sentences가 주어다.", "v"], ["nor did it improve", "nor 도치", "부정어 nor가 문두에 와서 「조동사 did + 주어 it + 동사 improve」로 도치되었다. '~도 향상하지 못했다'.", "g"]]}, {"en": "④ But elderspeak resembles speech used with children, which is characterized by slower speech, exaggerated intonation, higher pitch, increased loudness, repetitions, tag questions, and vocabulary and grammar simplifications.", "g": [["④ But elderspeak resembles speech used with children", "④ 무관 — 정답", "'어떤 요소가 도움이 되는가'라는 실험 결과 보고 중에 갑자기 노인 언어와 아동 언어의 유사성을 일반론으로 설명한다. But으로 연결될 반대 내용도 아니다. ④를 빼면 ③의 '도움 안 되는 요소' → ⑤ Also '또 다른 도움 안 되는 요소'가 매끄럽게 이어진다.", "v"]]}, {"en": "⑤ Also, the older listeners did not find that an extremely slow rate of speaking with many pauses or exaggerated prosody was helpful.", "key": 1, "g": [["⑤ Also, the older listeners did not find", "⑤ 흐름에 맞음", "Also로 도움이 안 되는 요소를 하나 더 덧붙인다: 아주 느린 말, 많은 멈춤, 과장된 운율. ③에 바로 이어지는 내용이다.", "v"], ["an extremely slow rate of speaking with many pauses or exaggerated prosody was", "긴 주어의 수 일치", "that절의 주어는 an extremely slow rate(단수)이므로 동사는 was. with ~ prosody는 수식어다.", "g"]]}]], "choices": [["The older adults reported that the instructions were easier to follow when the speaker reduced the grammatical complexity and used semantic elaboration.", false, "도움이 되는 요소(단순한 문법, 의미 상세화)를 보고한다. 질문에 대한 답이다."], ["Simpler grammar and semantic elaboration also helped older adults improve their accuracy when they had to reproduce the same route on a map of their own.", false, "같은 요소가 수행 정확성에도 도움이 되었다. ①을 보강한다."], ["In contrast, shortening the length of the speaker’s utterances into two- and five-word sentences did not improve the older adults’ comprehension of the instructions, nor did it improve their performance when they traced a map of their own.", false, "In contrast로 도움이 안 되는 요소(짧게 끊기)로 넘어간다. 흐름에 맞다."], ["But elderspeak resembles speech used with children, which is characterized by slower speech, exaggerated intonation, higher pitch, increased loudness, repetitions, tag questions, and vocabulary and grammar simplifications.", true, "정답. 실험 결과를 보고하는 흐름에서 벗어나 노인 언어와 아동 언어의 유사성을 일반적으로 설명한다. 이 문장을 빼면 ③과 ⑤가 '도움 안 되는 요소'로 자연스럽게 이어진다."], ["Also, the older listeners did not find that an extremely slow rate of speaking with many pauses or exaggerated prosody was helpful.", false, "Also로 도움이 안 되는 요소를 추가한다. ③과 짝을 이룬다."]], "flow": ["질문 — 노인 언어의 여러 요소 중 어떤 것이 노인에게 도움이 되고 어떤 것이 안 되는가?", "실험 — Kemper와 Harden: 노인들에게 경로 설명 영상을 보게 함", "도움 됨 — 단순한 문법 + 의미 상세화 → 이해도↑, 지도 재현 정확성↑", "도움 안 됨 — 문장을 두세 단어로 짧게 끊기 / 아주 느린 말, 많은 멈춤, 과장된 운율", "④ — 노인 언어는 아동 언어와 비슷하다는 일반론 → 실험 결과 보고와 무관"], "bg": "'노인 언어(elderspeak)'는 노인에게 말할 때 무의식적으로 쓰는 단순하고 느리며 높은 톤의 말투로, 아기에게 말하는 방식과 닮아 있어 당사자에게는 무례하게 느껴질 수 있다. Kemper의 연구는 그중 실제로 도움이 되는 것은 '문법을 단순화하고 내용을 풀어 설명하는 것'이지, 느리게 끊어 말하거나 과장된 억양을 쓰는 것이 아님을 보여 준다. 무관한 문장 문제로는 글이 '실험 결과 보고'라는 틀을 유지하는지 확인하면 ④가 드러난다.", "quiz": [{"q": "실험에서 노인들의 이해와 수행에 도움이 된 것은?", "opts": ["문장을 두세 단어로 짧게 끊는 것", "문법을 단순화하고 의미를 상세하게 설명하는 것", "아주 느리게 많이 멈추며 말하는 것"], "a": 1, "exp": "the instructions were easier to follow when the speaker reduced the grammatical complexity and used semantic elaboration."}, {"q": "도움이 되지 않았다고 한 것은?", "opts": ["지도를 함께 보여 주는 것", "의미를 상세하게 풀어 주는 것", "발언을 두 단어·다섯 단어 문장으로 줄이는 것"], "a": 2, "exp": "shortening the length of the speaker’s utterances into two- and five-word sentences did not improve the older adults’ comprehension."}]}, {"no": 3404, "dn": "4", "label": "DAY 34 · 4번", "type": "글의 순서", "answer": 5, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "subject": "정체성은 소속이 아니라 성취로", "vocab": [["critical", "중요한, 중대한", 1, "❗", "The freedom to choose one’s identity is critical …", "a"], ["liable", "~하기 쉬운, ~할 것 같은", 4, "⚠️", "“identification is more secure, less liable to be threatened, if it does not depend on accomplishment.”", "a"], ["absurd", "터무니없는, 불합리한", 6, "🙄", "But this is absurd.", "a"], ["ally", "협력자, 동맹", 11, "🤝", "They choose their careers, friendships, allies, mixing and matching pieces and styles.", "n"], ["forge", "구축하다, 형성하다", 13, "🔨", "Even their ethnic, racial, and national affiliations are forged in various ways …", "v"], ["essence", "핵심, 본질", 16, "💠", "Indeed, the ability to make one’s own self is the essence of freedom.", "n"], ["pit A against B", "A와 B를 싸우게 하다", 17, "⚔️", "A good society recognizes and does not pit roots and wings against one another.", "phr"]], "pages": [[{"label": "주어진 글", "en": "The freedom to choose one’s identity is critical, since the sources of identity are shifting from “belonging” to “achievement.” Speaking for many, Kymlicka says that “identification is more secure, less liable to be threatened, if it does not depend on accomplishment.”", "key": 1, "g": [["shifting from “belonging” to “achievement.”", "shift from A to B", "'A에서 B로 이동하다'. 정체성의 원천이 '소속'에서 '성취'로 바뀌고 있다는 것이 글의 전제다.", "v"], ["Speaking for many, Kymlicka says", "분사구문 + 순서의 열쇠", "'많은 사람을 대변하여'. Kymlicka의 주장(성취에 기대지 않는 정체성이 더 안정적)은 필자의 생각과 반대다. 뒤에는 이를 this로 받아 반박하는 (C)가 온다.", "v"], ["if it does not depend on accomplishment", "조건절", "'성취에 의존하지 않으면'. Kymlicka는 성취 기반 정체성을 불안정하다고 본다.", "g"]]}], [{"label": "(C)", "en": "But this is absurd. Achievement increasingly is the basis for a satisfying life. To be sure, some people want unconditional acceptance by their “in” group. But more and more, people in rich countries achieve many of their identities.", "key": 1, "g": [["But this is absurd", "순서의 열쇠", "this = Kymlicka의 말. But으로 정면 반박한다. 인용 직후에 와야 자연스럽다.", "v"], ["To be sure, some people want", "양보 → 재반박", "'확실히 ~하긴 하다'. 상대 입장을 일부 인정한 뒤 But more and more로 다시 밀어붙인다.", "v"], ["people in rich countries achieve many of their identities", "(B)를 부르는 장치", "'부유한 나라 사람들'이 정체성을 성취한다. 이 사람들이 (B)의 They다.", "v"]]}], [{"label": "(B)", "en": "They choose their careers, friendships, allies, mixing and matching pieces and styles. Even their ethnic, racial, and national affiliations are forged in various ways, despite the fact that a person’s self-image depends partly on how he’s viewed by others.", "g": [["They choose their careers", "순서의 열쇠", "They = (C)의 people in rich countries. 정체성을 '성취한다'는 (C)의 주장을 구체적으로(직업, 교우, 협력자) 보여 준다.", "v"], ["mixing and matching pieces and styles", "분사구문", "'구성 요소와 방식을 섞고 맞추면서'. 앞 절에 동시 상황을 덧붙인다.", "g"], ["despite the fact that", "despite + the fact that절", "despite는 전치사여서 절을 바로 못 받으므로 the fact that ~ 로 명사절을 연결했다. that절은 the fact와 동격이다.", "g"]]}], [{"label": "(A)", "en": "Indeed, the ability to make one’s own self is the essence of freedom. A good society recognizes and does not pit roots and wings against one another. If roots are the necessary condition for happiness, then wings are the sufficient condition. A good life is not possible without both.", "key": 1, "g": [["Indeed, the ability to make one’s own self", "순서의 열쇠", "Indeed로 (B)의 구체적 예를 일반화한다: 스스로 자아를 만드는 능력 = 자유의 핵심. 주어진 글의 첫 문장(정체성 선택의 자유가 중요하다)과 호응하는 결론이다.", "v"], ["does not pit roots and wings against one another", "pit A against B", "'A와 B를 싸우게 하다'. 뿌리(소속) vs 날개(성취)를 대립시키지 않는다는 비유다.", "v"], ["not possible without both", "이중 부정", "'둘 다 없이는 불가능하다' = 둘 다 필요하다. 소속과 성취 모두를 인정하는 결론이다.", "g"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)의 Indeed는 앞의 구체적 예를 일반화하는 결론이다. 인용 직후 결론이 올 수 없다."], ["(B) – (A) – (C)", false, "(B)의 They가 가리킬 사람들(부유한 나라 사람들)이 아직 나오지 않았다."], ["(B) – (C) – (A)", false, "같은 이유로 (B)가 주어진 글 바로 뒤에 올 수 없다. Kymlicka의 말은 this로 받아 반박(C)해야 한다."], ["(C) – (A) – (B)", false, "(B)의 They는 (C)의 people in rich countries를 받으므로 (B)가 (C) 바로 뒤여야 하고, (A)는 결론이다."], ["(C) – (B) – (A)", true, "정답. Kymlicka: 성취에 기대지 않는 정체성이 안정적 → (C) 그러나 이는 터무니없다. 부유한 나라 사람들은 정체성을 성취한다 → (B) 그들(They)은 직업·교우·소속까지 스스로 선택한다 → (A) 참으로 자아를 만드는 능력이 자유의 핵심이다."]], "flow": ["주어진 글 — 정체성의 원천이 소속→성취로 이동. Kymlicka: 성취에 기대지 않는 정체성이 더 안정적", "(C) But this — 터무니없다. 성취가 만족스러운 삶의 토대이고, 부유한 나라 사람들은 정체성을 성취한다", "(B) They — 직업, 교우, 협력자, 심지어 민족·국가적 소속까지 스스로 구축한다", "(A) Indeed — 자아를 만드는 능력이 자유의 핵심. 뿌리(필요조건)와 날개(충분조건) 둘 다 필요"], "bg": "Will Kymlicka는 캐나다의 정치철학자로, 개인의 정체성이 문화 공동체 소속에 뿌리를 두어야 안정적이라는 다문화주의 이론을 폈다. 이 글의 필자는 그에 반대하며 현대인은 정체성을 '물려받는' 것이 아니라 '만들어 간다'고 주장한다. 마지막의 '뿌리와 날개'는 소속(roots)과 성취(wings)의 비유로, 둘을 대립시키지 않는 사회가 좋은 사회라는 절충으로 끝난다. 순서 문제로는 this(인용 반박) → They(부유한 나라 사람들) → Indeed(일반화)라는 연결이 핵심이다.", "quiz": [{"q": "Kymlicka의 주장은?", "opts": ["성취에 기반한 정체성이 더 안정적이다", "성취에 의존하지 않는 정체성이 더 안정적이다", "정체성은 선택할 수 없다"], "a": 1, "exp": "“identification is more secure, less liable to be threatened, if it does not depend on accomplishment.”"}, {"q": "(A)에서 '뿌리'와 '날개'는 각각 무엇의 조건인가?", "opts": ["뿌리는 필요조건, 날개는 충분조건", "뿌리는 충분조건, 날개는 필요조건", "둘 다 필요조건"], "a": 0, "exp": "If roots are the necessary condition for happiness, then wings are the sufficient condition."}]}, {"no": 3405, "dn": "5", "label": "DAY 34 · 5번", "type": "문장 넣기", "answer": 5, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은? [3점]", "given": "Negative affect thus improved the accurate distinction of truths from lies in the observed interviews.", "subject": "슬픈 기분이 거짓말을 더 잘 잡아낸다", "vocab": [["affect", "감정, 정서", 1, "🎭", "Negative affect thus improved the accurate distinction of truths from lies in the observed interviews.", "n"], ["distinction", "구별, 구분", 1, "⚖️", "… improved the accurate distinction of truths from lies …", "n"], ["reject", "거부하다, 부인하다", 4, "❌", "… researchers asked either happy or sad participants to accept or reject the videotaped statements of targets …", "v"], ["instruct", "지시하다", 7, "📋", "The targets were instructed to either steal or leave in place a movie pass in an empty room …", "v"], ["deny", "부인하다", 9, "🙅", "… and then deny taking the movie ticket.", "v"], ["detect", "감지하다, 알아내다", 14, "🕵️", "… were significantly better at correctly detecting deceptive (guilty) targets.", "v"], ["consistent with", "~와 일치하는", 19, "✔️", "… consistent with the predicted mood-induced processing differences.", "phr"]], "pages": [[{"en": "To explore the effects of mood on communication, researchers asked either happy or sad participants to accept or reject the videotaped statements of targets who were questioned after a staged theft, and were either guilty, or not guilty.", "g": [["asked either happy or sad participants to accept or reject", "ask + O + to-v / either A or B", "'O에게 ~하도록 요청하다'. 참여자는 행복하거나 슬픈 기분 두 집단, 판단은 수용 또는 거부다.", "g"], ["who were questioned after a staged theft", "주격 관계대명사절", "targets를 수식한다. and were either guilty, or not guilty도 같은 관계사절 안의 동사구다." 정리한 뒤, 신호 감지 분석'도(also)' 이를 확증했다는 추가 근거가 이어진다.", "( ⑤ ) A signal detection analysis also confirmed that sad judges were more accurate in detecting deception (identifying guilty targets as guilty) than were neutral or happy judges, consistent with the predicted mood-induced processing differences."]], "flow": ["설정 — 행복/슬픈 참여자에게 꾸민 절도 사건 피의자의 녹화 진술을 판단하게 함", "절차 — 피의자는 영화표를 훔치거나 두고, 모두 '안 가져갔다'고 부인 → 일부는 거짓, 일부는 진실", "결과 1 — 긍정적 기분: 부인을 진실로 잘 받아들임", "결과 2 — 슬픈 기분: 유죄 판정이 많고, 거짓말하는 사람을 훨씬 잘 가려냄", "⑤ 주어진 문장 — 그러므로 부정적 감정이 진실·거짓 구별을 향상 / 신호 감지 분석도 이를 확증"], "bg": "사회심리학자 Joseph Forgas의 연구로, 슬픈 기분은 정보를 꼼꼼히 따지는 '상향식' 처리를, 행복한 기분은 기존 인상에 의존하는 '하향식' 처리를 유도한다는 이론에 바탕을 둔다. 그래서 기분이 좋은 사람은 남의 말을 잘 믿고, 기분이 가라앉은 사람은 의심하며 거짓을 더 잘 잡아낸다. 문장 넣기로는 주어진 문장의 Negative affect와 thus, 그리고 뒤 문장의 also가 결정적 단서다.", "quiz": [{"q": "실험에서 슬픈 기분의 참여자들은 어떤 특징을 보였는가?", "opts": ["부인을 진실로 잘 받아들였다", "유죄 판정을 더 많이 내리고 거짓말하는 사람을 더 잘 가려냈다", "판단을 거부했다"], "a": 1, "exp": "Sad participants made significantly more guilty judgements, and were significantly better at correctly detecting deceptive (guilty) targets."}, {"q": "영상 속 피의자들이 지시받은 것은?", "opts": ["영화표를 훔치거나 두고, 가져간 것을 부인하기", "진실만 말하기", "카메라 앞에서 자백하기"], "a": 0, "exp": "instructed to either steal or leave in place a movie pass ~ and then deny taking the movie ticket."}]}, {"no": 3501, "dn": "1", "label": "DAY 35 · 1번", "type": "글의 제목", "answer": 4, "q": "다음 글의 제목으로 가장 적절한 것은?", "subject": "사람들은 자기 능력을 과대평가한다", "vocab": [["rate", "평가하다", 2, "📊", "… asked high school test takers to rate themselves on a host of criteria.", "v"], ["a host of", "다수의", 2, "📚", "… to rate themselves on a host of criteria.", "phr"], ["median", "중앙값", 4, "📏", "Eighty-five percent considered themselves above the median in getting along with others …", "n"], ["capable", "능력 있는, 유능한", 8, "💪", "Remarkably, the least capable people often have the largest gaps …", "a"], ["overstate", "과장하다", 13, "📢", "… the poorest performers dramatically overstated their ability …", "v"], ["confront", "직면하다" e poorest performers dramatically overstated their ability, thinking that they would be in the second-highest quartile.", "key": 1, "g": [["thinking that they would be", "분사구문", "and they thought that ~ 를 줄인 형태다. 과장의 구체적 내용을 덧붙인다.", "g"]]}, {"en": "However, they turned in results in the bottom quartile.", "g": [["However", "인식 vs 현실", "두 번째로 높은 사분위수라고 생각했지만 실제로는 최하위. 인식과 현실의 격차가 여기서 극적으로 드러난다.", "v"], ["turned in results", "turn in", "'(성적·기록을) 거두다'. '제출하다'라는 뜻도 있다.", "v"]]}, {"en": "Even when confronted with their actual results, many of these individuals still struggled to accurately assess their own abilities, often maintaining an inflated perception of their skills.", "key": 1, "g": [["Even when confronted with", "접속사를 남긴 분사구문", "Even when (they were) confronted with ~. 뜻을 분명히 하려고 접속사 when을 생략하지 않았다.", "g"], ["often maintaining", "부대 상황의 분사구문", "'~을 유지한 채로'. 결과를 보고도 과장된 인식이 바뀌지 않았다는 마무리다.", "g"]]}]], "choices": [["Ignore Your Weaknesses, Focus on Your Strengths", false, "약점을 무시하라는 조언은 없다. 오히려 사람들이 자기 약점을 못 본다는 것이 글의 요지다."], ["How We Can Discover the Truth About Our Abilities", false, "능력의 진실을 '발견하는 방법'은 제시되지 않는다. 결과를 보여 줘도 못 고쳤다고만 했다."], ["No Wonder Overestimating Your Abilities Leads to Success", false, "과대평가가 성공으로 이어진다는 내용은 없다. 가장 무능한 사람이 가장 크게 과대평가한다고 했다."], ["Between Perception and Reality: Overestimating Abilities", true, "정답. 설문과 실험 모두에서 사람들이 생각하는 능력(perception)과 실제 성취(reality) 사이에 큰 격차가 있었다."], ["The Inflated Self: The Perils of Overconfidence", false, "'위험(perils)'이 지나치다. 과신이 어떤 해를 끼치는지는 다루지 않고, 격차가 존재한다는 사실만 보여 준다."]], "flow": ["도입 — College Board 설문: 학생 대다수가 자신을 중앙값 위라고 평가했다", "추가 — 운전자의 80퍼센트 이상이 자신이 절반보다 낫다고 믿는다", "핵심 — 가장 능력이 없는 사람이 인식과 현실의 격차가 가장 크다", "실험 — 문법 시험 최하위권이 자신을 두 번째로 높은 사분위수라고 예측했다", "결론 — 실제 결과를 보여 줘도 과장된 인식을 유지했다"], "bg": "심리학에서 '더닝-크루거 효과'로 알려진 현상이다. 능력이 부족한 사람은 자신의 부족함을 알아차릴 능력 자체가 부족해서 스스로를 과대평가하기 쉽다는 것이다. 문법 시험 연구는 1999년 더닝과 크루거의 원래 실험 중 하나다. 시험 뒤 '이번엔 잘 본 것 같다'는 느낌과 실제 점수가 얼마나 일치했는지 학생들에게 물어보면 실감 나는 지문이다.", "quiz": [{"q": "글에 따르면 }, {"en": "In many cases, we think that because such advantages are earned through hard work or special knowledge they are therefore deserved.", "g": [["because such advantages are earned", "that절 안의 이유 부사절", "that절의 주어·동사는 they are deserved이고, because절은 그 앞에 끼어든 이유 부사절이다. because절이 끝나는 지점(knowledge)을 찾는 것이 독해의 열쇠다.", "g"], ["In many cases", "대조의 첫 축", "'많은 경우엔' 이점이 정당하다고 본다. 뒤의 in other cases와 짝을 이룬다.", "v"]]}, {"en": "However, in other cases, we may feel that such restricted access to some technologies gives certain individuals or groups unfair advantages over others, and we seek to extend access to everyone in the society.", "key": 1, "g": [["However, in other cases", "대조의 둘째 축", "정당한 이점(앞 문장) vs 불공평한 이점(이 문장). 빈칸의 '공정성'과 '기회의 평등'이 여기서 나온다.", "v"], ["gives certain individuals or groups unfair advantages", "4형식 give + IO + DO", "'특정 개인이나 집단에게 불공평한 이점을 주다'. 간접목적어가 길어서 구조가 잘 안 보인다.", "g"], ["seek to extend access to everyone", "seek to-v", "'~하려고 애쓰다'. 모두에게 접근을 넓히는 것 = 기회의 평등이다.", "v"]]}], [{"en": "Public libraries, for instance, were built to ensure that everyone could obtain access to books and learning.", "g": [["for instance", "예시의 신호", "접근을 모두에게 확대하려는 노력의 예 1: 공공 도서관.", "v"], ["were built to ensure that", "목적의 to부정사", "'~을 보장하기 위해 세워졌다'. ensure 뒤에 that절이 목적어로 온다.", "g"]]}, {"en": "Today, we are putting computers and Internet connections into public schools for the same reason.", "g": [["for the same reason", "예 2의 연결", "도서관과 '같은 이유', 즉 모든 사람에게 접근을 보장하려고 학교에 컴퓨터를 넣는다.", "v"]]}, {"en": "______ thus can be occasioned by technological innovation.", "key": 1, "g": [["______ thus", "빈칸의 논리", "thus는 앞 내용을 종합하는 결론 신호다. 신기술 → 일부만 이점 → 불공평하다고 느끼면 접근을 확대하려 한다. 이는 '공정성과 기회의 평등' 문제다.", "v"], ["can be occasioned by", "수동태", "occasion이 '~을 야기하다'라는 동사로 쓰였다. '기술 혁신에 의해 야기될 수 있다'.", "g"]]}]], "choices": [["Increases in investment demand", false, "투자 수요는 글에 나오지 않는다. 글은 누가 기술에 접근하느냐를 다룬다."], ["Radical change to markets and industries", false, "시장·산업의 변화는 언급되지 않는다. 사회 구성원 사이의 이점 차이 ns …", "a"], ["impulse", "욕구, 충동", 12, "⚡", "We are all more or less conscious of the constant impulse which urges us on to ⑤ expression …", "n"], ["trace A back", "A를 거슬러 올라가다", 16, "🔙", "… if we trace this instinctive desire back far enough, we reach the beginnings of art.", "phr"]], "pages": [[{"en": "Broadly speaking, art exists as a consequence of the universal human desire for sympathy.", "key": 1, "g": [["Broadly speaking", "독립분사구문(관용)", "'대체로 말하자면'. generally speaking, strictly speaking처럼 주어와 무관하게 쓰는 관용 표현이다.", "g"], ["the universal human desire for sympathy", "글의 열쇠말", "'공감받고 싶은 욕구'. 이 글의 모든 문장은 이 욕구를 풀어 쓴 것이고, 마지막 문장에서 다시 예술과 연결된다.", "v"]]}, {"en": "Man is forever endeavoring to break down the wall which ① separates him from his fellows.", "g": [["① separates", "① 적절", "벽(wall)은 나와 남을 '분리하는' 것이다. 그 벽을 허물려 애쓴다는 것은 남과 통하고 싶다는 뜻이므로 문맥에 맞다.", "v"], ["the wall which", "주격 관계대명사", "which가 the wall을 받아 관계사절의 주어 역할을 한다. separates가 단수인 것은 선행사 the wall에 맞춘 것이다.", "g"]]}, {"en": "Whether we call it egotism or simply humanity, we all know the wish to make others ② appreciate our feelings; to show them how we suffer, how we enjoy.", "g": [["Whether we call it egotism or simply humanity", "양보의 whether A or B", "'A라 부르든 B라 부르든'. 이름이 무엇이든 그 소망 자체는 누구에게나 있다는 뜻이다.", "g"], ["make others ② appreciate", "② 적절 / 사역동사 make", "make + O + 동사원형. appreciate는 여기서 '감사하다'가 아니라 '이해하다'. 남이 내 감정을 이해하게 하려는 소망이므로 맞다.", "v"]]}, {"en": "We batter our fellowmen with our opinions sufficiently often, but this is ③ nothing in comparison to the insistence with which we pour out our feelings.", "g": [["③ nothing in comparison to", "③ 적절", "'~에 비하면 아무것도 아니다'. 의견을 퍼붓는 것도 잦지만 감정을 쏟아내는 집요함은 훨씬 더하다는 비교이므로 맞다.", "v"], ["the insistence with which we pour out", "전치사 + 관계대명사", "we pour out our feelings with insistence에서 with insistence가 관계사로 앞에 나갔다. '~하는 집요함'.", "g"]]}], [{"en": "A friend is the most valued of earthly possessions largely because he is willing to receive without appearance of ④ patience the s invariable, the context … is very context specific."}, {"q": "동물이 표정으로 감정을 감추는 예로 든 것은?", "opts": ["놀이 싸움 중 무표정으로 상대를 놀라게 하는 것", "먹이를 숨기는 것", "잠자는 척하는 것"], "a": 0, "exp": "as is seen when an animal with a blank face surprises another while play fighting."}]}, {"no": 3505, "dn": "5", "label": "DAY 35 · 5번", "type": "요약문 완성", "answer": 3, "q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "summary": "Young professors who wrote (A)__________ were more likely to succeed in their career than those who wrote (B)__________.", "subject": "매일 조금씩 쓰는 교수가 성공한다", "vocab": [["look into", "~을 조사하다", 1, "🔍", "One researcher, Bob Boice, looked into the writing habits of young professors …", "phr"], ["track", "추적하다", 2, "🛰️", "… and tracked them to see how they did.", "v"], ["manuscript", "원고", 7, "📄", "… then write a manuscript in a burst of intense energy …", "n"], ["burst", "터뜨림; 파열", 7, "💥", "… write a manuscript in a burst of intense energy, over perhaps a week or two …", "n"], ["follow up on", "~을 더 알아보다", 11, "📞", "When Boice followed up on the group some years later …", "phr"], ["diverge", "갈라지다, 달라지다", 12, "🔀", "… he found that their paths had diverged sharply.", "v"], ["binge", "단기간에 지나치게 몰아서 하는 것", 14, "🌙", "The so-called “binge writers” did far less well …", "n"]], "pages": [[{"en": "One researcher, Bob Boice, looked into the writing habits of young professors just starting out and tracked them to see how they did.", "g": [["looked into the writing habits", "동사의 병렬", "looked into와 뒤의 tracked가 and로 연결된다. look into는 '조사하다'.", "g"], ["just starting out", "현재분사구", "young professors를 뒤에서 수식한다. '이제 막 시작하는'.", "g"], ["to see how they did", "목적의 to부정사 + 간접의문문", "'그들이 어떻게 지내는지 보기 위해'. how they did는 see의 목적어인 명사절이다.", "g"]]}, {"en": "Not surprisingly, in a job where there is no real boss and no one sets schedules or tells you what to do, these young professors took a variety of approaches.", "g": [["a job where there is no real boss", "관계부사 where", "a job을 수식한다. 장소가 아닌 '일'도 상황·환경의 의미로 where를 쓴다.", "g"], ["a variety of approaches", "전개의 예고", "'다양한 접근법'. 뒤에 Some / Others / Others로 세 유형이 나온다.", "v"]]}, {"en": "Some would collect information until they were ready and then write a manuscript in a burst of intense energy, over perhaps a week or two, possibly including some long days and very late nights.", "key": 1, "g": [["Some would collect", "Some ~ Others / 과거 습관 would", "유형 1: 몰아서 쓰는 사람들. would는 '~하곤 했다'는 과거의 습관이다. 요약문 (B)의 frantically(미친 듯이)에 해당한다.", "v"], ["in a burst of intense energy", "(B)의 근거", "'강렬한 에너지를 한꺼번에 터뜨리며' 밤늦게까지. 이것이 binge writing이다.", "v"]]}, {"en": "Others worked at a steadier pace, trying to write a page or two every day.", "key": 1, "g": [["Others worked at a steadier pace", "(A)의 근거", "유형 2: 꾸준히 쓰는 사람들. 매일 한두 쪽 = routinely and moderately(일상적이고 적정하게).", "v"], ["trying to write", "분사구문", "as they tried to write ~ 와 같다. 동시 동작을 나타낸다.", "g"]]}], [{"en": "Others were in between.", "g": [["in between", "세 번째 유형", "'그 중간'. 세 유형을 다 소개했으니 다음은 결과다.", "v"]]}, {"en": "When Boice followed up on the group some years later, he found that their paths had diverged sharply.", "g": [["had diverged", "과거완료", "found(과거)보다 앞서 일어난 일이므로 과거완료를 썼다. 몇 년 사이에 이미 갈라져 있었다는 뜻이다.", "g"]]}, {"en": "The page-a-day folks had done well and generally gotten tenure.", "key": 1, "g": [["The page-a-day folks", "복합 형용사", "하이픈으로 묶은 page-a-day가 folks를 수식한다. '하루 한 쪽 쓰는 사람들' = 꾸준파.", "g"], ["had done well and generally gotten tenure", "과거완료의 병렬", "had done과 (had) gotten이 병렬. 결과: 꾸준파가 성공했다.", "g"]]}, {"en": "The so-called “binge writers” did far less well, and many had had their careers cut short.", "key": 1, "g": [["did far less well", "비교급 강조 far", "far가 less well을 강조한다. '훨씬 못했다'. 몰아치기파의 결과다.", "g"], ["had had their careers cut short", "have + O + p.p.", "'경력이 짧게 끊기는 일을 당했다'. 앞의 had는 과거완료 조동사, 뒤의 had가 본동사다.", "g"]]}]], "choices": [["objectively but plainly – academically", false, "객관적·학술적 글쓰기 여부는 글에 없다. 비교의 축은 '얼마나 꾸준히 vs 몰아서'다."], ["analytically and steadily – intensively", false, "steadily와 intensively는 맞지만 analytically(분석적으로)는 근거가 없다. (A)의 두 단어가 모두 맞아야 한다."], ["routinely and moderately – frantically", true, "정답. 매일 한두 쪽씩(routinely and moderately) 쓴 사람들이 종신 재직권을 얻었고, 밤새워 몰아서(frantically) 쓴 사람들은 경력이 끊겼다."], ["constantly and skeptically – assertively", false, "constantly는 가깝지만 skeptically(회의적으로)와 assertively(단정적으로)는 글과 무관하다."], ["factually but interestingly – logically", false, "글의 내용이 사실적인지 흥미로운지는 다루지 않는다. 글쓰기의 '습관'이 주제다."]], "flow": ["도입 — Bob Boice가 신임 교수들의 글쓰기 습관을 조사하고 추적했다", "유형 — 상사도 일정도 없는 일이라 접근법이 다양했다", "유형 1 — 준비되면 1~2주 밤새워 몰아서 쓴다 / 유형 2 — 매일 한두 쪽 꾸준히 / 유형 3 — 중간", "결과 — 몇 년 뒤 행로가 급격히 갈렸다", "결론 — 하루 한 쪽파는 종신 재직권을 얻었고, 몰아치기파는 경력이 끊겼다"], "bg": "Bob Boice는 대학교수들의 글쓰기와 생산성을 오래 연구한 심리학자로, '조금씩 규칙적으로 쓰기'가 몰아쓰기보다 생산량도 많고 창의적 아이디어도 더 많이 낳는다는 결과를 발표했다. 시험 전날 벼락치기와 매일 복습의 차이와 같은 이야기이므로 학생들에게 그대로 적용해 볼 만하다. 요약문 문제에서는 (A)와 (B)가 서로 반대 방향이어야 한다는 점, 그리고 두 단어짜리 (A)는 둘 다 근거가 있어야 한다는 점을 확인한다.", "quiz": [{"q": "몇 년 뒤 종신 재직권을 대체로 얻은 사람들은?", "opts": ["몰아서 쓰는 사람들", "하루에 한 쪽씩 쓰는 사람들", "중간 유형의 사람들"], "a": 1, "exp": "The page-a-day folks had done well and generally gotten tenure."}, {"q": "젊은 교수들이 다양한 접근법을 취한 이유로 제시된 것은?", "opts": ["연구 분야가 달랐기 때문", "상사도 없고 일정을 정해 주는 사람도 없었기 때문", "월급이 달랐기 때문"], "a": 1, "exp": "in a job where there is no real boss and no one sets schedules or tells you what to do."}]}, {"no": 3601, "dn": "1", "label": "DAY 36 · 1번", "type": "빈칸 추론", "answer": 5, "q": "다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]", "blankTpl": "Such buildings make difficult demands on structural engineers, who have to ▢.", "subject": "기이한 도시 건축과 구조 공학자의 과제", "vocab": [["proportion", "비율", 2, "📊", "… and the proportion is likely to continue to increase in the foreseeable future.", "n"], ["foreseeable", "예견할 수 있는", 3, "🔭", "… continue to increase in the foreseeable future.", "a"], ["perceive", "인지하다", 6, "👁️", "Some architects have decided to respond to what they perceive to be the potentially formless and anonymous nature of the city …", "v"], ["anonymous", "특색 없는; 무명의", 7, "🏙️", "… the potentially formless and anonymous nature of the city …", "a"], ["landmark", "랜드마크, 주요 지형지물", 9, "🗼", "… buildings that are obviously strange and are intended to become urban landmarks.", "n"], ["of no consequence", "전혀 중요하지 않은", 12, "🪶", "… make it seem as if gravity is of no consequence.", "phr"], ["structural engineer", "구조 공학자", 13, "📐", "Such buildings make difficult demands on structural engineers …", "n"]], "pages": [[{"en": "Over half the human population of the planet now lives in cities, and the proportion is likely to continue to increase in the foreseeable future.", "g": [["Over half the human population of the planet now lives", "수 일치", "주어의 핵심은 half the population(단수 취급)이므로 동사가 lives다. of the planet에 낚이지 않는다.", "g"], ["is likely to continue to increase", "be likely to-v", "'~할 것 같다'. to continue to increase로 to부정사가 연달아 온다.", "g"]]}, {"en": "Building in cities is becoming more and more important, and urban form and urban architecture are the focus of much debate.", "g": [["Building in cities is becoming", "동명사 주어 + 단수 동사", "Building이 동명사 주어이므로 단수 동사 is를 썼다. '건물을 짓는 것'.", "g"], ["more and more important", "비교급 and 비교급", "'점점 더 ~한'. 도시 건축의 중요성이 커진다는 배경 제시다.", "g"]]}, {"en": "Some architects have decided to respond to what they perceive to be the potentially formless and anonymous nature of the city by creating buildings that are obviously strange and are intended to become urban landmarks.", "key": 1, "g": [["what they perceive to be", "관계대명사 what + perceive O to be", "respond to의 목적어인 what절. perceive A to be B(A를 B라고 인지하다)에서 A가 what으로 빠져나갔다.", "g"], ["by creating buildings", "by + v-ing", "'~을 만듦으로써'. 건축가들의 대응 방식 = 기이한 건물 짓기.", "v"], ["that are obviously strange and are intended to become", "관계사절 안의 병렬", "buildings를 수식하는 that절 안에서 are strange와 are intended가 and로 연결된다.", "g"]]}, {"en": "One of the simplest ways of making a building look unusual is to break the normal rules of structure — or at least make it seem as if gravity is of no consequence.", "key": 1, "g": [["One of the simplest ways of making a building look unusual is", "One of + 복수명사 + 단수 동사", "주어의 핵심은 One이므로 동사는 is. making a building look에서 make + O + 동사원형(사역).", "g"], ["make it seem as if gravity is of no consequence", "사역동사 + as if", "make + it + seem(동사원형). as if는 '마치 ~인 것처럼'. 중력을 무시하는 듯한 형태 = 빈칸의 paradoxical forms다.", "v"]]}, {"en": "Such buildings make difficult demands on structural engineers, who have to ______.", "key": 1, "g": [["Such buildings", "지시어의 회수", "= 구조 규칙을 깨거나 중력이 없는 듯 보이는 건물들. 이 건물들이 공학자에게 요구하는 것이 빈칸이다.", "v"], [", who have to", "계속적 용법의 who", "structural engineers를 받아 '그런데 그들은 ~해야 한다'고 덧붙인다.", "g"], ["______", "빈칸의 논리", "중력이 없는 '것처럼 보이게' 하려면 실제로는 서 있게 만들되(paradoxical forms work) 그 비결은 드러나지 않아야 한다(concealing how the trick is pulled off). 앞 문장의 seem as if가 열쇠다.", "v"]]}]], "choices": [["design the buildings to be easily recognized from various angles", false, "여러 각도에서 알아보기 쉽게 하는 것은 건축가의 랜드마크 의도이지, 구조 공학자에게 가해지는 '까다로운 요구'가 아니다."], ["negotiate the tension between practicality and beauty of a building", false, "실용성과 아름다움의 긴장은 언급되지 않는다. 글의 긴장은 '중력을 무시하는 듯한 형태 vs 실제로 서 있어야 함'이다."], ["achieve anything that brings themselves both reputation and status", false, "공학자의 명성이나 지위는 무관하다."], ["understand both the technological evolution and architectural aesthetics", false, "기술의 진화와 미학을 이해하라는 일반론은 앞 문장의 '중력이 없는 것처럼 보이게'라는 구체적 과제와 연결되지 않는다."], ["make paradoxical forms work while concealing how the trick is pulled off", true, "정답. 중력이 중요하지 않은 '것처럼 보이게' 만들려면 역설적인 형태를 실제로 서 있게 하면서도 그 비결은 감춰야 한다. seem as if가 그대로 trick으로 이어진다."]], "flow": ["배경 — 인구의 절반 이상이 도시에 살고 그 비율은 계속 는다", "화제 — 도시 건축이 중요해지고 도시의 형태가 논쟁의 중심이다", "대응 — 일부 건축가는 특색 없는 도시에 맞서 기이한 랜드마크 건물을 짓는다", "방법 — 구조 규칙을 깨거나 중력이 없는 것처럼 보이게 한다", "결과(빈칸) — 구조 공학자는 그 역설적 형태를 실제로 서 있게 하면서 비결은 감춰야 한다"], "bg": "빌바오 구겐하임 미술관이나 서울의 DDP처럼 뒤틀리고 떠 있는 듯한 건물은 겉으로는 중력을 무시하는 것 같지만, 그 안에는 보이지 않는 철골과 캔틸레버 구조가 숨어 있다. 건축가가 '형태'를 그리면 구조 공학자는 그것이 실제로 서 있도록 '속임수'를 설계하고 감춘다. 빈칸 문제에서는 앞 문장의 seem as if(~인 것처럼 보이게)가 '실제와 겉보기가 다르다'는 힌트임을 잡는 것이 핵심이다.", "quiz": [{"q": "일부 건축가들이 기이한 건물을 짓기로 한 이유는?", "opts": ["건축비를 아끼기 위해", "형체 없고 특색 없는 도시의 속성에 대응하기 위해", "중력 실험을 위해"], "a": 1, "exp": "to respond to what they perceive to be the potentially formless and anonymous nature of the city by creating buildings that are obviously strange."}, {"q": "건물이 특이해 보이게 만드는 가장 단순한 방법으로 제시된 것은?", "opts": ["색을 화려하게 칠하는 것", "구조의 통상적인 규칙을 깨는 것", "높이를 최대한 높이는 것"], "a": 1, "exp": "One of the simplest ways of making a building look unusual is to break the normal rules of structure."}]}, {"no": 3602, "dn": "2", "label": "DAY 36 · 2번", "type": "글의 순서", "answer": 2, "order": true, "q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? [3점]", "subject": "화석 연료 설비 교체가 더딘 이유", "vocab": [["extract", "추출하다", 1, "⛏️", "… the facilities that extract fossil fuels from the ground and burn them …", "v"], ["capacity", "능력", 5, "🏗️", "If the world had the capacity to deliver one of the largest nuclear power plants ever built once a week …", "n"], ["week in and week out", "매주 계속", 7, "📅", "… once a week, week in and week out, it would take 20 years …", "phr"], ["retire", "물러나게 하다, 폐기하다", 10, "🗑️", "… and retires old ones almost as quickly.", "v"], ["leave aside", "~을 차치하다, 제쳐 놓다", 11, "↪️", "Leaving aside the political lobbying power that such investment can command …", "phr"], ["substitute", "대체의; 대체물", 14, "🔁", "… even if there were perfect substitute technologies to hand …", "a"], ["scale up", "(규모를) 확대하다", 15, "📈", "… perfect substitute technologies to hand that simply needed scaling up.", "phr"]], "pages": [[{"label": "주어진 글", "en": "The world has made huge investments in the facilities that extract fossil fuels from the ground and burn them — mines, oil wells, power stations, hundreds of thousands of ships and aircraft, a billion motor vehicles.", "key": 1, "g": [["huge investments", "순서의 열쇠", "이 '막대한 투자'를 (B)의 such investment가 받는다. 그래서 (B)가 바로 뒤에 온다.", "v"], ["that extract fossil fuels from the ground and burn them", "주격 관계대명사절의 병렬", "the facilities를 수식하며 extract와 burn이 and로 연결된다. them은 fossil fuels다.", "g"], ["— mines, oil wells, power stations", "대시의 나열", "the facilities의 구체적 목록. 이 설비들이 뒤에서 '교체해야 할 장비(kit)'가 된다.", "v"]]}], [{"label": "(B)", "en": "Leaving aside the political lobbying power that such investment can command, there would be a limit to how quickly that much kit could be replaced even if there were perfect substitute technologies to hand that simply needed scaling up.", "key": 1, "g": [["such investment", "순서의 열쇠", "주어진 글의 huge investments를 받는다. 이 지시어 하나로 (B)가 첫 번째임이 확정된다.", "v"], ["Leaving aside the political lobbying power", "양보의 분사구문", "'~은 차치하더라도'. 로비의 문제는 빼고 순전히 속도의 문제만 따져 보겠다는 뜻이다.", "g"], ["a limit to how quickly that much kit could be replaced", "전치사 to + 간접의문문", "'얼마나 빨리 교체될 수 있는지에 한계'. 이 '한계'가 (A)와 (C)의 숫자로 구체화된다.", "v"], ["even if there were perfect substitute technologies", "가정법 과거", "현재 사실의 반대. 완벽한 대체 기술은 아직 없지만, 있다 해도 속도에 한계가 있다는 뜻이다.", "g"]]}], [{"label": "(A)", "en": "If the world had the capacity to deliver one of the largest nuclear power plants ever built once a week, week in and week out, it would take 20 years to replace the current stock of coal-fired plants (at present, the world builds about three or four nuclear power plants a year, and retires old ones almost as quickly).", "g": [["If the world had the capacity to deliver", "가정법 과거 — (B)의 구체화", "(B)의 '완벽한 대체 기술이 있더라도'를 '매주 원전 하나씩 지을 수 있더라도'라는 구체적 가정으로 바꾼 것이다. 그래서 (B) 다음이다.", "v"], ["it would take 20 years to replace", "it takes 시간 to-v", "'~하는 데 (시간)이 걸리다'. 가정법 주절이라 would가 왔다.", "g"], ["coal-fired plants", "(C)를 부르는 장치", "여기서 처음 나온 '석탄 발전소'를 (C)의 those coal plants가 받는다.", "v"]]}], [{"label": "(C)", "en": "To replace those coal plants with solar panels at the rate such panels were installed in 2013 would take about a century and a half. That is all before starting on replacing the gas and the oil, the cars, the furnaces and the ships.", "key": 1, "g": [["those coal plants", "순서의 열쇠", "(A)의 coal-fired plants를 받는다. (A)가 먼저 나와야 those가 성립한다.", "v"], ["at the rate such panels were installed in 2013", "to부정사 주어 + 관계부사 생략", "To replace ~ 2013까지의 긴 to부정사구가 주어이고 동사는 would take다. the rate (at which) such panels were installed로 관계부사가 생략되었다.", "g"], ["That is all before starting on", "마무리", "석탄 발전소만 150년인데, 그것도 자동차·배 등은 손대기 전 이야기다. 주어진 글의 목록으로 돌아가며 글을 닫는다.", "v"]]}]], "choices": [["(A) – (C) – (B)", false, "(A)는 (B)가 말한 '교체 속도의 한계'를 숫자로 보여 주는 예다. 한계라는 말이 먼저 나와야 한다."], ["(B) – (A) – (C)", true, "정답. 막대한 투자 → (B) 그러한 투자(such investment) … 교체 속도에는 한계가 있다 → (A) 매주 원전을 지어도 석탄 발전소 교체에 20년 → (C) 그 석탄 발전소(those coal plants)를 태양광으로 바꾸면 150년."], ["(B) – (C) – (A)", false, "(C)의 those coal plants가 가리키는 coal-fired plants는 (A)에 나온다. (A)가 (C)보다 앞서야 한다."], ["(C) – (A) – (B)", false, "(C)의 those coal plants가 가리킬 대상이 아직 없다. 주어진 글에는 power stations만 있다."], ["(C) – (B) – (A)", false, "같은 이유로 (C)가 주어진 글 바로 뒤에 올 수 없다."]], "flow": ["주어진 글 — 세계는 화석 연료 설비(광산, 유정, 발전소, 배, 항공기, 차량)에 막대한 투자를 했다", "(B) such investment — 로비 문제는 빼더라도, 완벽한 대체 기술이 있어도 교체 속도에 한계가 있다", "(A) 예 1 — 매주 원전 하나씩 지어도 석탄 발전소 교체에 20년 (현실은 1년에 서너 개)", "(C) 예 2 — those coal plants를 2013년 속도로 태양광으로 바꾸면 150년. 자동차·배는 아직 시작도 안 한 것"], "bg": "에너지 전환이 더딘 이유를 '기존 설비의 규모' 자체에서 찾는 글이다. 이미 지어 놓은 발전소와 차량이 워낙 많아서, 아무리 좋은 대체 기술이 있어도 그것을 대량으로 지어 갈아 끼우는 데 수십 년이 걸린다는 논리다. 순서 문제로는 such investment(주어진 글의 investments), those coal plants((A)의 coal-fired plants)라는 두 지시어를 잡으면 된다. 태양광 설치 속도는 2013년 이후 크게 빨라졌으므로 숫자 자체보다 논리 구조에 집중하는 것이 좋다.", "quiz": [{"q": "매주 대형 원전 하나씩 지을 수 있다고 가정할 때 석탄 발전소를 모두 교체하는 데 걸리는 시간은?", "opts": ["약 3~4년", "약 20년", "약 150년"], "a": 1, "exp": "it would take 20 years to replace the current stock of coal-fired plants."}, {"q": "(B)에서 필자가 '차치하고' 논의에서 제외한 것은?", "opts": ["대체 기술의 비용", "투자가 행사하는 정치적 로비의 힘", "태양광의 효율"], "a": 1, "exp": "Leaving aside the political lobbying power that such investment can command."}]}, {"no": 3603, "dn": "3", "label": "DAY 36 · 3번", "type": "문장 넣기", "answer": 3, "q": "글의 흐름으로 보아, 주어진 문장이 들어가기 ge the fact that Americans have long depended on the labor of others to get dinner on the table.", "key": 1, "g": [["( ② )", "②의 판단", "넣을 수 없다. 주어진 문장은 '다른 사람의 노동에 의지해 왔다'는 이 문장의 주장을 구체화한 예다. 주장이 먼저 나와야 한다.", "v"], ["comparisons of today’s families with those of previous generations", "comparison of A with B", "'A와 B의 비교'. those는 families를 대신한다. 이 긴 주어의 동사가 fail이다.", "g"], ["the fact that Americans have long depended on the labor of others", "동격의 that", "the fact의 내용을 that절이 설명한다. 이 '다른 사람의 노동'이 주어진 문장의 여성들이다.", "g"]]}], [{"en": "( ③ ) The difference is that these women previously worked inside the home, as domestic laborers, rather than in restaurants.", "key": 1, "g": [["( ③ )", "③의 판단 — 정답", "these women이 가리킬 여성들이 앞에 없다. 주어진 문장의 '가난한 백인 여성과 유색 인종 여성'을 넣어야 these women이 성립하고, '한 세기 전이나 지금이나 요리했다'는 말 뒤에 '차이는 장소뿐'이라는 The difference가 자연스럽다.", "v"], ["these women", "지시어의 단서", "복수의 여성이 앞에 있어야 한다. 앞 문장에는 the labor of others만 있고 '여성'은 없다.", "v"], ["rather than in restaurants", "A rather than B", "'식당이 아니라 집 안에서'. 주어진 문장의 '한 세기 전 vs 오늘날'의 차이가 바로 이 장소다.", "g"]]}, {"en": "( ④ ) At the peak, almost two million domestic workers were employed in American households.", "g": [["( ④ )", "④의 판단", "넣을 수 없다. 앞 문장의 domestic laborers를 숫자로 뒷받침하는 문장이라 앞뒤가 이미 붙어 있다.", "v"], ["At the peak", "수치의 근거", "'절정기에는 2백만 명'. 집 안의 유급 요리 노동이 얼마나 흔했는지 보여 준다.", "v"]]}, {"en": "( ⑤ ) Anthropologist Amy Trubek notes that idealized visions of home cooking persistently neglect “the many generations of paid cooks who first worked in homes and then in commercial settings to make these meals possible.”", "key": 1, "g": [["( ⑤ )", "⑤의 판단", "넣을 수 없다. 전문가 인용으로 글을 마무리하는 자리다. 새 인물(여성들)을 소개하는 문장이 올 곳이 아니다.", "v"], ["who first worked in homes and then in commercial settings", "관계사절 안의 first ~ then", "'처음엔 가정에서, 그다음엔 상업 시설에서'. 주어진 문장과 ③ 다음 문장의 내용(집 안 → 식당)을 그대로 요약한다.", "g"], ["to make these meals possible", "목적의 to부정사 + make O C", "'이 식사들을 가능하게 하기 위해'. make + 목적어 + 형용사 보어.", "g"]]}]], "choices": [["( ① ) — And women
